n":"ছবি বা ছবির মতো grid data","why":"জায়গা বদলালেও চেনে","id":"convolutional-neural-network-cnn"},{"label":"Transformer","when":"লেখা বা ক্রম","why":"ক্রম ধরার জন্য তৈরি","id":"transformer"}],"history":[{"y":"১৯৮৯","t":"LeCun ও সহকর্মীরা 'Backpropagation Applied to Handwritten Zip Code Recognition' প্রকাশ করেন (Neural Computation, খণ্ড ১(৪), পৃ. ৫৪১–৫৫১): network-এর গঠনের ভেতরেই কাজের সীমাবদ্ধতা ঢুকিয়ে ডাকের zip code-এর হাতে-লেখা অঙ্ক চেনা।","s":"ML Anthology: LeCun et al. 1989","u":"https://mlanthology.org/neco/1989/lecun1989neco-backpropagation"}]},{"id":"recurrent-neural-network-rnn","name":"Recurrent Neural Network (RNN)","definition":"আগের ধাপের তথ্য একটি state-এ রেখে ধারাবাহিক input প্রক্রিয়া করে।","profile":{"why":"Sequence-এর বর্তমান ধাপ বুঝতে আগের তথ্য দরকার। State বহন করে সেই ধারাবাহিকতা কাজে লাগায়।","history":"Recurrent model-এর ইতিহাস আরও পুরনো; Elman-এর Finding Structure in Time (১৯৯০) simple RNN-এর গুরুত্বপূর্ণ milestone। LSTM: Hochreiter ও Schmidhuber, ১৯৯৭।","uses":"Sequence ও time-series modelling; ভাষা ও speech-এর ঐতিহাসিক ব্যবহার আছে। LSTM/GRU হলো গুরুত্বপূর্ণ gated variant।","status":"২০২৫: Forecasting S&P 500 Using LSTM Models report-এ S&P 500-এর সময়ভিত্তিক data forecast করতে LSTM ও ARIMA তুলনা করা হয়েছে। এটি গবেষণা-পরীক্ষা; লাভজনক trading-এর প্রমাণ নয়।","sources":[{"title":"Elman, 1990","url":"https://doi.org/10.1207/S15516709COG1402_1"},{"title":"LSTM, 1997","url":"https://www.bioinf.jku.at/publications/older/2604.pdf"},{"title":"PyTorch LSTM","url":"https://docs.pytorch.org/docs/stable/generated/torch.nn.LSTM.html"},{"title":"LSTM forecasting report, 2025","url":"https://arxiv.org/abs/2501.17366"}],"story":["একটি বাক্য বা সময়ের data-তে আগের অংশের খবর ছাড়া বর্তমান অংশ বোঝা কঠিন। RNN আগের ধাপের state পরের ধাপে নেয়। ফলে একই network বারবার চালিয়েও আগের তথ্যের প্রভাব রাখা যায়।","দীর্ঘ ব্যবধানের তথ্য শেখানো কঠিন হওয়ায় LSTM-এর মতো gated variant আসে। Gate দিয়ে কোন তথ্য রাখা বা বাদ দেওয়া হবে তা শেখানো হয়। Transformer-এর উত্থান এই পুরো পরিবারকে অদৃশ্য করেনি।"],"role":"LSTM হলো RNN পরিবারের variant; vanilla RNN-এর সঙ্গে হুবহু এক model নয়।"},"selection":{"problem":"পরপর আসা data-তে আগের state ব্যবহার করে prediction চাই।","when":"Sequence-এর order জরুরি; LSTM/GRU-সহ recurrent processing পরীক্ষা করতে চাও।","avoid":"দীর্ঘ dependency ও sequential training কঠিন হতে পারে; শুধু সময়ভিত্তিক data হলেই RNN সেরা নয়।","compare":"Linear forecasting baseline, temporal CNN বা Transformer-এর সঙ্গে একই সময়-ভিত্তিক split-এ তুলনা করো।","example":"Sensor-এর ধারাবাহিক reading থেকে পরের মান অনুমান।"},"seq":"৩","children":[{"id":"recurrent-state","name":"Recurrent State","definition":"আগের ধাপের তথ্য বহন করা মান, যা নতুন input-এর সঙ্গে update হয়।","insight":{"fact":"প্রতিটি ধাপে state বদলাতে পারে, কিন্তু একই RNN weights পুনর্ব্যবহৃত হয়। State পরিবর্তন আর parameter update এক জিনিস নয়।"},"story":{"problem":"আগের অংশ মনে রাখা না গেলে লম্বা ক্রম বোঝা যায় না।","idea":"প্রতিটা ধাপে আগের স্মৃতি আর নতুন input মিলে নতুন স্মৃতি, যা পরের ধাপে যায়।"}},{"id":"lstm-gru","name":"LSTM / GRU","definition":"Gate ব্যবহার করে sequence-এর তথ্য বহন ও update করা recurrent unit-এর দুই ধরন।","insight":{"fact":"দূরের আগের তথ্য ধরে রাখতে gated recurrent unit তৈরি হয়। LSTM ও GRU-এর gate ও state-এর গঠন আলাদা; এগুলো RNN পরিবারের variant।","history":"Hochreiter ও Schmidhuber-এর LSTM paper ১৯৯৭ সালে; Cho ও সহকর্মীদের ২০১৪ RNN Encoder–Decoder paper-এ GRU-সংশ্লিষ্ট gated unit আসে। দুটি ভিন্ন ধাপ।","sources":[{"title":"RNN Encoder–Decoder, 2014","url":"https://arxiv.org/abs/1406.1078"},{"title":"LSTM, 1997","url":"https://www.bioinf.jku.at/publications/older/2604.pdf"}]},"children":[{"id":"gate","name":"Gate","definition":"কতটা তথ্য রাখা, বাদ দেওয়া বা পাঠানো হবে তা নিয়ন্ত্রণকারী হিসাব।","insight":{"fact":"Gate প্রায়ই ০–১-এর মধ্যে মান দেয়, তাই দরজা পুরো খোলা বা বন্ধের মাঝামাঝি অবস্থাও হতে পারে। এটি সাধারণত input থেকে হিসাব হয়, মানুষের স্থির switch নয়।"},"story":{"problem":"সব তথ্য সমান জরুরি না: কিছু ধরে রাখা, কিছু ছেড়ে দেওয়া।","idea":"০–১-এর একটা গুণক যা ঠিক করে কতটা তথ্য পেরোবে।"}}],"story":{"problem":"সাধারণ recurrent network অনেক দূরের তথ্য ভুলে যায়।","idea":"gate দিয়ে ঠিক করা কী মনে রাখব, কী ভুলব, কী নতুন যোগ করব। LSTM-এ স্মৃতি আলাদা, GRU সরল।"},"history":[{"y":"১৯৯৭","t":"Hochreiter ও Schmidhuber 'Long Short-Term Memory' প্রকাশ করেন (Neural Computation, খণ্ড ৯(৮), পৃ. ১৭৩৫–১৭৮০): gate-যুক্ত unit দিয়ে অনেক ধাপ ধরে তথ্য মনে রাখার পথ।","s":"ML Anthology: LSTM 1997","u":"https://mlanthology.org/neco/1997/hochreiter1997neco-long"}]},{"id":"recurrent-neural-network-rnn--task-head","name":"Task Head","definition":"নির্দিষ্ট কাজের output তৈরির শেষ অংশ; এক বা একাধিক layer হতে পারে।","insight":{"fact":"এক model-এ একাধিক head থাকতে পারে: একটি object-এর শ্রেণি বলে, অন্যটি তার অবস্থান। Head-এর সংখ্যা আর attention head-এর সংখ্যা একই ধারণা নয়।"},"lessons":[{"k":"M09 · L10","t":"একাধিক Output: এক score, নাকি কয়েকটা Head?","h":"module-09-model-architecture/lecture-10-multiple-outputs-and-heads.md"}],"story":{"problem":"একই network দিয়ে সংখ্যা, দল, বা লেখা, নানা কাজ করাতে চাই।","idea":"শেষে কাজ অনুযায়ী একটা ছোট অংশ (head): সংখ্যার জন্য সরল unit, দলের জন্য softmax, ইত্যাদি। body একই থাকতে পারে, head বদলায়।"}},{"id":"recurrent-neural-network-rnn--attention-variant","name":"Attention যুক্ত variant","definition":"অনুবাদের মতো কাজে RNN-এর সঙ্গে attention ব্যবহার করা যায়।","insight":{"fact":"Attention কোনো একটি model পরিবারের ব্যক্তিগত সম্পত্তি নয়। মূল architecture-এর সঙ্গে নতুন mechanism যোগ করেও variant তৈরি হয়।","history":"২০১৪ সালে Bahdanau, Cho ও Bengio-এর অনুবাদ গবেষণায় source sentence-এর প্রাসঙ্গিক অংশে soft alignment ব্যবহার করা হয়। Transformer (২০১৭)-এর আগেও neural Attention ছিল।","sources":[{"title":"Bahdanau et al., 2014","url":"https://arxiv.org/abs/1409.0473"}]},"children":[{"id":"recurrent-neural-network-rnn--attention-variant--attention","name":"Attention","definition":"প্রাসঙ্গিকতার score অনুযায়ী বিভিন্ন অংশের তথ্য weighted sum দিয়ে মেশানোর mechanism।","insight":{"fact":"অনুবাদে পুরো source sentence একটি vector-এ গুঁজে রাখলে তথ্য হারানোর সমস্যা ছিল। প্রয়োজনমতো source-এর অংশে ফিরে দেখার ব্যবস্থা সেই bottleneck কমাতে সাহায্য করে।","history":"২০১৪ সালে Bahdanau, Cho ও Bengio-এর অনুবাদ গবেষণায় source sentence-এর প্রাসঙ্গিক অংশে soft alignment ব্যবহার করা হয়। Transformer (২০১৭)-এর আগেও neural Attention ছিল।","sources":[{"title":"Bahdanau et al., 2014","url":"https://arxiv.org/abs/1409.0473"}]},"children":[{"id":"recurrent-neural-network-rnn--attention-variant--attention--kinds","name":"ধরন","definition":"একই sequence-এর মধ্যে self-attention; অন্য sequence থেকে তথ্য নিতে cross-attention।","insight":{"fact":"Self-attention ও cross-attention-এর পার্থক্য মূলত Q, K, V কোথা থেকে আসছে। শুধু নাম দেখে একটিকে বেশি শক্তিশালী বলা যায় না।"},"children":[{"id":"recurrent-neural-network-rnn--attention-variant--attention--kinds--self-attention","name":"Self-attention","definition":"একই sequence থেকে query, key ও value নিয়ে তার অংশগুলোর মধ্যে তথ্য মেশানো।","insight":{"fact":"একই token থেকে Q, K, V বের হলেও আলাদা projection ব্যবহৃত হয়। তাই একই source মানে তিনটি vector হুবহু একই নয়।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"একটা বাক্যে একটা শব্দের অর্থ ঠিক হয় বাকি শব্দ দেখে।","idea":"একই sequence থেকে query, key, value নিয়ে প্রতিটা অংশ বাকিগুলোর দিকে তাকায় ও তথ্য মেশায়।"}},{"id":"recurrent-neural-network-rnn--attention-variant--attention--kinds--cross-attention","name":"Cross-attention","definition":"এক sequence-এর query দিয়ে অন্য sequence-এর key ও value থেকে তথ্য নেওয়া।","insight":{"fact":"অনুবাদের decoder নিজের বর্তমান তথ্য দিয়ে source sentence-এর representation খুঁজতে পারে। এখানে query এক দিক থেকে, key ও value অন্য দিক থেকে আসে।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"এক sequence-এর তথ্য আরেক sequence-এ আনতে হবে (অনুবাদ, ছবি থেকে লেখা)।","idea":"query আসে একটা অংশ থেকে, key ও value অন্য অংশ থেকে।"}}]},{"id":"recurrent-neural-network-rnn--attention-variant--attention--multi-head-attention","name":"Multi-head Attention","definition":"একাধিক attention হিসাব পাশাপাশি করে তাদের ফল একত্র করা।","insight":{"fact":"অনেক head আলাদা শেখা projection দিয়ে সম্পর্ক হিসাব করতে পারে। প্রতিটি head অবশ্যই একটি নির্দিষ্ট ব্যাকরণগত কাজ শিখবে—এমন নিশ্চয়তা নেই।","history":"২০১৭ সালের Transformer paper-এ একাধিক projected attention head-এর ফল একত্র করা হয়। একই representation-এর সম্পর্ক কয়েকভাবে হিসাব করাই উদ্দেশ্য।","sources":[{"title":"Attention Is All You Need, 2017","url":"https://arxiv.org/abs/1706.03762"}]},"children":[{"id":"recurrent-neural-network-rnn--attention-variant--attention--multi-head-attention--query-q","name":"Query (Q)","definition":"বর্তমান অবস্থানের জন্য কোন তথ্য প্রাসঙ্গিক, তা মিলিয়ে দেখার vector।","insight":{"fact":"Query সাধারণ ভাষায় লেখা প্রশ্ন নয়, সংখ্যার vector। বর্তমান অবস্থান কোন তথ্যের সঙ্গে মিল খুঁজবে, সে হিসাবের এক পক্ষ।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"কোন তথ্য খুঁজছি, সেটা বলার জন্য কিছু চাই।","idea":"প্রতিটা অবস্থানের 'আমি কী খুঁজছি' বর্ণনা।"}},{"id":"recurrent-neural-network-rnn--attention-variant--attention--multi-head-attention--key-k","name":"Key (K)","definition":"Query-এর সঙ্গে তুলনা করে প্রাসঙ্গিকতার score পাওয়ার vector।","insight":{"fact":"Key তালা খোলার password নয়। Query-এর সঙ্গে score করার vector; high score মানে ওই তথ্য বেশি ওজন পেতে পারে।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"কে কোন তথ্য দিতে পারে, তা বোঝার চিহ্ন।","idea":"প্রতিটা অবস্থানের 'আমি কী দিতে পারি' চিহ্ন। query-র সঙ্গে মিলিয়ে গুরুত্ব বের হয়।"}},{"id":"recurrent-neural-network-rnn--attention-variant--attention--multi-head-attention--value-v","name":"Value (V)","definition":"Attention weight অনুযায়ী মেশানো তথ্যের vector।","insight":{"fact":"Key দিয়ে প্রাসঙ্গিকতা মাপা হয়; value থেকে মূল তথ্য মেশে। কাকে দেখব আর তার কোন তথ্য নেব—এই দুই ভূমিকা আলাদা।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"গুরুত্ব ঠিক হলে আসল তথ্যটা কোথা থেকে আসবে?","idea":"প্রতিটা অবস্থানের বহন করা আসল তথ্য। গুরুত্ব দিয়ে ভারী করে সব value যোগ।"}}],"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"একটা attention একই সঙ্গে ব্যাকরণ, অর্থ, দূরত্ব, সব ধরনের সম্পর্ক ধরতে পারে না।","idea":"কয়েকটা ছোট attention (head) পাশাপাশি চলে, প্রতিটা নিজের মতো করে সম্পর্ক ধরে, শেষে ফল জোড়া।"}},{"id":"recurrent-neural-network-rnn--attention-variant--attention--attention-mask","name":"Attention Mask","definition":"কোন অবস্থানের তথ্য ব্যবহার করা যাবে, তা সীমিত করার নিয়ম; যেমন ভবিষ্যতের token আড়াল করা।","insight":{"fact":"আগের token দিয়ে পরের token শেখানোর সময় ভবিষ্যৎ উত্তর দেখা চলবে না। Causal mask তাই ভবিষ্যৎ অবস্থান আড়াল করে।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"training-এ পুরো বাক্য একসঙ্গে দেখানো হলে model পরের শব্দ দেখে নিয়ে উত্তর দিয়ে ফেলবে, অথচ আসলে ওটা তার অজানা থাকার কথা।","idea":"mask দিয়ে প্রতিটা অবস্থানকে শুধু নিজের আগের অংশ দেখতে দেওয়া হয়। এতে training আর generation-এর পরিস্থিতি মেলে।"}}],"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"লম্বা লেখায় প্রতিটা অংশ সমান গুরুত্বে দেখলে আসল অংশটা ঢাকা পড়ে যায়। এই মুহূর্তের হিসাবে কোন অংশ কাজের, তা আগে থেকে বলে দেওয়া যায় না।","idea":"attention input দেখেই ঠিক করে নেয় এই হিসাবের জন্য কোন অংশের তথ্য কতটা ব্যবহার হবে। প্রতিটা অংশ বাকি অংশগুলোর দিকে তাকিয়ে গুরুত্ব বাছে।","next":[{"label":"Transformer","why":"attention দিয়ে গড়া model","id":"transformer"}]}}]}],"story":{"problem":"লেখা বা সময়ের ক্রমে আগের অংশের উপর পরের অর্থ নির্ভর করে। MLP প্রতিবার আলাদা input দেখে, আগে কী ছিল মনে রাখে না।","idea":"একটা 'স্মৃতি' (recurrent state) নিয়ে একটা একটা করে ধাপে পড়া। প্রতি ধাপে আগের স্মৃতি আর নতুন input মিলিয়ে নতুন স্মৃতি। LSTM/GRU নামের gate ঠিক করে কী মনে রাখবে, কী ভুলবে।","next":[{"label":"Transformer","why":"এক ধাপ করে পড়তে হয় বলে ধীর, আর লম্বা লেখায় শুরুর কথা প্রায়ই হারিয়ে যায়","id":"transformer"}]},"choose":[{"label":"Recurrent Neural Network (RNN)","when":"ছোট ক্রম, ছোট model","why":"সরল","id":"recurrent-neural-network-rnn"},{"label":"Transformer","when":"লম্বা লেখা, অনেক data","why":"একসঙ্গে সব অংশ দেখে","id":"transformer"}],"history":[{"y":"১৯৯৭","t":"Hochreiter ও Schmidhuber 'Long Short-Term Memory' প্রকাশ করেন (Neural Computation, খণ্ড ৯(৮), পৃ. ১৭৩৫–১৭৮০): gate-যুক্ত unit দিয়ে অনেক ধাপ ধরে তথ্য মনে রাখার পথ।","s":"ML Anthology: LSTM 1997","u":"https://mlanthology.org/neco/1997/hochreiter1997neco-long"}]},{"id":"transformer","name":"Transformer","definition":"Attention ব্যবহার করে input-এর বিভিন্ন অংশের সম্পর্ক হিসাব করা architecture।","profile":{"why":"RNN-এর ধাপে ধাপে sequence computation parallel training সীমিত করে। Attention দিয়ে অবস্থানগুলোর সম্পর্ক সরাসরি হিসাব করার architecture প্রস্তাব করা হয়।","history":"Vaswani ও সহকর্মীরা ২০১৭ সালে Attention Is All You Need প্রকাশ করেন; শুরুতে machine translation ছিল মূল পরীক্ষা।","uses":"অনুবাদ, language model ও multimodal model; Gemma 3 একটি নথিভুক্ত উদাহরণ।","status":"২০২৫: Gemma 3 একটি নির্দিষ্ট Transformer-ভিত্তিক model family; report-এ ভাষা ও multimodal ক্ষমতা বর্ণিত।","sources":[{"title":"মূল paper, 2017","url":"https://research.google/pubs/attention-is-all-you-need/"},{"title":"মূল উদ্দেশ্যের ব্যাখ্যা","url":"https://research.google/blog/transformer-a-novel-neural-network-architecture-for-language-understanding/"},{"title":"Gemma 3, 2025","url":"https://arxiv.org/abs/2503.19786"}],"story":["অনুবাদে RNN এক ধাপের পরে আরেক ধাপ চালায়। Training-এ এই ধারাবাহিকতা parallel computation সীমিত করে। ২০১৭ সালের Transformer Attention-কে মূল তথ্য-মেশানোর ব্যবস্থা করে, recurrent ধাপ ছাড়াই sequence-এর সম্পর্ক শেখার পথ দেখায়।","Attention একা পুরো model নয়। Embedding, position-এর তথ্য, FFN, normalization ও residual connection মিলে architecture দাঁড়ায়। পরে একই পরিবারের encoder, decoder এবং image-text সংস্করণ বিভিন্ন কাজে ব্যবহার হয়।"],"role":"এখানে Transformer পুরো architecture-এর পরিবার; Attention ও FFN তার ভেতরের mechanism/block।"},"selection":{"problem":"Sequence বা patch-এর মধ্যে context-নির্ভর সম্পর্ক শেখাতে চাই।","when":"উপযুক্ত pretrained model আছে; task অনুযায়ী mask, head ও input representation ঠিক করা যায়।","avoid":"শুধু নাম আধুনিক বলে বেছে নিও না; compute, input length ও data-র প্রয়োজন মিলতে হবে।","compare":"Classification হলে classifier head, generation হলে generative setup—একই পরিবারের ভিন্ন ব্যবহার।","example":"Text classifier, image encoder বা text generator—গঠন ও training অনুযায়ী আলাদা।"},"seq":"৪","children":[{"id":"input-representation","name":"Input representation","definition":"Token-কে সংখ্যায় প্রকাশ ও অবস্থানের তথ্য যুক্ত করার ব্যবস্থা।","insight":{"fact":"Model লেখা সরাসরি মানুষের মতো পড়ে না। Token ID থেকে vector বা image patch থেকে projection—এভাবে input-কে হিসাবের উপযোগী করা হয়।"},"children":[{"id":"input-representation--embedding","name":"Embedding","definition":"Token বা অন্য item-এর সংখ্যার vector representation; embedding layer সাধারণত শেখা table থেকে vector নেয়।","insight":{"fact":"Token ID-এর সংখ্যা বড় হলেই অর্থ বড় হয় না। Embedding সেই ID-কে শেখা vector-এ বদলায়, যেখানে সম্পর্ক প্রকাশ করা সম্ভব।","history":"Mikolov ও সহকর্মীদের ২০১৩ word-vector গবেষণা দ্রুত word representation শেখানোর গুরুত্বপূর্ণ milestone। Embedding ধারণা তার আগে থেকেও ছিল।","sources":[{"title":"Word representations, 2013","url":"https://arxiv.org/abs/1301.3781"}]},"children":[{"id":"token","name":"Token","definition":"Model-এর জন্য লেখাকে ভাগ করার একক; শব্দ, শব্দের অংশ বা চিহ্ন হতে পারে।","insight":{"fact":"একটি বাংলা শব্দ এক বা একাধিক token হতে পারে। Token-এর সংখ্যা তাই শব্দের সংখ্যার সমান ধরে নেওয়া যায় না।"},"lessons":[{"k":"M12 · L01","t":"Token ও Tokenizer: লেখাকে সংখ্যায় ভাঙা","h":"module-12-text-sequences-and-multimodal-models/lecture-01-token-and-tokenizer.md"},{"k":"M12 · L02","t":"Embedding: Token id থেকে Vector","h":"module-12-text-sequences-and-multimodal-models/lecture-02-embedding.md"}],"story":{"problem":"model পুরো লেখা খায় না; টুকরো টুকরো খায়।","idea":"লেখাকে ছোট একক (শব্দ বা শব্দাংশ) করে প্রতিটার একটা id। বাংলা বা বিরল শব্দ আরও টুকরো হতে পারে।","next":[{"label":"Embedding","why":"id থেকে vector","id":"input-representation--embedding"}]}},{"id":"vector","name":"Vector","definition":"সংখ্যার সাজানো তালিকা।","insight":{"fact":"Vector-এর একটি coordinate একাই মানুষের বোঝা কোনো অর্থ বহন নাও করতে পারে। অর্থপূর্ণ সম্পর্ক পুরো vector বা vector-গুলোর তুলনায় থাকতে পারে।"},"story":{"problem":"model-এর ভেতরে প্রতিটা জিনিসকে একই ধরনের সংখ্যার তালিকায় প্রকাশ করতে হবে।","idea":"সাজানো সংখ্যার তালিকা। token, ছবির টুকরো, ভেতরের অবস্থা সবই vector।"}}],"lessons":[{"k":"M12 · L01","t":"Token ও Tokenizer: লেখাকে সংখ্যায় ভাঙা","h":"module-12-text-sequences-and-multimodal-models/lecture-01-token-and-tokenizer.md"},{"k":"M12 · L02","t":"Embedding: Token id থেকে Vector","h":"module-12-text-sequences-and-multimodal-models/lecture-02-embedding.md"}],"story":{"problem":"token-এর id একটা ঠিকানা মাত্র, তার সংখ্যাগত 'অর্থ' নেই (id ১৩ মানে ১১-এর চেয়ে বেশি কিছু নয়)।","idea":"প্রতিটা token-এর জন্য একটা শেখা সংখ্যার vector, একটা table থেকে সারি তুলে আনা। training-এ কাছাকাছি কাজের token কাছাকাছি vector পায়।","next":[{"label":"Token","why":"embedding-এর আগে লেখা ভাঙা","id":"token"}]}},{"id":"positional-information","name":"Positional Information","definition":"Sequence-এ কোন অংশ কোথায় আছে, তার তথ্য; positional embedding বা অন্য পদ্ধতিতে যুক্ত করা যায়।","insight":{"fact":"শুধু কোন শব্দ আছে জানলে “আমি তাকে দেখলাম” আর “সে আমাকে দেখল”-এর ক্রমের পার্থক্য ধরা যায় না। Sequence model-এ অবস্থানের তথ্য তাই আলাদা গুরুত্ব পায়।","history":"মূল Transformer (২০১৭)-এ sinusoidal positional encoding ব্যবহৃত হয়; learned positional embedding-ও পরীক্ষা করা হয়েছিল। Position জানানোর এটিই একমাত্র পদ্ধতি নয়।","sources":[{"title":"Transformer positional encoding, 2017","url":"https://arxiv.org/abs/1706.03762"}]},"story":{"problem":"attention শব্দের ক্রম জানে না: 'কুকুর মানুষকে কামড়ায়' আর উল্টো একই মনে হতে পারে।","idea":"প্রতিটা অবস্থানের সংখ্যা বা চিহ্ন embedding-এ যোগ বা মিশিয়ে ক্রমের তথ্য দেওয়া।"}}],"lessons":[{"k":"M12 · L01","t":"Token ও Tokenizer: লেখাকে সংখ্যায় ভাঙা","h":"module-12-text-sequences-and-multimodal-models/lecture-01-token-and-tokenizer.md"},{"k":"M12 · L02","t":"Embedding: Token id থেকে Vector","h":"module-12-text-sequences-and-multimodal-models/lecture-02-embedding.md"}]},{"id":"transformer-block","name":"Transformer Block","definition":"বারবার ব্যবহৃত হিসাবের অংশ। Attention তথ্য মেশায়; FFN প্রতিটি অবস্থানের তথ্য বদলায়।","insight":{"fact":"একই ধরনের block বারবার থাকে, কিন্তু তাদের weights সাধারণত আলাদা। “একই গঠন” মানেই “একই শেখা মান” নয়।","history":"২০১৭ সালের মূল Transformer-এ Attention-এর পাশে position-wise feed-forward অংশ ছিল। Attention দিয়ে পাওয়া তথ্যকে প্রতিটি অবস্থানে আরও রূপান্তর করা হয়।","sources":[{"title":"Transformer, 2017","url":"https://arxiv.org/abs/1706.03762"}]},"children":[{"id":"transformer-block--attention","name":"Attention","definition":"প্রাসঙ্গিকতার score অনুযায়ী বিভিন্ন অংশের তথ্য weighted sum দিয়ে মেশানোর mechanism।","insight":{"fact":"অনুবাদে পুরো source sentence একটি vector-এ গুঁজে রাখলে তথ্য হারানোর সমস্যা ছিল। প্রয়োজনমতো source-এর অংশে ফিরে দেখার ব্যবস্থা সেই bottleneck কমাতে সাহায্য করে।","history":"২০১৪ সালে Bahdanau, Cho ও Bengio-এর অনুবাদ গবেষণায় source sentence-এর প্রাসঙ্গিক অংশে soft alignment ব্যবহার করা হয়। Transformer (২০১৭)-এর আগেও neural Attention ছিল।","sources":[{"title":"Bahdanau et al., 2014","url":"https://arxiv.org/abs/1409.0473"}]},"children":[{"id":"transformer-block--attention--kinds","name":"ধরন","definition":"একই sequence-এর মধ্যে self-attention; অন্য sequence থেকে তথ্য নিতে cross-attention।","insight":{"fact":"Self-attention ও cross-attention-এর পার্থক্য মূলত Q, K, V কোথা থেকে আসছে। শুধু নাম দেখে একটিকে বেশি শক্তিশালী বলা যায় না।"},"children":[{"id":"transformer-block--attention--kinds--self-attention","name":"Self-attention","definition":"একই sequence থেকে query, key ও value নিয়ে তার অংশগুলোর মধ্যে তথ্য মেশানো।","insight":{"fact":"একই token থেকে Q, K, V বের হলেও আলাদা projection ব্যবহৃত হয়। তাই একই source মানে তিনটি vector হুবহু একই নয়।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"একটা বাক্যে একটা শব্দের অর্থ ঠিক হয় বাকি শব্দ দেখে।","idea":"একই sequence থেকে query, key, value নিয়ে প্রতিটা অংশ বাকিগুলোর দিকে তাকায় ও তথ্য মেশায়।"}},{"id":"transformer-block--attention--kinds--cross-attention","name":"Cross-attention","definition":"এক sequence-এর query দিয়ে অন্য sequence-এর key ও value থেকে তথ্য নেওয়া।","insight":{"fact":"অনুবাদের decoder নিজের বর্তমান তথ্য দিয়ে source sentence-এর representation খুঁজতে পারে। এখানে query এক দিক থেকে, key ও value অন্য দিক থেকে আসে।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"এক sequence-এর তথ্য আরেক sequence-এ আনতে হবে (অনুবাদ, ছবি থেকে লেখা)।","idea":"query আসে একটা অংশ থেকে, key ও value অন্য অংশ থেকে।"}}]},{"id":"transformer-block--attention--multi-head-attention","name":"Multi-head Attention","definition":"একাধিক attention হিসাব পাশাপাশি করে তাদের ফল একত্র করা।","insight":{"fact":"অনেক head আলাদা শেখা projection দিয়ে সম্পর্ক হিসাব করতে পারে। প্রতিটি head অবশ্যই একটি নির্দিষ্ট ব্যাকরণগত কাজ শিখবে—এমন নিশ্চয়তা নেই।","history":"২০১৭ সালের Transformer paper-এ একাধিক projected attention head-এর ফল একত্র করা হয়। একই representation-এর সম্পর্ক কয়েকভাবে হিসাব করাই উদ্দেশ্য।","sources":[{"title":"Attention Is All You Need, 2017","url":"https://arxiv.org/abs/1706.03762"}]},"children":[{"id":"transformer-block--attention--multi-head-attention--query-q","name":"Query (Q)","definition":"বর্তমান অবস্থানের জন্য কোন তথ্য প্রাসঙ্গিক, তা মিলিয়ে দেখার vector।","insight":{"fact":"Query সাধারণ ভাষায় লেখা প্রশ্ন নয়, সংখ্যার vector। বর্তমান অবস্থান কোন তথ্যের সঙ্গে মিল খুঁজবে, সে হিসাবের এক পক্ষ।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"কোন তথ্য খুঁজছি, সেটা বলার জন্য কিছু চাই।","idea":"প্রতিটা অবস্থানের 'আমি কী খুঁজছি' বর্ণনা।"}},{"id":"transformer-block--attention--multi-head-attention--key-k","name":"Key (K)","definition":"Query-এর সঙ্গে তুলনা করে প্রাসঙ্গিকতার score পাওয়ার vector।","insight":{"fact":"Key তালা খোলার password নয়। Query-এর সঙ্গে score করার vector; high score মানে ওই তথ্য বেশি ওজন পেতে পারে।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"কে কোন তথ্য দিতে পারে, তা বোঝার চিহ্ন।","idea":"প্রতিটা অবস্থানের 'আমি কী দিতে পারি' চিহ্ন। query-র সঙ্গে মিলিয়ে গুরুত্ব বের হয়।"}},{"id":"transformer-block--attention--multi-head-attention--value-v","name":"Value (V)","definition":"Attention weight অনুযায়ী মেশানো তথ্যের vector।","insight":{"fact":"Key দিয়ে প্রাসঙ্গিকতা মাপা হয়; value থেকে মূল তথ্য মেশে। কাকে দেখব আর তার কোন তথ্য নেব—এই দুই ভূমিকা আলাদা।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"গুরুত্ব ঠিক হলে আসল তথ্যটা কোথা থেকে আসবে?","idea":"প্রতিটা অবস্থানের বহন করা আসল তথ্য। গুরুত্ব দিয়ে ভারী করে সব value যোগ।"}}],"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"একটা attention একই সঙ্গে ব্যাকরণ, অর্থ, দূরত্ব, সব ধরনের সম্পর্ক ধরতে পারে না।","idea":"কয়েকটা ছোট attention (head) পাশাপাশি চলে, প্রতিটা নিজের মতো করে সম্পর্ক ধরে, শেষে ফল জোড়া।"}},{"id":"transformer-block--attention--attention-mask","name":"Attention Mask","definition":"কোন অবস্থানের তথ্য ব্যবহার করা যাবে, তা সীমিত করার নিয়ম; যেমন ভবিষ্যতের token আড়াল করা।","insight":{"fact":"আগের token দিয়ে পরের token শেখানোর সময় ভবিষ্যৎ উত্তর দেখা চলবে না। Causal mask তাই ভবিষ্যৎ অবস্থান আড়াল করে।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"training-এ পুরো বাক্য একসঙ্গে দেখানো হলে model পরের শব্দ দেখে নিয়ে উত্তর দিয়ে ফেলবে, অথচ আসলে ওটা তার অজানা থাকার কথা।","idea":"mask দিয়ে প্রতিটা অবস্থানকে শুধু নিজের আগের অংশ দেখতে দেওয়া হয়। এতে training আর generation-এর পরিস্থিতি মেলে।"}}],"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"লম্বা লেখায় প্রতিটা অংশ সমান গুরুত্বে দেখলে আসল অংশটা ঢাকা পড়ে যায়। এই মুহূর্তের হিসাবে কোন অংশ কাজের, তা আগে থেকে বলে দেওয়া যায় না।","idea":"attention input দেখেই ঠিক করে নেয় এই হিসাবের জন্য কোন অংশের তথ্য কতটা ব্যবহার হবে। প্রতিটা অংশ বাকি অংশগুলোর দিকে তাকিয়ে গুরুত্ব বাছে।","next":[{"label":"Transformer","why":"attention দিয়ে গড়া model","id":"transformer"}]}},{"id":"transformer-block--transformer-ffn","name":"Transformer FFN","definition":"প্রতিটি token-এর representation আলাদাভাবে প্রক্রিয়া করা ছোট network; একই weights সব অবস্থানে ব্যবহৃত হয়।","insight":{"fact":"Attention বিভিন্ন অবস্থানের তথ্য মেশায়, FFN প্রতিটি অবস্থানে আলাদাভাবে চলে। একই FFN weights সব অবস্থানে ব্যবহৃত হলেও input আলাদা বলে ফল আলাদা হয়।","history":"২০১৭ সালের মূল Transformer-এ Attention-এর পাশে position-wise feed-forward অংশ ছিল। Attention দিয়ে পাওয়া তথ্যকে প্রতিটি অবস্থানে আরও রূপান্তর করা হয়।","sources":[{"title":"Transformer, 2017","url":"https://arxiv.org/abs/1706.03762"}]},"children":[{"id":"transformer-block--transformer-ffn--feed-forward-network-ffn","name":"Feed-forward Network (FFN)","definition":"সামনে এগোনো সংযোগের network; recurrent feedback loop থাকে না।","insight":{"fact":"Feed-forward মানে forward computation-এ recurrent loop নেই। Training-এর সময় backpropagation ব্যবহার করা যায়—তাতে এটি recurrent network হয়ে যায় না।","history":"MLP-এর দীর্ঘ ইতিহাসের পরে একই ধরনের FFN Transformer-এর block-এও ব্যবহৃত হয়। ২০২৪ সালের TimeMixer আবার MLP-ভিত্তিক forecasting-এর উদাহরণ দেয়।","sources":[{"title":"TimeMixer, 2024","url":"https://arxiv.org/abs/2405.14616"}]},"children":[{"id":"transformer-block--transformer-ffn--feed-forward-network-ffn--linear-dense-layer","name":"Linear / Dense Layer","definition":"Input-এর weighted sum তৈরি করে; bias থাকতে পারে। Dense layer-এ প্রতিটি output সব input-এর সঙ্গে যুক্ত।","insight":{"fact":"একটি dense layer input-এর সংখ্যা থেকে output-এর সংখ্যা বদলাতে পারে। কিন্তু অনেক linear layer একত্র করলেই nonlinear model হয় না—activation-এর ভূমিকা সেখানেই।"},"children":[{"id":"transformer-block--transformer-ffn--feed-forward-network-ffn--linear-dense-layer--weight","name":"Weight","definition":"Input বা মধ্যবর্তী মানের প্রভাব নিয়ন্ত্রণকারী শেখা গুণক।","insight":{"fact":"Weight ঋণাত্মকও হতে পারে। Input বাড়লে output কমার সম্পর্কও তাই শেখা যায়; তবে বড় weight দেখেই feature বেশি গুরুত্বপূর্ণ বলা যায় না, input-এর scale-ও দেখতে হয়।"},"lessons":[{"k":"M02 · L01","t":"Linear Regression: Prediction, Weight ও Bias","h":"module-02-linear-regression/lecture-01-prediction-weight-and-bias.md"},{"k":"M09 · L02","t":"Parameters: Model-এর শেখা মান","h":"module-09-model-architecture/lecture-02-parameters-and-hyperparameters.md"}],"story":{"problem":"সব input সমান গুরুত্বের নয়। বাড়ির দামে আয়তনের প্রভাব বেশি, দেয়ালের রঙের কম।","idea":"প্রতিটা input-এর সঙ্গে একটা গুণক বসে, সেটা weight। বড় weight মানে বেশি প্রভাব। training-এ এই গুণকগুলোই শেখা হয়।","next":[{"label":"Bias","why":"weight-এর সঙ্গী সংখ্যা","id":"model--linear-regression--bias"}]}},{"id":"transformer-block--transformer-ffn--feed-forward-network-ffn--linear-dense-layer--bias","name":"Bias","definition":"Weighted sum-এর সঙ্গে যোগ হওয়া শেখা মান।","insight":{"fact":"Input শূন্য হলেও output শূন্য হওয়া বাধ্যতামূলক নয়—bias সেই স্বাধীনতা দেয়। এই গাণিতিক bias আর data-র সামাজিক পক্ষপাত একই অর্থ নয়।"},"lessons":[{"k":"M02 · L01","t":"Linear Regression: Prediction, Weight ও Bias","h":"module-02-linear-regression/lecture-01-prediction-weight-and-bias.md"},{"k":"M09 · L02","t":"Parameters: Model-এর শেখা মান","h":"module-09-model-architecture/lecture-02-parameters-and-hyperparameters.md"}],"story":{"problem":"সব input শূন্য হলেও উত্তর শূন্য হওয়ার কথা নয়। একটা শুরুর মান দরকার।","idea":"weighted sum-এর সঙ্গে একটা শেখা সংখ্যা যোগ হয়, সেটা bias। এটা রেখাকে ওপরে-নিচে সরিয়ে ঠিক জায়গায় বসায়।","next":[{"label":"Weighted Sum","why":"দুটো মিলে হিসাব","id":"model--linear-regression--weighted-sum"}]}},{"id":"transformer-block--transformer-ffn--feed-forward-network-ffn--linear-dense-layer--weighted-sum","name":"Weighted Sum","definition":"প্রতিটি মানকে তার weight দিয়ে গুণ করে ফলগুলো যোগ করা।","insight":{"fact":"শুধু weight দিয়ে গুণ ও যোগ করলে ফল এখনও linear ধরনের হিসাব। অনেকগুলো এমন layer পরপর দিলেও nonlinear activation ছাড়া নতুন nonlinear সম্পর্ক তৈরি হয় না।"},"lessons":[{"k":"M02 · L04","t":"অনেকগুলো Feature ও Dot Product","h":"module-02-linear-regression/lecture-04-many-features-and-dot-product.md"},{"k":"M09 · L03","t":"একটি Unit: কয়েকটি input থেকে একটি ফল","h":"module-09-model-architecture/lecture-03-one-neuron.md"}],"story":{"problem":"অনেকগুলো input থেকে একটাই সংখ্যা বানাতে হবে, আর প্রতিটার প্রভাব আলাদা।","idea":"প্রতিটা input-কে তার weight দিয়ে গুণ করো, সব গুণফল যোগ করো। এটাই প্রায় সব model-এর মূল হিসাব।","next":[{"label":"Unit / Neuron","why":"এই হিসাব দিয়ে unit","id":"general-structure--hidden-layer--unit-neuron"}]}}],"lessons":[{"k":"M09 · L05","t":"পাশাপাশি Unit ও পরপর Layer","h":"module-09-model-architecture/lecture-05-hidden-layer.md"},{"k":"M09 · L07","t":"Shape ও Parameter Count","h":"module-09-model-architecture/lecture-07-shapes-and-parameter-count.md"}],"story":{"problem":"প্রতিটা input থেকে প্রতিটা output-এ যোগ রাখতে চাই।","idea":"প্রতিটা output unit সব input-এর weighted sum + bias নেয়। neural network-এর সবচেয়ে সরল পাথর।"}},{"id":"transformer-block--transformer-ffn--feed-forward-network-ffn--activation","name":"Activation","definition":"হিসাবের ফলের ওপর প্রয়োগ করা function; nonlinear activation জটিল সম্পর্ক প্রকাশ করতে সাহায্য করে।","insight":{"fact":"সব layer একই সরল হিসাব করলে গভীর করেও সম্পর্কের ধরন বদলাত না। Nonlinear activation সেই বাধা কাটায়।"},"children":[{"id":"transformer-block--transformer-ffn--feed-forward-network-ffn--activation--relu","name":"ReLU","definition":"ঋণাত্মক মানকে শূন্য করে, অন্য মান অপরিবর্তিত রাখে।","insight":{"fact":"ঋণাত্মক input-এ ReLU-এর output শূন্য। কোনো unit সব relevant input-এ এই অংশে পড়ে থাকলে শেখা আটকে যেতে পারে—একে প্রায়ই dying ReLU বলা হয়।"},"lessons":[{"k":"M09 · L04","t":"Activation: Score-কে বদলে নেওয়া","h":"module-09-model-architecture/lecture-04-activation.md"}],"story":{"problem":"activation সরল, দ্রুত আর gradient সহজে বয়ে নেওয়ার মতো চাই।","idea":"ঋণাত্মক মান ০, ধনাত্মক মান যেমন আছে তেমন। হিসাব ছোট, আর ধনাত্মক দিকে gradient নষ্ট হয় না।"}},{"id":"transformer-block--transformer-ffn--feed-forward-network-ffn--activation--gelu-silu","name":"GELU / SiLU","definition":"মসৃণ nonlinear activation; আধুনিক network-এর hidden layer-এ ব্যবহৃত হয়।","insight":{"fact":"ReLU-এর মতো সব ঋণাত্মক মান একেবারে কেটে দেয় না; মসৃণভাবে scale করে। নাম কাছাকাছি হলেও GELU ও SiLU একই formula নয়।","history":"Hendrycks ও Gimpel-এর ২০১৬ GELU paper মসৃণ activation নিয়ে গবেষণার একটি milestone। GELU ও SiLU আলাদা function—এই সালকে দুটোর একক আবিষ্কার-সাল ধরা হয়নি।","sources":[{"title":"GELU, 2016","url":"https://arxiv.org/abs/1606.08415"}]},"story":{"problem":"ReLU-র তীক্ষ্ণ কোণ মসৃণ করা যায় কি?","idea":"নেতিবাচক দিকে সামান্য সংকেত রেখে মসৃণ বাঁক। বড় Transformer-জাতীয় model-এ বেশি দেখা যায়।"}},{"id":"transformer-block--transformer-ffn--feed-forward-network-ffn--activation--sigmoid","name":"Sigmoid","definition":"একটি score-কে ০ ও ১-এর মাঝের মানে রূপান্তর করে; binary classification-এ ব্যবহৃত হয়।","insight":{"fact":"একটি score থেকে probability-সদৃশ সংখ্যা পেতে সুবিধা হয়। কিন্তু output ০.৯ হলেই model বাস্তবে ৯০% ক্ষেত্রে ঠিক—এমন নিশ্চয়তা নেই; calibration যাচাই দরকার।"},"lessons":[{"k":"M03 · L01","t":"Sigmoid: যেকোনো score-কে 0 থেকে 1-এর probability বানানো","h":"module-03-logistic-regression/lecture-01-sigmoid.md"},{"k":"M09 · L04","t":"Activation: Score-কে বদলে নেওয়া","h":"module-09-model-architecture/lecture-04-activation.md"}],"story":{"problem":"সোজা রেখার ফল যেকোনো সংখ্যা, অথচ probability হতে হবে ০ থেকে ১-এর মধ্যে।","idea":"sigmoid যেকোনো সংখ্যাকে ০–১-এর মধ্যে চেপে আনে: বড় ধনাত্মক ১-এর কাছে, বড় ঋণাত্মক ০-এর কাছে, শূন্য ঠিক ০.৫। দুই-উত্তরের কাজে ব্যবহৃত।"}},{"id":"transformer-block--transformer-ffn--feed-forward-network-ffn--activation--softmax","name":"Softmax","definition":"একদল score-কে এমন probability-তে রূপান্তর করে যাদের যোগফল ১।","insight":{"fact":"সব score-এ একই সংখ্যা যোগ করলেও probabilities বদলায় না। তাই কম্পিউটার বড় সংখ্যার সমস্যা এড়াতে প্রায়ই সবচেয়ে বড় score-টি সবার থেকে বাদ দিয়ে হিসাব করে।"},"lessons":[{"k":"M12 · L03","t":"Logits ও Softmax: Score থেকে Probability","h":"module-12-text-sequences-and-multimodal-models/lecture-03-logits-and-softmax.md"}],"story":{"problem":"অনেক দলের প্রতিটার একটা score আছে, কিন্তু আমাদের চাই এমন probability যাদের যোগফল ১।","idea":"প্রতিটা score-এর e-ঘাত নিয়ে মোট দিয়ে ভাগ। বড় score বড় probability পায়। দুই দল হলে এটা sigmoid-এর সমান।"}}],"lessons":[{"k":"M09 · L04","t":"Activation: Score-কে বদলে নেওয়া","h":"module-09-model-architecture/lecture-04-activation.md"}],"story":{"problem":"শুধু weighted sum-এর স্তর বাড়ালে সব মিলে একটা সোজা রেখাই থাকে, জটিলতা আসে না।","idea":"হিসাবের ফলের উপর একটা বাঁকা ফাংশন (nonlinear)। এতে রেখায় বাঁক আসে, তাই অনেক স্তর সত্যিই জটিল সম্পর্ক ধরতে পারে।","next":[{"label":"ReLU","why":"সবচেয়ে প্রচলিত","id":"general-structure--hidden-layer--activation--relu"},{"label":"Sigmoid","why":"০–১-এর probability দরকার হলে","id":"model--logistic-regression--sigmoid"}]},"choose":[{"label":"ReLU","when":"সাধারণ hidden layer","why":"সরল ও দ্রুত","id":"general-structure--hidden-layer--activation--relu"},{"label":"GELU / SiLU","when":"আধুনিক বড় model (যেমন Transformer)","why":"মসৃণ বাঁক","id":"general-structure--hidden-layer--activation--gelu-silu"},{"label":"Sigmoid","when":"শেষ layer-এ হ্যাঁ/না probability","why":"০–১-এর মধ্যে চেপে দেয়","id":"model--logistic-regression--sigmoid"},{"label":"Softmax","when":"শেষ layer-এ অনেক দলের probability","why":"মোট ১","id":"model--logistic-regression--softmax"}]}],"lessons":[{"k":"M12 · L06","t":"Transformer Block: Attention-এর সঙ্গে বাকি অংশ","h":"module-12-text-sequences-and-multimodal-models/lecture-06-transformer-block.md"}],"story":{"problem":"সরল নকশা: কোনো ফিরতি বা স্মৃতি নেই।","idea":"একমুখী layer-এর স্তূপ: input থেকে output।"}}],"lessons":[{"k":"M12 · L06","t":"Transformer Block: Attention-এর সঙ্গে বাকি অংশ","h":"module-12-text-sequences-and-multimodal-models/lecture-06-transformer-block.md"}],"story":{"problem":"attention তথ্য মেশায়, কিন্তু মেশানো তথ্য নিয়ে 'ভাবার' জায়গা কোথায়?","idea":"প্রতিটা token-এর representation আলাদাভাবে একটা ছোট network দিয়ে চালানো; একই weights সব অবস্থানে।"}},{"id":"block-normalization","name":"Block Normalization","definition":"Transformer-এ সাধারণত LayerNorm বা RMSNorm-এর মতো normalization ব্যবহার হয়; BatchNorm সাধারণ পছন্দ নয়।","insight":{"fact":"Normalization Attention-এর আগে না পরে—সেটিও architecture-এর সিদ্ধান্ত। শুধু component-এর তালিকা থেকে operation-এর পূর্ণ ক্রম বোঝা যায় না।"},"children":[{"id":"block-normalization--layernorm","name":"LayerNorm","definition":"প্রতিটি উদাহরণ বা token-এর নির্দিষ্ট feature dimension জুড়ে mean ও variance ব্যবহার করে normalization।","insight":{"fact":"প্রতিটি উদাহরণ বা token-এর feature-গুলোর মধ্যে হিসাব করে। তাই একটি উদাহরণের normalization সরাসরি পাশের batch-এর উদাহরণগুলোর ওপর নির্ভর করতে হয় না।","history":"Ba, Kiros ও Hinton-এর ২০১৬ সালের Layer Normalization paper batch-এর বদলে এক training case-এর feature জুড়ে normalization প্রস্তাব করে।","sources":[{"title":"Layer Normalization, 2016","url":"https://arxiv.org/abs/1607.06450"}]},"lessons":[{"k":"M12 · L06","t":"Transformer Block: Attention-এর সঙ্গে বাকি অংশ","h":"module-12-text-sequences-and-multimodal-models/lecture-06-transformer-block.md"}],"story":{"problem":"batch ছোট বা বদলায়, তবু normalization চাই।","idea":"প্রতিটা উদাহরণের নিজের feature-গুলোর গড় ও ছড়ানো দিয়ে normalize।"}},{"id":"block-normalization--rmsnorm","name":"RMSNorm","definition":"Mean বাদ না দিয়ে root-mean-square অনুযায়ী scale সামঞ্জস্য করা normalization।","insight":{"fact":"LayerNorm-এর mean বাদ দেওয়ার ধাপটি সরিয়েও কাজে লাগতে পারে—এই প্রশ্ন থেকে সরলতর normalization। সব normalization-এর জন্য একই ধাপ দরকার নয়।","history":"Zhang ও Sennrich ২০১৯ সালে mean সরানোর ধাপ ছাড়াই RMS দিয়ে scale ঠিক করার সহজতর পদ্ধতি পরীক্ষা করেন।","sources":[{"title":"RMSNorm, 2019","url":"https://arxiv.org/abs/1910.07467"}]},"story":{"problem":"LayerNorm-এর গড় বাদ দেওয়ার অংশ কি দরকার?","idea":"গড় বাদ না দিয়ে শুধু মানের মাপ (root mean square) দিয়ে ভাগ। সরল ও সস্তা।"}}],"lessons":[{"k":"M12 · L06","t":"Transformer Block: Attention-এর সঙ্গে বাকি অংশ","h":"module-12-text-sequences-and-multimodal-models/lecture-06-transformer-block.md"}],"story":{"problem":"স্তূপ গভীর হলে স্থির রাখা কঠিন।","idea":"প্রতিটা block-এর আগে বা পরে normalization বসানো।"}},{"id":"transformer-block--residual-connection","name":"Residual Connection","definition":"কোনো block-এর input-কে সেই block-এর ফলের সঙ্গে যোগ করার সংযোগ।","insight":{"fact":"Block-কে পুরো output শিখতে না দিয়ে input-এর সঙ্গে কী পরিবর্তন যোগ হবে তা শেখানো যায়। Input-এর সরাসরি পথ গভীর network শেখাতে সাহায্য করে।","history":"He ও সহকর্মীদের ResNet paper ২০১৫ সালে প্রকাশিত হয়। Input-এর shortcut যোগ করে অনেক গভীর image network শেখানোর সফল উদাহরণ দেখায়; সব skip connection-এর সূচনা এই paper নয়।","sources":[{"title":"Deep Residual Learning, 2015","url":"https://arxiv.org/abs/1512.03385"}]},"lessons":[{"k":"M12 · L06","t":"Transformer Block: Attention-এর সঙ্গে বাকি অংশ","h":"module-12-text-sequences-and-multimodal-models/lecture-06-transformer-block.md"}],"story":{"problem":"layer গভীর হলে gradient ক্ষীণ হয়ে যায়, আর নতুন layer কখনো আগের চেয়ে খারাপও করে ফেলতে পারে।","idea":"input-কে layer-এর ফলের সঙ্গে সরাসরি যোগ করা (x + f(x))। layer না শিখলেও তথ্য আর gradient বয়ে যায়।"}}],"lessons":[{"k":"M12 · L06","t":"Transformer Block: Attention-এর সঙ্গে বাকি অংশ","h":"module-12-text-sequences-and-multimodal-models/lecture-06-transformer-block.md"}],"story":{"problem":"একবার attention দিয়ে তথ্য মেশালে হয় না; বারবার মেশাতে ও ভাবতে হয়।","idea":"attention + FFN, সঙ্গে normalization আর residual: এই এক ইট বারবার স্তূপ করলে Transformer।"}},{"id":"transformer--task-head","name":"Task Head","definition":"নির্দিষ্ট কাজের output তৈরির শেষ অংশ; এক বা একাধিক layer হতে পারে।","insight":{"fact":"এক model-এ একাধিক head থাকতে পারে: একটি object-এর শ্রেণি বলে, অন্যটি তার অবস্থান। Head-এর সংখ্যা আর attention head-এর সংখ্যা একই ধারণা নয়।"},"children":[{"id":"projection","name":"Projection","definition":"একটি representation-কে অন্য সংখ্যার space বা আকারে রূপান্তরের হিসাব; প্রায়ই linear layer দিয়ে করা হয়।","insight":{"fact":"Projection নাম শুনে সবসময় dimension কমবে ভাবা ঠিক নয়। এটি আকার বাড়াতে, কমাতে বা একই আকারে নতুন representation তৈরি করতেও পারে।"},"lessons":[{"k":"M12 · L08","t":"Image ও Text একসঙ্গে: Vision-Language Model","h":"module-12-text-sequences-and-multimodal-models/lecture-08-image-and-text-together.md"}],"story":{"problem":"এক আকারের vector অন্য আকারের জায়গায় দরকার।","idea":"একটা linear layer দিয়ে vector-কে নতুন মাপ বা নতুন 'ভূমিকায়' পাঠানো (যেমন Q, K, V বানানো)।"}},{"id":"transformer--task-head--logi : FlashAttention (exact, IO-সচেতন), KV cache, MQA/GQA (cache ছোট), RoPE ও ALiBi (অবস্থান ও লম্বা দৈর্ঘ্য), sliding-window (স্থানীয় attention)।","next":[{"label":"FlashAttention — IO-aware attention","why":"গতি","id":"flash-attention"},{"label":"KV Cache","why":"generation-এর memory","id":"kv-cache"},{"label":"RoPE — Rotary Position Embedding","why":"অবস্থান","id":"rope"}]},"practice":{"scenario":"বাস্তবে এই কৌশলগুলো আলাদা আলাদা নয়, একসঙ্গে ব্যবহার হয়: FlashAttention + GQA + RoPE + KV cache একই model-এ।","typical":["কোন কৌশল কোন সমস্যার ওষুধ তা মনে রাখো: গতি (FlashAttention), memory (GQA, KV cache), অবস্থান ও দৈর্ঘ্য (RoPE, ALiBi)।"],"outside":"এই বিষয় কোর্সে নেই; সূত্র paper থেকে।"}}],"lessons":[{"k":"M12 · L06","t":"Transformer Block: Attention-এর সঙ্গে বাকি অংশ","h":"module-12-text-sequences-and-multimodal-models/lecture-06-transformer-block.md"}],"story":{"problem":"RNN এক ধাপ করে এগোয়, তাই ধীর। আর লম্বা লেখার শুরুর কথা শেষে এসে প্রায়ই মিলিয়ে যায়।","idea":"attention: প্রতিটা শব্দ সরাসরি বাকি সব শব্দের দিকে তাকিয়ে ঠিক করে কাকে কতটা গুরুত্ব দেবে। সব শব্দের হিসাব একসঙ্গে চলে। attention-এর সঙ্গে feed-forward, residual আর normalization জুড়ে একটা block, সেই block-এর পর block সাজানো।","next":[{"label":"Pretraining","why":"এত বড় model শূন্য থেকে শেখানো ব্যয়বহুল, তাই আগে-শেখা model থেকে শুরু","id":"pretraining"}]},"choose":[{"label":"Transformer","when":"লেখা, কথা, ছবি+লেখা; অনেক data","why":"এখনকার বড় model-গুলোর ভিত্তি","id":"transformer"},{"label":"Fine-tuning","when":"data কম, GPU কম","why":"নিজে শূন্য থেকে না শিখিয়ে আগে-শেখা model মানিয়ে নাও","id":"fine-tuning"}],"history":[{"y":"২০১৭ (জুন)","t":"Vaswani ও সহলেখকরা 'Attention Is All You Need' প্রকাশ করেন (arXiv)।","s":"arXiv:1706.03762","u":"https://arxiv.org/abs/1706.03762"}]},{"id":"recurrent-alternatives","name":"Transformer-এর বিকল্প — রৈখিক হিসাবের পরিবার","definition":"Transformer লম্বা ক্রমে ধীর ও memory-ক্ষুধার্ত (attention-এর খরচ ক্রমের দৈর্ঘ্যের বর্গ)। এই পরিবারগুলো একই কাজ রৈখিক হারে বা constant memory-তে করতে চায়, প্রায়ই training-এ সমান্তরাল আর inference-এ recurrent হয়ে।","seq":"৫","children":[{"id":"linear-attention","name":"Linear Attention — Transformers are RNNs","definition":"attention-কে kernel-feature-এর গুণফল হিসেবে লিখে গুণের সহযোগী ধর্ম (associativity) কাজে লাগানো, ফলে খরচ N² থেকে N-এ নামে। এতে autoregressive Transformer-কে RNN-এর মতো ধাপে ধাপে চালানো যায়।","story":{"problem":"softmax-attention-এর N×N হিসাব এড়ানো যায় কি?","idea":"attention-কে kernel-feature-এর গুণফল হিসেবে লিখে সহযোগী ধর্মে (A·B)·C = A·(B·C) সাজালে খরচ N-এ নামে; তখন Transformer RNN-এর মতো ধাপে ধাপে চলে।","next":[{"label":"RWKV","why":"এই পথের আধুনিক রূপ","id":"rwkv"}]},"history":[{"y":"২০২০ (arXiv-এ প্রথম জমা)","t":"Linear attention-এর RNN-যোগসূত্র প্রকাশ।","s":"arXiv: Linear Attention paper (Katharopoulos et al.), ২০২০","u":"https://arxiv.org/abs/2006.16236"}],"practice":{"scenario":"autoregressive generation-এ খুব লম্বা ক্রমে বিপুল গতি।","facts":[{"t":"খরচ O(N²) থেকে O(N), আর autoregressive prediction-এ খুব লম্বা ক্রমে ৪০০০ গুণ পর্যন্ত দ্রুত, সমান মানে (paper-এর দাবি)।","s":"Linear Attention paper (Katharopoulos et al.), ২০২০","u":"https://arxiv.org/abs/2006.16236"}],"pitfalls":["অনেক কাজে softmax-attention-এর মান পুরো মেলে না ধরে নেওয়া উচিত নয়: নিজের কাজে মাপো।"],"outside":"এই বিষয় কোর্সে নেই; সূত্র paper থেকে।"}},{"id":"rwkv","name":"RWKV","definition":"training-এ Transformer-এর মতো সমান্তরাল, inference-এ RNN-এর মতো constant memory ও কাজ। রৈখিক attention-এর একটা রূপ ব্যবহার করে।","story":{"problem":"RNN সস্তা কিন্তু শেখানো কঠিন; Transformer শেখানো সহজ কিন্তু দামি।","idea":"একই model-কে Transformer (training-এ সমান্তরাল) বা RNN (inference-এ constant memory) হিসেবে চালানো। paper-এ ১৪B parameter পর্যন্ত বড় করা হয়েছে।"},"history":[{"y":"২০২৩ (arXiv-এ প্রথম জমা)","t":"RWKV প্রকাশ।","s":"arXiv: RWKV paper (Peng et al.), ২০২৩","u":"https://arxiv.org/abs/2305.13048"}],"practice":{"scenario":"RNN-এর মতো inference, Transformer-এর মতো training: ছোট GPU-তে চালানোর আকর্ষণীয় পথ।","facts":[{"t":"RWKV ১৪B parameter পর্যন্ত বড় করা হয়েছে (paper-এর ভাষ্যে এখন পর্যন্ত সবচেয়ে বড় dense RNN) এবং সমান আকারের Transformer-এর সঙ্গে তুলনীয় ফল।","s":"RWKV paper (Peng et al.), ২০২৩","u":"https://arxiv.org/abs/2305.13048"}],"outside":"এই বিষয় কোর্সে নেই; সূত্র paper থেকে।"}},{"id":"retnet","name":"RetNet — Retention","definition":"'retention' ব্যবস্থা, যার তিন রূপ: parallel (training), recurrent (O(1) inference), chunkwise recurrent (লম্বা ক্রমে)।","story":{"problem":"training-এ সমান্তরাল, inference-এ সস্তা, মানও ভালো: তিনটা একসঙ্গে কি পাওয়া যায়?","idea":"'retention' ব্যবস্থার তিন রূপ: parallel (training), recurrent (O(1) inference), chunkwise (লম্বা ক্রম)।"},"history":[{"y":"২০২৩ (arXiv-এ প্রথম জমা)","t":"RetNet প্রকাশ।","s":"arXiv: RetNet paper (Sun et al.), ২০২৩","u":"https://arxiv.org/abs/2307.08621"}],"practice":{"scenario":"একই model তিন রূপে চালানো যায়, প্রয়োজন বুঝে।","facts":[{"t":"RetNet-এর retention-এ parallel, recurrent (O(1) inference) ও chunkwise recurrent রূপ।","s":"RetNet paper (Sun et al.), ২০২৩","u":"https://arxiv.org/abs/2307.08621"}],"outside":"এই বিষয় কোর্সে নেই; সূত্র paper থেকে।"}}],"story":{"problem":"Transformer-এর attention-এর খরচ ক্রমের দৈর্ঘ্যের বর্গ। লম্বা ক্রমে এটা বাধা।","idea":"রৈখিক খরচে চলে এমন বিকল্প: linear attention, RWKV, RetNet। সবই training-এ সমান্তরাল ও inference-এ recurrent হওয়ার চেষ্টা।","next":[{"label":"Linear Attention — Transformers are RNNs","why":"প্রথম ধারণা","id":"linear-attention"},{"label":"State Space Model (SSM) পরিবার","why":"আরেক পরিবার","id":"state-space-models"}]},"practice":{"scenario":"লম্বা ক্রমে Transformer-এর বিকল্পের তালিকা: linear attention, RWKV, RetNet, SSM। সবার লক্ষ্য একই: রৈখিক খরচ।","typical":["যে পরিবারই বাছো, নিজের কাজে একই শর্তে Transformer-এর সঙ্গে মাপো।"],"pitfalls":["paper-এর 'Transformer-এর সমান' দাবি সব কাজে খাটবে ধরে নেওয়া।"],"outside":"এই বিষয় কোর্সে নেই; সূত্র paper থেকে।"}},{"id":"state-space-models","name":"State Space Model (SSM) পরিবার","definition":"এমন model যা একটা লুকানো অবস্থা (state) রাখে: প্রতি ধাপে নতুন input ঢুকলে state বদলায়, আর state থেকে output আসে। গঠনে RNN-এর কাছাকাছি, কিন্তু মূলটা একটা রৈখিক ব্যবস্থা, যাকে দুই রূপে চালানো যায়: ধাপে ধাপে (recurrence) অথবা একসঙ্গে (convolution)।","seq":"৬","children":[{"id":"ssm-basics","name":"SSM-এর ভিত্তি — state, recurrence, convolution","definition":"একটা ছোট state vector h থাকে। প্রতি ধাপে hₜ = Ā·hₜ₋₁ + B̄·xₜ আর yₜ = C·hₜ। A নির্ধারণ করে পুরোনো তথ্য কত দ্রুত ফিকে হবে, B নতুন input কতটা ঢুকবে, C state থেকে কী পড়া হবে। parameter সময়ের সঙ্গে না বদলালে পুরো ক্রমকে একটা convolution হিসেবেও চালানো যায়।","mathDetail":{"formula":"hₜ = Ā·hₜ₋₁ + B̄·xₜ,  yₜ = C·hₜ","meaning":"Ā: আগের state কতটা থাকবে; B̄: input কতটা ঢুকবে; C: state থেকে output। continuous রূপ h′(t) = A·h(t) + B·x(t) কে ধাপ-মাপ Δ দিয়ে discretize করে এই recurrence পাওয়া যায়।","example":"ছোট উদাহরণ: Ā = 0.5, B̄ = 1, C = 1, input x = [1, 0, 0]। recurrence: h = 1, 0.5, 0.25, তাই y = [1, 0.5, 0.25]। convolution রূপে kernel K = [C·B̄, C·Ā·B̄, C·Ā²·B̄] = [1, 0.5, 0.25], x-কে K দিয়ে convolve করলে একই y আসে। অর্থাৎ training-এ convolution (একসঙ্গে), inference-এ recurrence (ধাপে ধাপে, constant memory)।"},"insight":{"fact":"একই model দুই রূপে চলে: training-এ সমান্তরাল (convolution), inference-এ ধাপে ধাপে (recurrence)। কিন্তু এই সুবিধা তখনই, যখন Ā, B̄, C সময়ের সঙ্গে স্থির (time-invariant)।"},"seq":"১","story":{"problem":"RNN-এর মতো state থাকলে ধাপে ধাপে চালাতেই হয়, সমান্তরালে শেখানো যায় না। এই সীমা ভাঙা যায় কি?","idea":"parameter সময়-স্থির হলে, state-এর recurrence আর convolution একই ফল দেয়। তাই training-এ convolution (সমান্তরাল), inference-এ recurrence (constant memory)।","next":[{"label":"HiPPO — স্মৃতি ধরে রাখার গাণিতিক ভিত্তি","why":"A কেমন হবে","id":"hippo"},{"label":"S4 — Structured State Space","why":"লম্বা ক্রমে প্রথম কার্যকর রূপ","id":"s4"}]},"practice":{"scenario":"নিজে হাতে ছোট একটা scalar SSM চালিয়ে দেখো (Ā=0.5, input [1,0,0]): recurrence আর convolution একই ফল দেয়, এটা দেখলেই ধারণা বসে যায়।","facts":[{"t":"S4 paper: SSM-এর continuous রূপ x′(t) = Ax(t) + Bu(t), y(t) = Cx(t) + Du(t)।","s":"S4 paper (Gu et al.), ২০২১","u":"https://arxiv.org/abs/2111.00396"},{"t":"Mamba paper: training-এ convolution রূপ (সমান্তরাল), inference-এ recurrent রূপ; সময়-স্থির (LTI) হলেই এই দুই রূপ সমান।","s":"Mamba paper (Gu & Dao), ২০২৩","u":"https://arxiv.org/abs/2312.00752"}],"typical":["নিজের code-এ দুই রূপের ফল মিলিয়ে sanity check।"],"pitfalls":["selection (input-নির্ভর parameter) এলে convolution রূপ আর সমান থাকে না।"],"outside":"এই বিষয় কোর্সে নেই; সূত্র paper থেকে।"}},{"id":"hippo","name":"HiPPO — স্মৃতি ধরে রাখার গাণিতিক ভিত্তি","definition":"SSM-এর A matrix কী হবে, সেই প্রশ্নের একটা ভিত্তি: এখন পর্যন্ত দেখা পুরো ইতিহাসকে ছোট state-এ কীভাবে সবচেয়ে ভালোভাবে ধরে রাখা যায়। polynomial-এ প্রক্ষেপ (projection) করে তার একটা নির্দিষ্ট উত্তর দেয়।","seq":"২","story":{"problem":"state যদি ছোট হয়, তবে পুরো ইতিহাস মনে রাখার সেরা উপায় কী?","idea":"পুরো ইতিহাসকে polynomial-এ প্রক্ষেপ করে ধরে রাখা, আর সেই প্রক্রিয়ার সূত্র থেকে A matrix-এর একটা নির্দিষ্ট রূপ পাওয়া।","next":[{"label":"S4 — Structured State Space","why":"এই ভিত্তির ওপর গড়া","id":"s4"}]},"history":[{"y":"২০২০ (arXiv-এ প্রথম জমা)","t":"HiPPO কাঠামো প্রস্তাব।","s":"arXiv: HiPPO paper (Gu et al.), ২০২০","u":"https://arxiv.org/abs/2008.07669"}],"practice":{"scenario":"নিজে এটা implement না করে বোঝো: 'A matrix কোনো এলোমেলো মান নয়, ইতিহাস ধরে রাখার জন্য নির্বাচিত'।","facts":[{"t":"HiPPO paper: ক্রমাগত সংকেত বা ক্রমকে polynomial basis-এ প্রক্ষেপ করে অনলাইনে সংকুচিত করার সাধারণ কাঠামো; গেটিং (GRU)-কে এর বিশেষ ক্ষেত্র হিসেবে সাধারণীকরণ করে।","s":"HiPPO paper (Gu et al.), ২০২০","u":"https://arxiv.org/abs/2008.07669"}],"outside":"এই বিষয় কোর্সে নেই; সূত্র paper থেকে।"}},{"id":"s4","name":"S4 — Structured State Space","definition":"SSM-কে লম্বা ক্রমে (১০,০০০ ধাপ বা বেশি) চালানোর প্রথম কার্যকর রূপ। A-এর বিশেষ গঠন (HiPPO-ভিত্তিক) ব্যবহার করে convolution kernel দ্রুত হিসাব করা যায়।","insight":{"fact":"S4 Path-X নামের ১৬,৩৮৪ ধাপের কঠিন কাজ সমাধান করা প্রথম model, আর আগের সব model সেখানে ব্যর্থ ছিল (paper-এর দাবি)।"},"seq":"৩","story":{"problem":"SSM কাগজে ভালো, কিন্তু হিসাব এত ভারী যে বাস্তবে চালানো যায় না।","idea":"A-এর বিশেষ গঠন ব্যবহার করে convolution kernel দ্রুত হিসাব করা (Cauchy kernel), তাই লম্বা ক্রমে প্রায় রৈখিক খরচে চলে।","next":[{"label":"Mamba — Selective State Space","why":"S4-এর সীমা: সব token একই আচরণ","id":"mamba"}]},"history":[{"y":"২০২১ (arXiv-এ প্রথম জমা)","t":"S4 প্রকাশ।","s":"arXiv: S4 paper (Gu et al.), ২০২১","u":"https://arxiv.org/abs/2111.00396"}],"practice":{"scenario":"লম্বা ক্রমের (Path-X, ১৬,৩৮৪ ধাপ) কাজে আগের model ব্যর্থ, S4 সমাধান করে।","facts":[{"t":"S4 paper: A-কে বিশেষ গঠনে পরিণত করে হিসাবকে Cauchy kernel-এর হিসাবে নামিয়ে আনা হয়েছে; খরচ প্রায় রৈখিক (Õ(N + L)), আর Path-X-এ ৮৮% accuracy।","s":"S4 paper (Gu et al.), ২০২১","u":"https://arxiv.org/abs/2111.00396"}],"pitfalls":["S4 সময়-স্থির: ভাষার মতো 'কোন token জরুরি' বাছাইয়ে দুর্বল, তাই Mamba।"],"outside":"এই বিষয় কোর্সে নেই; সূত্র paper থেকে।"}},{"id":"mamba","name":"Mamba — Selective State Space","definition":"SSM-এর parameter-কে input-নির্ভর করা, যাতে model প্রতি token দেখে ঠিক করে কোন তথ্য মনে রাখবে আর কোনটা ভুলবে। সঙ্গে একটা hardware-aware অ্যালগরিদম, যাতে এই পরিবর্তনের পরেও গতি থাকে। attention বা MLP block ছাড়াই পুরো architecture চলে।","insight":{"fact":"তাই Mamba inference-এ প্রতি ধাপে constant কাজ করে (state-এর আকার স্থির), আর লম্বা context-এ memory বাড়ে না, Transformer-এর KV cache-এর মতো নয়।"},"seq":"৪","children":[{"id":"selection-mechanism","name":"Selection mechanism — B, C, Δ input-নির্ভর","definition":"আগের SSM-এ B, C, Δ সব token-এ এক। Mamba-য় প্রতি token xₜ থেকে একটা ছোট linear layer দিয়ে এগুলো বানানো হয়। তাই model xₜ দেখে ঠিক করে state-এ কী ঢুকবে।","mathDetail":{"formula":"Bₜ, Cₜ, Δₜ = f(xₜ)","meaning":"Δ নিয়ন্ত্রণ করে বর্তমান input-কে কতটা গুরুত্ব দেবে। বড় Δ state-কে রিসেট করে বর্তমান input-এ মন দেয়; ছোট Δ state ধরে রাখে ও বর্তমান input উপেক্ষা করে (paper-এর ব্যাখ্যা)।","example":"একটা 'selective copy' কাজ: মাঝে মাঝে ফাঁকা শব্দ, শুধু কাজের token মনে রাখতে হবে। সময়-স্থির model পারে না, কারণ কোন token কাজের তা বলার উপায় নেই; input-নির্ভর Δ পারে।"},"insight":{"fact":"selection আনার মূল্য: B, C, Δ সময়ের সঙ্গে বদলায় বলে convolution রূপে আর হিসাব করা যায় না। তাই নতুন একটা অ্যালগরিদম লাগে।"},"seq":"১","story":{"problem":"সব token-কে একই নিয়মে state-এ ঢোকালে অপ্রয়োজনীয় তথ্য জমে, দরকারি তথ্য হারায়।","idea":"প্রতি token xₜ থেকে Bₜ, Cₜ, Δₜ বানানো। বড় Δ state রিসেট করে বর্তমান token-এ মন দেয়; ছোট Δ state ধরে রাখে ও token উপেক্ষা করে।","next":[{"label":"Hardware-aware scan","why":"এর দাম: convolution চলে না","id":"hardware-aware-scan"}]},"practice":{"scenario":"selective copy: মাঝে মাঝে ফাঁকা token, শুধু কাজেরগুলো মনে রাখতে হবে। সময়-স্থির model পারে না।","facts":[{"t":"Mamba paper: Δ বর্তমান input-কে কতটা গুরুত্ব দেবে তা নিয়ন্ত্রণ করে; বড় Δ state রিসেট করে, ছোট Δ state ধরে রাখে; এটা RNN-এর gate-কে সাধারণীকরণ করে।","s":"Mamba paper (Gu & Dao), ২০২৩","u":"https://arxiv.org/abs/2312.00752"}],"pitfalls":["selection-এর ফলে convolution রূপ হারিয়ে যায়, তাই নতুন হিসাব-পদ্ধতি লাগে।"],"outside":"এই বিষয় কোর্সে নেই; সূত্র paper থেকে।"}},{"id":"hardware-aware-scan","name":"Hardware-aware scan","definition":"convolution বাদ গেলে recurrence সরাসরি চালাতে হয়, আর বিশাল expanded state GPU-র ধীর memory (HBM)-এ লিখলে গতি হারায়। তাই (Δ, A, B, C) ধীর HBM থেকে দ্রুত SRAM-এ এনে discretization ও recurrence সেখানেই করে, শুধু চূড়ান্ত output HBM-এ ফেরত পাঠানো হয়। recurrence-কে সমান্তরালে চালানোর জন্য parallel scan ব্যবহার করা হয়।","seq":"২","story":{"problem":"selection আনার পর convolution রূপ আর চলে না; সরাসরি recurrence চালালে বিশাল state ধীর GPU memory-তে ওঠানামা করে।","idea":"(Δ, A, B, C) দ্রুত SRAM-এ এনে discretization ও recurrence সেখানেই, শুধু চূড়ান্ত output ধীর memory-তে। recurrence-কে parallel scan, kernel fusion ও recomputation দিয়ে দ্রুত করা।","next":[{"label":"FlashAttention — IO-aware attention","why":"একই ধরনের IO-সচেতন ভাবনা","id":"flash-attention"}]},"practice":{"scenario":"গতির উৎস গণনা কম হওয়া নয়, GPU-র ধীর memory-তে ওঠানামা কম হওয়া।","facts":[{"t":"Mamba paper: (Δ, A, B, C) ধীর HBM থেকে দ্রুত SRAM-এ এনে discretization ও recurrence সেখানে করা হয়, শুধু চূড়ান্ত output HBM-এ ফেরে; expanded state HBM-এ বানানো হয় না।","s":"Mamba paper (Gu & Dao), ২০২৩","u":"https://arxiv.org/abs/2312.00752"},{"t":"তিনটা পরিচিত কৌশল: kernel fusion, parallel scan, recomputation।","s":"Mamba paper (Gu & Dao), ২০২৩","u":"https://arxiv.org/abs/2312.00752"}],"typical":["এই ধরনের 'IO-aware' ভাবনা FlashAttention-এও দেখা যায়: দুটো এক পরিবারের চিন্তা।"],"outside":"এই বিষয় কোর্সে নেই; সূত্র paper থেকে।"}}],"story":{"problem":"S4-জাতীয় model সময়-স্থির, তাই 'এই token জরুরি, ওটা নয়' ঠিক করতে পারে না। ভাষায় সেটাই সবচেয়ে দরকার।","idea":"B, C আর Δ কে প্রতি token-এর ওপর নির্ভর করানো, যাতে model নিজে ঠিক করে কী মনে রাখবে ও কী ভুলবে। হিসাব ভারী হয়, তাই GPU-র জন্য আলাদা অ্যালগরিদম। attention বা MLP block লাগে না।","next":[{"label":"Selection mechanism — B, C, Δ input-নির্ভর","why":"মূল ধারণা","id":"selection-mechanism"},{"label":"Hardware-aware scan","why":"গতি কীভাবে রাখল","id":"hardware-aware-scan"},{"label":"Mamba-2 ও State Space Duality (SSD)","why":"পরের ধাপ","id":"mamba-2"}]},"choose":[{"label":"Mamba — Selective State Space","when":"খুব লম্বা context, inference-এ memory ও গতি জরুরি","why":"state স্থির, cache নেই","id":"mamba"},{"label":"Transformer","when":"পরিপক্ক ecosystem ও সবচেয়ে প্রমাণিত ফল","why":"অনেক বেশি পরীক্ষিত","id":"transformer"},{"label":"Hybrid — Transformer + Mamba (Jamba)","when":"দুই পরিবারের সুবিধা","why":"Transformer ও Mamba layer পাশাপাশি","id":"jamba-hybrid"}],"history":[{"y":"২০২৩ (ডিসেম্বর, arXiv-এ প্রথম জমা)","t":"Mamba প্রকাশ।","s":"arXiv: Mamba paper (Gu & Dao), ২০২৩","u":"https://arxiv.org/abs/2312.00752"}],"practice":{"scenario":"১ লাখ token-এর context-এ Transformer-এর KV cache বিশাল; Mamba-র state স্থির আকারের।","facts":[{"t":"Mamba paper: inference-এ Transformer-এর চেয়ে ৫ গুণ বেশি t atch ছোট বা বদলায়, তবু normalization চাই।","idea":"প্রতিটা উদাহরণের নিজের feature-গুলোর গড় ও ছড়ানো দিয়ে normalize।"}},{"id":"n-c84e84--normalization--rmsnorm","name":"RMSNorm","definition":"Mean বাদ না দিয়ে root-mean-square অনুযায়ী scale সামঞ্জস্য করা normalization।","insight":{"fact":"LayerNorm-এর mean বাদ দেওয়ার ধাপটি সরিয়েও কাজে লাগতে পারে—এই প্রশ্ন থেকে সরলতর normalization। সব normalization-এর জন্য একই ধাপ দরকার নয়।","history":"Zhang ও Sennrich ২০১৯ সালে mean সরানোর ধাপ ছাড়াই RMS দিয়ে scale ঠিক করার সহজতর পদ্ধতি পরীক্ষা করেন।","sources":[{"title":"RMSNorm, 2019","url":"https://arxiv.org/abs/1910.07467"}]},"story":{"problem":"LayerNorm-এর গড় বাদ দেওয়ার অংশ কি দরকার?","idea":"গড় বাদ না দিয়ে শুধু মানের মাপ (root mean square) দিয়ে ভাগ। সরল ও সস্তা।"}},{"id":"n-c84e84--normalization--batchnorm","name":"BatchNorm","definition":"Training-এ batch-এর পরিসংখ্যান ব্যবহার করে normalization; inference-এ সাধারণত সংরক্ষিত পরিসংখ্যান নেয়।","insight":{"fact":"Training-এ batch-এর পরিসংখ্যান, inference-এ সাধারণত running statistics ব্যবহার হয়। ফলে train/eval mode ভুল হলে একই input-এ অপ্রত্যাশিত ফল আসতে পারে।","history":"Ioffe ও Szegedy-এর ২০১৫ সালের গবেষণা deep network training দ্রুত ও স্থিতিশীল করার জন্য Batch Normalization নিয়ে আসে।","sources":[{"title":"Batch Normalization, 2015","url":"https://arxiv.org/abs/1502.03167"}]},"story":{"problem":"layer-এর বণ্টন training-এর সময় বদলাতে থাকে।","idea":"পুরো batch-এর গড় ও ছড়ানো দিয়ে normalize। inference-এ training-এর জমা-করা গড় ব্যবহার হয়।"}}],"story":{"problem":"layer-এর মান অযথা বড়-ছোট হলে শেখা অস্থির হয়।","idea":"মানগুলোকে একই মাপের কাছে নিয়ে আসা (গড় বাদ, ছড়ানো দিয়ে ভাগ)। এতে শেখা স্থির ও দ্রুত।","next":[{"label":"LayerNorm","why":"এক উদাহরণের ভেতরে","id":"common-extras--normalization--layernorm"},{"label":"BatchNorm","why":"পুরো batch জুড়ে","id":"common-extras--normalization--batchnorm"}]},"choose":[{"label":"LayerNorm","when":"Transformer / ভাষার model","why":"batch-আকারের উপর নির্ভর নয়","id":"common-extras--normalization--layernorm"},{"label":"BatchNorm","when":"CNN, ছবি, বড় batch","why":"batch-এর পরিসংখ্যান কাজে লাগে","id":"common-extras--normalization--batchnorm"}]},{"id":"n-c84e84--residual-connection","name":"Residual Connection","definition":"কোনো block-এর input-কে সেই block-এর ফলের সঙ্গে যোগ করার সংযোগ।","insight":{"fact":"Block-কে পুরো output শিখতে না দিয়ে input-এর সঙ্গে কী পরিবর্তন যোগ হবে তা শেখানো যায়। Input-এর সরাসরি পথ গভীর network শেখাতে সাহায্য করে।","history":"He ও সহকর্মীদের ResNet paper ২০১৫ সালে প্রকাশিত হয়। Input-এর shortcut যোগ করে অনেক গভীর image network শেখানোর সফল উদাহরণ দেখায়; সব skip connection-এর সূচনা এই paper নয়।","sources":[{"title":"Deep Residual Learning, 2015","url":"https://arxiv.org/abs/1512.03385"}]},"lessons":[{"k":"M12 · L06","t":"Transformer Block: Attention-এর সঙ্গে বাকি অংশ","h":"module-12-text-sequences-and-multimodal-models/lecture-06-transformer-block.md"}],"story":{"problem":"layer গভীর হলে gradient ক্ষীণ হয়ে যায়, আর নতুন layer কখনো আগের চেয়ে খারাপও করে ফেলতে পারে।","idea":"input-কে layer-এর ফলের সঙ্গে সরাসরি যোগ করা (x + f(x))। layer না শিখলেও তথ্য আর gradient বয়ে যায়।"}},{"id":"skip-connection","name":"Skip Connection","definition":"মাঝের কিছু layer এড়িয়ে পরের অংশে তথ্য পৌঁছানোর সংযোগ; residual connection এর একটি ধরন।","insight":{"fact":"এড়িয়ে যাওয়া path দিয়ে আগের তথ্য সামনে আসে; সেই তথ্য যোগ বা concatenation—দুইভাবেই মিলতে পারে। Residual addition হলো skip-এর নির্দিষ্ট ধরন।","history":"He ও সহকর্মীদের ResNet paper ২০১৫ সালে প্রকাশিত হয়। Input-এর shortcut যোগ করে অনেক গভীর image network শেখানোর সফল উদাহরণ দেখায়; সব skip connection-এর সূচনা এই paper নয়।","sources":[{"title":"Deep Residual Learning, 2015","url":"https://arxiv.org/abs/1512.03385"}]},"story":{"problem":"কিছু তথ্য মাঝের অনেক স্তর পেরিয়ে সরাসরি পৌঁছালে সুবিধা।","idea":"একটা layer ডিঙিয়ে পরের কোথাও input জুড়ে দেওয়া।"}},{"id":"dropout","name":"Dropout","definition":"Training-এ কিছু activation এলোমেলোভাবে শূন্য করা; অতিরিক্ত নির্ভরতা কমাতে সাহায্য করে। সাধারণ inference-এ বন্ধ থাকে।","insight":{"fact":"Training-এ কিছু activation বন্ধ করা হলেও unit স্থায়ীভাবে মুছে যায় না। পরের pass-এ অন্য unit বাদ পড়তে পারে; সাধারণ inference-এ এই randomness বন্ধ থাকে।","history":"২০১৪ সালের JMLR paper-এ Srivastava ও সহকর্মীরা Dropout-এর বিস্তৃত পরীক্ষা প্রকাশ করেন। কিছু unit সাময়িক বাদ দিয়ে অতিরিক্ত co-adaptation কমানো ছিল মূল ধারণা।","sources":[{"title":"Dropout, JMLR 2014","url":"https://www.jmlr.org/papers/v15/srivastava14a.html"}]},"story":{"problem":"model কয়েকটা নির্দিষ্ট unit-এর উপর অতিরিক্ত নির্ভর করে training data মুখস্থ করতে পারে।","idea":"training-এ কিছু activation এলোমেলোভাবে শূন্য করা, যাতে কারও উপর অতিরিক্ত নির্ভরতা না জন্মায়। inference-এ সাধারণত বন্ধ।"}},{"id":"reshape-flatten","name":"Reshape / Flatten","definition":"মান না বদলে tensor-এর সাজানোর আকার বদলানো; flatten-এ কয়েকটি অক্ষ এক করা হয়।","insight":{"fact":"একটি ছবিকে লম্বা vector করলে pixel-এর মান একই থাকে, কিন্তু layout বোঝানোর আকার বদলায়। Reshape নিজে নতুন feature শেখে না।"},"story":{"problem":"layer-এর মধ্যে আকার মেলে না।","idea":"মান না বদলে data-র আকার বদলানো, যেমন ছবির matrix → লম্বা vector।"}},{"id":"concatenation","name":"Concatenation","definition":"একাধিক representation-কে নির্দিষ্ট অক্ষ বরাবর পাশাপাশি জোড়া লাগানো।","insight":{"fact":"দুই vector পাশাপাশি জুড়লে দৈর্ঘ্য বাড়ে। Element-wise addition করলে মিল থাকা আকারে মান যোগ হয়—এই দুই merge operation আলাদা।"},"story":{"problem":"দুই উৎসের তথ্য এক জায়গায় আনতে হবে।","idea":"দুটো vector পাশাপাশি জুড়ে একটা বড় vector।"}}]},{"id":"deep-learning","name":"Deep Learning","definition":"বহু layer-এর neural network দিয়ে data-র উপযোগী representation শেখার ক্ষেত্র।","profile":{"why":"বহু স্তরে representation শেখার মাধ্যমে জটিল pattern ধরার প্রয়োজন থেকে বিকাশ। এটি একক model নয়।","history":"একটি আবিষ্কার-সাল নেই; neural network ও multilayer training-এর দীর্ঘ ইতিহাসের ওপর গড়ে ওঠা ক্ষেত্র। ১৯৮৬ backpropagation গবেষণা একটি গুরুত্বপূর্ণ milestone।","uses":"ছবি, ভাষা ও শব্দের বহু neural model এই ক্ষেত্রের অন্তর্গত।","status":"২০২৫ সালের Gemma 3 একটি উদাহরণ; ২০২৩ সালের ConvNeXt V2 আরেক ভিন্ন architecture-এর উদাহরণ। দুটোই গভীর neural model, কিন্তু তাদের তথ্য প্রক্রিয়ার গঠন এক নয়।","sources":[{"title":"Backpropagation, 1986","url":"https://doi.org/10.1038/323533a0"},{"title":"Gemma 3, 2025","url":"https://arxiv.org/abs/2503.19786"},{"title":"ResNet models","url":"https://docs.pytorch.org/vision/main/models/resnet.html"}],"story":["Raw input থেকে ফলের নিয়ম হাতে বানানো কঠিন হলে একাধিক layer-কে ধাপে ধাপে representation শেখানো যায়। নিচের স্তরের ফল পরের স্তরের উপাদান হয়—এই বহু স্তরের শেখাই Deep Learning-এর মূল ভাবনা।","এটি একটি নির্দিষ্ট model-এর নাম নয়। CNN, গভীর MLP বা Transformer-এর মতো architecture এই ক্ষেত্রের অন্তর্গত হতে পারে। তাই এর একক জন্মদিন বা সর্বশেষ model খোঁজার চেয়ে কোন architecture কোন কাজে ব্যবহৃত হলো, তা দেখা বেশি পরিষ্কার।"],"role":"Deep Learning ক্ষেত্র; Gemma 3 ও ConvNeXt V2 নির্দিষ্ট model family।"},"selection":{"problem":"Data থেকে প্রয়োজনীয় জটিল representation শেখার প্রয়োজন।","when":"Input জটিল, উপযুক্ত data/compute বা pretrained weights আছে।","avoid":"এটি একটিমাত্র নির্দিষ্ট model নয়; বড় করলেই ভালো হবে না।","compare":"আগে task ও data ঠিক করো; তারপর CNN/MLP/RNN/Transformer ও সহজ baseline তুলনা করো।","example":"Image থেকে feature শিখে classification; table-এর সাধারণ prediction-এ আগে ছোট baseline-ও দেখো।"},"story":{"problem":"হাতে বানানো feature-এর উপর নির্ভর না করে data থেকেই স্তরে স্তরে feature শেখাতে চাই।","idea":"অনেক layer-এর neural network। প্রথম layer সরল জিনিস ধরে, পরের layer তা জুড়ে জটিল ধারণা বানায়। বেশি data আর বেশি হিসাবের ক্ষমতা লাগে।"}}],"lessons":[{"k":"M09 · সূচি","t":"Model Architecture: ছোট ধাপে শেখা","h":"module-09-model-architecture/README.md"},{"k":"M10 · সূচি","t":"Neural Network Training","h":"module-10-neural-network-training/README.md"}],"story":{"problem":"ছবি, কথা বা লেখার মতো input-এ কোন বৈশিষ্ট্য (feature) কাজের তা হাতে বানানো প্রায় অসম্ভব। আর সোজা রেখা বা একটা গাছ এত জটিল সম্পর্ক ধরতে পারে না।","idea":"ছোট ছোট unit-এর অনেক স্তর (layer)। প্রতিটা unit weighted sum নেয়, তারপর activation (যেমন ReLU) তাতে বাঁক আনে। স্তরের পর স্তর সাজালে সরল জিনিস থেকে জটিল ধারণা তৈরি হয়। weight শেখা হয় loss কমিয়ে (backpropagation + gradient descent)।","next":[{"label":"Convolutional Neural Network (CNN)","why":"ছবির জন্য","id":"convolutional-neural-network-cnn"},{"label":"Recurrent Neural Network (RNN)","why":"ক্রমের (লেখা, সময়) জন্য","id":"recurrent-neural-network-rnn"},{"label":"Transformer","why":"লম্বা লেখা বা অনেক data-র জন্য","id":"transformer"}]},"choose":[{"label":"Neural Network","when":"ছবি, কথা, লেখা; অনেক data","why":"নিজে feature বানায়","id":"neural-network"},{"label":"Tree Ensemble","when":"table data, data কম","why":"আগে এটা চেষ্টা করো, সহজ ও প্রায়ই ভালো","id":"tree-ensemble"},{"label":"Linear Regression","when":"কারণ বুঝিয়ে বলা জরুরি","why":"neural network-এর ভেতরটা বোঝা কঠিন","id":"model--linear-regression"}],"history":[{"y":"১৯৫৮","t":"Frank Rosenblatt 'The Perceptron' প্রকাশ করেন (Psychological Review, খণ্ড ৬৫, পৃ. ৩৮৬–৪০৮): একটা সরল neuron-মডেল যে উদাহরণ থেকে শেখে।","s":"ML Anthology: Rosenblatt 1958","u":"https://mlanthology.org/misc/1958/rosenblatt1958misc-perceptron"},{"y":"১৯৮৬","t":"Rumelhart, Hinton ও Williams Nature-এ backpropagation বর্ণনা করেন (খণ্ড ৩২৩, পৃ. ৫৩৩–৫৩৬)। এতে hidden unit-গুলো কাজের বৈশিষ্ট্য নিজে শিখে নেয়।","s":"ML Anthology: Rumelhart et al. 1986","u":"https://mlanthology.org/misc/1986/rumelhart1986misc-learning"}]}],"lessons":[{"k":"M09 · সূচি","t":"Model Architecture: ছোট ধাপে শেখা","h":"module-09-model-architecture/README.md"},{"k":"M09 · L01","t":"Model-এর হিসাব: Input, হিসাব, Output","h":"module-09-model-architecture/lecture-01-input-computation-output.md"}],"story":{"problem":"হাতে data আছে, কাজও ঠিক। কিন্তু এত রকম model: কোনটা দিয়ে শুরু করব?","idea":"সরল থেকে জটিলের দিকে যাও। আগে সবচেয়ে সরল model দিয়ে একটা মাপকাঠি (baseline) বানাও। জটিল model সেই মাপকাঠির চেয়ে সত্যিই ভালো না হলে সে কোনো কাজের নয়।","next":[{"label":"৪. Training — Model কীভাবে শেখে?","why":"mo 33a0"}]},"children":[{"id":"target","name":"Target","definition":"কোনো training উদাহরণের জন্য কাঙ্ক্ষিত output।","insight":{"fact":"Target-এ ভুল থাকলে model সেটিও শেখার চেষ্টা করতে পারে। তাই label-এর মান model-এর আকারের মতোই গুরুত্বপূর্ণ।"},"seq":"১","children":[{"id":"numerical-target","name":"Numerical Target","definition":"কাঙ্ক্ষিত output একটি সংখ্যা বা সংখ্যার vector; regression-এ ব্যবহার হয়।","insight":{"fact":"বাড়ির দাম y=50 হলে model-এর prediction সেই একই unit-এ তুলনা করতে হবে।"},"story":{"problem":"আসল উত্তরটা একটা সংখ্যা।","idea":"সরাসরি সংখ্যা, আর squared error বা absolute error দিয়ে মাপা।"}},{"id":"class-label-one-hot-target","name":"Class Label ও One-hot Target","definition":"Class index একটি label; one-hot-এ সঠিক class-এর জায়গায় 1, অন্য জায়গায় 0।","insight":{"fact":"তিন class-এ দ্বিতীয়টি সঠিক হলে t=[0,1,0]। Label-এর index বড় মানেই বেশি পরিমাণ নয়।"},"story":{"problem":"দলের নাম সংখ্যায় না ঢোকালে loss হিসাব হয় না।","idea":"দলের নম্বর, অথবা one-hot (সঠিক দলে ১, বাকিতে ০)। cross-entropy এটার সঙ্গে কাজ করে।"}},{"id":"soft-target","name":"Soft Target","definition":"একটি class-কে সম্পূর্ণ 1 না দিয়ে probability distribution target হিসেবে দেওয়া।","insight":{"fact":"t=[0.1,0.8,0.1] একটি soft target। Teacher model বা label smoothing থেকে আসতে পারে।"},"lessons":[{"k":"M18 · L03","t":"Logits, Temperature ও Soft Targets","h":"module-18-knowledge-distillation/lecture-03-logits-temperature-soft-targets.md"},{"k":"M18 · L04","t":"Distillation Loss: Hard Target, Soft Target ও KL Divergence","h":"module-18-knowledge-distillation/lecture-04-distillation-loss.md"}],"story":{"problem":"'একদম নিশ্চিত' লেবেল সবসময় সঠিক বা কাজের না।","idea":"কঠিন ১/০-র বদলে একটা probability বণ্টন (যেমন teacher model-এর দেওয়া)। এতে বেশি তথ্য থাকে।"}},{"id":"sequence-target-loss-mask","name":"Sequence Target ও Loss Mask","definition":"Sequence-এর বিভিন্ন অবস্থানে target থাকে; loss mask বলে কোন অবস্থান loss-এ গণনা হবে।","insight":{"fact":"Padding বা prompt-এর অংশ বাদ দেওয়া যেতে পারে; attenti া সহজ।","idea":"একই প্রশ্নের দুই উত্তর, মানুষ কোনটা পছন্দ করেছে। এটাই সংকেত।"}},{"id":"reward-signal","name":"Reward Signal","definition":"Action বা output-এর কাম্যতার সংখ্যাভিত্তিক feedback।","insight":{"fact":"Immediate reward ও বহু ধাপের মোট return আলাদা; reward পেয়ে শেখার algorithm-ও নির্দিষ্ট করতে হয়।"},"lessons":[{"k":"M17 · L01","t":"ভুল ধরা পড়লে model-কে কীভাবে শেখানো যায়","h":"module-17-reinforcement-learning-and-feedback/lecture-01-correction-target-preference-and-reward.md"},{"k":"M17 · L02","t":"Agent, Environment, State, Action, Reward","h":"module-17-reinforcement-learning-and-feedback/lecture-02-agent-environment-state-action-reward.md"}],"story":{"problem":"পথে পথে সঠিক উত্তর নেই, শুধু শেষে ফল।","idea":"ফলের মান একটা সংখ্যায়; model সেটা বাড়াতে শেখে।"}}],"story":{"problem":"model-কে শেখাতে হলে কিছু একটা সংকেত চাই।","idea":"target-এর বদলে সংকেত হতে পারে সঠিক উত্তর, সংশোধন, পছন্দ-জোড়া বা reward।"}},{"id":"objective","name":"Objective","definition":"Training-এ যে সংখ্যাভিত্তিক লক্ষ্য কমাতে বা বাড়াতে চাই।","insight":{"fact":"Objective সবসময় শুধু prediction error নয়। জটিলতা কমানোর penalty-ও থাকতে পারে; তাই loss কমানোর লক্ষ্য কী, তা আগে দেখা দরকার।"},"seq":"৩","children":[{"id":"data-fit-objective","name":"Data-fit Objective","definition":"Observed target বা data-র সঙ্গে model কতটা মেলে, সেই লক্ষ্য।","insight":{"fact":"Regression-এ squared error কমানো; probabilistic model-এ likelihood বাড়ানো হতে পারে।"},"story":{"problem":"প্রথম লক্ষ্য data-র সঙ্গে মেলা।","idea":"training data-র উপর ভুল কমানো।"}},{"id":"regularized-objective","name":"Regularized Objective","definition":"Data fit-এর সঙ্গে parameters বা model-এর ওপর একটি পছন্দ যোগ করা।","mathDetail":{"formula":"J(θ)=L_data(θ)+λR(θ)","meaning":"R: penalty; λ: penalty-এর গুরুত্ব; θ: model parameters।","example":"L_data=0.4,R=2,λ=0.1 হলে J=0.6। λ learning rate নয়।"},"lessons":[{"k":"M07 · L03","t":"Regularization আর early stopping: overfitting-এর লাগাম","h":"module-07-generalization-and-overfitting/lecture-03-regularization-and-early-stopping.md"}],"story":{"problem":"শুধু data মেলালে model মুখস্থ করে বসে।","idea":"data-র ভুলের সঙ্গে একটা শাস্তি (বড় weight-এর বিরুদ্ধে) যোগ।"}},{"id":"minimize-loss-maximize-return","name":"Minimize Loss / Maximize Return","definition":"সব learning objective minimization আকারে শুরু হয় না।","insight":{"fact":"RL-এ expected return বাড়াতে চাই। Minimizing −J এবং maximizing J গাণিতিকভাবে একই লক্ষ্য প্রকাশ করতে পারে।"},"story":{"problem":"supervised-এ ভুল কমানো, RL-এ reward বাড়ানো: কীভাবে মেলে?","idea":"reward বাড়ানো মানে −reward কমানো। দুটো একই ছাঁচের optimization।"}}],"story":{"problem":"শেখা মানে কী কমানো বা বাড়ানো, তা আগে বলতে হবে।","idea":"কমানো বা বাড়ানোর লক্ষ্যটা: সাধারণত loss, কখনো মোট reward।"}},{"id":"loss","name":"Loss","definition":"Output ও target-এর অমিলের মতো training-এর খারাপ ফল মাপার রাশি; সাধারণত এটি কমানো হয়।","insight":{"fact":"একটি ভুলের সংখ্যা জানানোর পাশাপাশি differentiable loss gradient বের করতে সাহায্য করে। মানুষের পছন্দের evaluation metric সবসময় সরাসরি train করা সহজ নয়।"},"seq":"৪","children":[{"id":"mse-squared-error","name":"MSE — squared error","definition":"Regression-এ বড় error-কে বেশি penalty দেওয়া।","mathDetail":{"formula":"MSE=(1/N)Σᵢ(ŷᵢ−yᵢ)²","meaning":"N: উদাহরণ সংখ্যা; y: target; ŷ: prediction।","example":"Errors=[1,−3] → MSE=(1+9)/2=5। Half-MSE নিলে gradient-এর factor বদলায়।"},"lessons":[{"k":"M02 · L02","t":"ভুল মাপা: Error ও Mean Squared Error","h":"module-02-linear-regression/lecture-02-error-and-mean-squared-error.md"}],"story":{"problem":"সংখ্যা অনুমানের মাপ চাই, যা সহজে derivative নেওয়া যায়।","idea":"ফারাকের বর্গের গড়। বড় ভুলকে বেশি শাস্তি দেয়, সবখানে মসৃণ।"},"choose":[{"label":"MAE — absolute error","when":"outlier আছে","why":"কম সংবেদনশীল","id":"mae-absolute-error"},{"label":"MSE — squared error","when":"বড় ভুল বিশেষ ক্ষতিকর","why":"বড় ভুলকে বেশি শাস্তি","id":"mse-squared-error"}]},{"id":"mae-absolute-error","name":"MAE — absolute error","definition":"Regression-এ error-এর magnitude সরাসরি মাপা।","mathDetail":{"formula":"MAE=(1/N)Σᵢ|ŷᵢ−yᵢ|","meaning":"| | হলো absolute value।","example":"Errors=[1,−3] → MAE=(1+3)/2=2। MSE-এর তুলনায় বড় error-এর প্রভাব কম; zero-তে derivative-এর বিশেষ নিয়ম লাগে।"},"lessons":[{"k":"M06 · L02","t":"Regression Metrics: MAE, MSE, RMSE ও R²","h":"module-06-model-evaluation-and-baselines/lecture-02-regression-metrics.md"}],"story":{"problem":"একটা বড় ভুল পুরো loss নষ্ট করে দিলে?","idea":"ফারাকের পরম মানের গড়। বড় ভুল আনুপাতিকভাবেই বাড়ে, তাই outlier-এ স্থির।"}},{"id":"loss--binary-cross-entropy","name":"Binary Cross-entropy","definition":"দুই class-এর সঠিক target-এ probability বাড়াতে শেখানো।","mathDetail":{"formula":"L=−[y ln(p)+(1−y)ln(1−p)]","meaning":"y: 0 বা 1; p: class 1-এর probability estimate।","example":"y=1,p=0.8 → L≈0.2231। এটি threshold দিয়ে পাওয়া class label-এর ওপর হিসাব নয়।"},"lessons":[{"k":"M03 · L03","t":"Log loss: classification-এর ভুল মাপা","h":"module-03-logistic-regression/lecture-03-log-loss.md"}],"story":{"problem":"probability-র মান ঠিক হলো কি না মাপতে হবে।","idea":"সঠিক দলের probability যত কম, শাস্তি তত বেশি। আত্মবিশ্বাসী ভুল সবচেয়ে বেশি শাস্তি পায়।"}},{"id":"multiclass-cross-entropy","name":"Multiclass Cross-entropy","definition":"বহু class-এর probability distribution target-এর সঙ্গে মেলানো।","mathDetail":{"formula":"L=−Σₖ tₖ ln(pₖ)","meaning":"t: target distribution; p: predicted distribution।","example":"t=[0,1,0],p=[0.1,0.7,0.2] → L=−ln(0.7)≈0.3567।"},"lessons":[{"k":"M12 · L04","t":"Next-token Prediction ও Cross-entropy","h":"module-12-text-sequences-and-multimodal-models/lecture-04-next-token-and-cross-entropy.md"}],"story":{"problem":"অনেক দলের probability সঠিকতা মাপব কীভাবে?","idea":"সঠিক দলের probability-র −ln। বাকি দলের probability softmax-এর কারণে নিজে থেকেই কমে।"}},{"id":"reduction-sum-mean","name":"Reduction — sum না mean?","definition":"অনেক example/token-এর loss একত্র করার নিয়ম।","insight":{"fact":"Sum ও mean-এর gradient scale আলাদা। Padding বাদ দিলে mean-এর denominator-এ বৈধ token সংখ্যা ব্যবহার হতে পারে।"},"story":{"problem":"batch-এ অনেক উদাহরণের loss: যোগ করব না গড়?","idea":"sum হলে batch-আকার বাড়লে loss বাড়ে; mean হলে স্থির, তাই learning rate বদলাতে হয় না।"}}],"story":{"problem":"model ভালো না খারাপ তা মুখে বললে কম্পিউটার বোঝে না। আমরা একটা সংখ্যা চাই, যা ছোট হলে model ভালো।","idea":"loss হলো ভুলের মাপ। সংখ্যার কাজে আসল আর অনুমানের ফারাকের বর্গ (squared error), দলের কাজে সঠিক দলকে কম probability দিলে শাস্তি (cross-entropy)।","next":[{"label":"Gradient","why":"ভুল মাপা গেল, এবার কোন weight কোন দিকে সরবে?","id":"training--gradient"}]},"choose":[{"label":"MSE — squared error","when":"সংখ্যা অনুমান","why":"বড় ভুলকে বেশি শাস্তি","id":"mse-squared-error"},{"label":"Binary Cross-entropy","when":"দুই দল","why":"ভুল উত্তরে নিশ্চিত হলে বেশি শাস্তি","id":"loss--binary-cross-entropy"},{"label":"Multiclass Cross-entropy","when":"অনেক দল","why":"softmax-এর সঙ্গে","id":"multiclass-cross-entropy"}]},{"id":"training--parameters","name":"Parameters","definition":"Model-এর শেখা অভ্যন্তরীণ মান; যেমন neural network-এর weight ও bias।","insight":{"fact":"Inference-এ input বদলালে output বদলায়, অথচ শেখা parameters সাধারণত অপরিবর্তিত থাকে। নতুন উত্তর মানেই model আবার training করল—এমন নয়।"},"seq":"৫","children":[{"id":"training--parameters--trainable-parameters","name":"Trainable Parameters","definition":"যে parameters-এর মান এই training run-এ update করার জন্য নির্বাচন করা হয়েছে।","insight":{"fact":"Full fine-tuning-এ অনেক parameter; head-only বা LoRA-তে নির্বাচিত অংশ শেখে।"},"lessons":[{"k":"M13 · L02","t":"Fine-Tuning পদ্ধতির মানচিত্র: দুটো আলাদা প্রশ্ন","h":"module-13-pretraining-finetuning-and-lora/lecture-02-finetuning-methods-map.md"},{"k":"M13 · L06","t":"Full, Selective ও Head-only Training: কে নড়বে, কে স্থির","h":"module-13-pretraining-finetuning-and-lora/lecture-06-full-selective-and-head-training.md"}],"story":{"problem":"কোন parameter-গুলো update হবে?","idea":"যেগুলোতে gradient পৌঁছায় ও optimizer বদলায়।"}},{"id":"training--parameters--frozen-parameters","name":"Frozen Parameters","definition":"মান update হয় না, তবে forward computation-এ ব্যবহৃত হতে পারে।","insight":{"fact":"Frozen layer দিয়ে gradient আগের trainable অংশে পৌঁছানোর প্রয়োজন থাকতে পারে; freeze মানে computation বাতিল নয়।"},"lessons":[{"k":"M13 · L02","t":"Fine-Tuning পদ্ধতির মানচিত্র: দুটো আলাদা প্রশ্ন","h":"module-13-pretraining-finetuning-and-lora/lecture-02-finetuning-methods-map.md"},{"k":"M13 · L06","t":"Full, Selective ও Head-only Training: কে নড়বে, কে স্থির","h":"module-13-pretraining-finetuning-and-lora/lecture-06-full-selective-and-head-training.md"}],"story":{"problem":"আগে শেখা জ্ঞান নষ্ট না করে শুধু অল্প অংশ বদলাতে চাই।","idea":"কিছু parameter আটকে রাখা, তাদের update বন্ধ। খরচ ও ভুলে যাওয়ার ঝুঁকি কমে।"}},{"id":"training--parameters--initialization","name":"Initialization","definition":"Training শুরুর parameters-এর মান নির্ধারণ।","insight":{"fact":"সমান মানে সব hidden unit শুরু করলে symmetry সমস্যা হতে পারে; random initialization unit-গুলোকে আলাদা শেখার সুযোগ দেয়।"},"lessons":[{"k":"M10 · L08","t":"Pure Python-এ একটি Neural Network শুরু থেকে Train করা","h":"module-10-neural-network-training/lecture-08-neural-network-in-python.md"},{"k":"M13 · L07","t":"LoRA-র চারটা Setting: Rank, Alpha, শুরুর মান, Dropout","h":"module-13-pretraining-finetuning-and-lora/lecture-07-lora-rank-alpha-init-dropout.md"}],"story":{"problem":"শুরুতে সব weight ০ হলে সব unit একই কাজ করবে, একই gradient পাবে, আর কখনো আলাদা হবে না।","idea":"ছোট এলোমেলো মান দিয়ে শুরু। মানের ছড়ানো ঠিক না হলে সংকেত ফুলে বা মরে যেতে পারে।"}},{"id":"training--parameters--parameter-hyperparameter","name":"Parameter বনাম Hyperparameter","definition":"Weights data থেকে শেখে; learning rate, layer count বা batch size training/configuration-এর পছন্দ।","insight":{"fact":"Hyperparameter validation দিয়ে বাছা যায়; সাধারণ gradient update-এ সব hyperparameter নিজে শেখে না।"},"lessons":[{"k":"M09 · L02","t":"Parameters: Model-এর শেখা মান","h":"module-09-model-architecture/lecture-02-parameters-
