<!doctype html>
<!-- এই ফাইল তৈরি-করা (generated)। সরাসরি বদলিও না: atlas/data/map.json বদলাও, তারপর python3 atlas/build.py --out ml-mapping.html -->
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML · শেখার মানচিত্র</title>
<meta name="description" content="Machine Learning-এর বিষয়গুলো একটা গাছের মতো সাজানো: কাজ, শেখার ধরন, model, training, evaluation। নামে ক্লিক করলে সংজ্ঞা, ছোট হিসাব আর কোর্সের পাঠ।">
<meta property="og:type" content="website">
<meta property="og:title" content="ML · শেখার মানচিত্র">
<meta property="og:description" content="ML-এর বিষয়গুলো এক গাছে: কাজ, শেখার ধরন, model, training, evaluation। প্রতিটা নামে সংজ্ঞা, হিসাব ও কোর্সের পাঠ।">
<meta name="theme-color" content="#151a17">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22%2317251d%22%2F%3E%3Cpath%20d%3D%22M32%2017v14M15%2043V31h34v12M32%2031v12%22%20fill%3D%22none%22%20stroke%3D%22%23a2dfbc%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2216%22%20r%3D%227%22%20fill%3D%22%23e4eddf%22%2F%3E%3Cg%20fill%3D%22%23a2dfbc%22%3E%3Ccircle%20cx%3D%2215%22%20cy%3D%2246%22%20r%3D%226%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2246%22%20r%3D%226%22%2F%3E%3Ccircle%20cx%3D%2249%22%20cy%3D%2246%22%20r%3D%226%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
/* Theme: light (default), dark। JS data-theme বসায়; JS না চললে OS-এর পছন্দ মানে। */
:root{
  color-scheme:light;
  --ink:#173a36;--muted:#586a63;--line:#d3ddd3;--paper:#fbfcf7;--accent:#1e6a5d;
  --card:#ffffff;--chip:#eef4eb;--toggle:#f1f6ee;--hover:#e9f2e7;--hover-line:#cfe0cc;
  --root-bg:#173a36;--root-ink:#ffffff;--dlg:#ffffff;--code-bg:#eef6ef;--code-ink:#173a36;--code-line:#c4d9c8;
  --link:#17559a;--input:#ffffff;--btn:#ffffff;--btn-hover:#eef4eb;--btn-line:#c9d6c9;--focus:#d89a1f;
  --shadow:0 12px 45px #173a3610;--backdrop:#173a3680;--reading-size:19px;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --ink:#e3e5df;--muted:#b2b9b2;--line:#3a453e;--paper:#151a17;--accent:#b4d4bd;
  --card:#1c231e;--chip:#263c2e;--toggle:#24372b;--hover:#2b4032;--hover-line:#4e7059;
  --root-bg:#a2dfbc;--root-ink:#10291b;--dlg:#222b25;--code-bg:#14251b;--code-ink:#d4f1dc;--code-line:#49634e;
  --link:#a5d9ff;--input:#202e25;--btn:#2c3930;--btn-hover:#3b4d40;--btn-line:#596d5e;--focus:#e2ad46;
  --shadow:0 12px 45px #00000025;--backdrop:#0b100de0;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    color-scheme:dark;
    --ink:#e3e5df;--muted:#b2b9b2;--line:#3a453e;--paper:#151a17;--accent:#b4d4bd;
    --card:#1c231e;--chip:#263c2e;--toggle:#24372b;--hover:#2b4032;--hover-line:#4e7059;
    --root-bg:#a2dfbc;--root-ink:#10291b;--dlg:#222b25;--code-bg:#14251b;--code-ink:#d4f1dc;--code-line:#49634e;
    --link:#a5d9ff;--input:#202e25;--btn:#2c3930;--btn-hover:#3b4d40;--btn-line:#596d5e;--focus:#e2ad46;
    --shadow:0 12px 45px #00000025;--backdrop:#0b100de0;
  }
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans Bengali","Nirmala UI",system-ui,sans-serif;font-size:16px}
.skip{position:absolute;left:-999px;top:8px;background:var(--root-bg);color:var(--root-ink);padding:8px 12px;border-radius:8px;z-index:10}
.skip:focus{left:8px}
button,input{font:inherit}button{cursor:pointer}

header{max-width:1500px;margin:0 auto;padding:42px 24px 14px;display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}
h1{font-size:clamp(24px,4vw,36px);margin:5px 0;font-weight:650}
.eyebrow{font:11px system-ui;letter-spacing:3px;color:var(--accent)}
header p{color:var(--muted);font-size:14px;margin:8px 0}
.controls{display:flex;flex-wrap:wrap;gap:8px}
input{background:var(--input);border:1px solid var(--btn-line);border-radius:10px;padding:10px 13px;width:260px;max-width:100%;color:var(--ink)}
input::placeholder{color:var(--muted)}
.control{border:1px solid var(--btn-line);background:var(--btn);border-radius:10px;padding:9px 12px;color:var(--ink);font-size:13px}
.control:hover{background:var(--btn-hover)}

/* শাখায় লাফানোর সারি */
#jump{max-width:1500px;margin:0 auto;padding:0 24px 14px;display:flex;flex-wrap:wrap;gap:8px}
#jump button{border:1px solid var(--btn-line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13px}
#jump button:hover{background:var(--hover)}

main{max-width:1500px;margin:0 auto;padding:0 24px 30px}
.layout{display:block}
.content{min-width:0;max-width:1100px;margin:0 auto}
body.plan-open .layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
body.plan-open .content{margin:0;max-width:none}
.map{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
footer{max-width:1100px;margin:0 auto;padding:0 24px 50px;color:var(--muted);font-size:13px}

ul{list-style:none;padding-left:26px;margin:0}
li{position:relative;padding:5px 0}
li:before{content:"";position:absolute;left:-15px;top:0;bottom:0;border-left:1px solid var(--line)}
li:after{content:"";position:absolute;left:-15px;top:27px;width:14px;border-top:1px solid var(--line)}
li:last-child:before{bottom:calc(100% - 27px)}
.root{padding-left:0}.root>li:before,.root>li:after{display:none}
.row{display:flex;align-items:center;gap:6px;min-height:48px}
.toggle{flex:0 0 29px;width:29px;height:29px;border-radius:50%;border:1px solid var(--line);background:var(--toggle);color:var(--accent);font-size:19px;line-height:1}
.toggle:hover{background:var(--hover)}
.dot{width:29px;flex:0 0 29px;text-align:center;color:var(--muted)}
.term{border:1px solid transparent;background:transparent;text-align:start;border-radius:9px;padding:9px 12px;color:var(--ink);font-size:17px;line-height:1.7;overflow-wrap:anywhere}
.term:hover{background:var(--hover);border-color:var(--hover-line)}
.term:focus-visible,.toggle:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.level-0>.row>.term{font-size:22px;background:var(--root-bg);color:var(--root-ink);font-weight:650}
.level-1>.row>.term{background:var(--chip);font-weight:600}
.count{font:11px system-ui;color:var(--muted);padding-inline-start:7px}
.level-0>.row>.term .count{color:inherit;opacity:.7}
.where{display:none;font-size:12px;color:var(--muted);padding-inline-start:10px;font-weight:400}
body.searching .where{display:inline}
.pulse>.row>.term{animation:pulse 1.6s ease-out 1}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--focus)}100%{box-shadow:0 0 0 14px #0000}}
[hidden]{display:none!important}
#empty{padding:24px;color:var(--muted)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:20px;padding:20px 38px 38px;max-width:740px;width:calc(100% - 32px);max-height:85dvh;overflow-y:auto;overscroll-behavior:contain;color:var(--ink);background:var(--dlg);box-shadow:0 20px 100px #00000060;scrollbar-gutter:stable}
dialog::backdrop{background:var(--backdrop);backdrop-filter:blur(2px)}
.dlg-bar{position:sticky;top:-20px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;background:var(--dlg)}
.reading-tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:13px}
.reading-tools button,.close{border:1px solid var(--btn-line);border-radius:8px;background:var(--btn);color:var(--ink);min-width:42px;min-height:40px;font-size:17px}
.reading-tools button:hover,.close:hover{background:var(--btn-hover)}
.reading-tools button:disabled{opacity:.4;cursor:default}
.reading-tools .textbtn{font-size:13px;padding:0 12px}
.reading-tools output{min-width:38px;text-align:center;font:13px system-ui}
#crumb{font-size:13px;line-height:1.8;padding-top:14px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px}
#crumb button{background:none;border:0;padding:2px 4px;color:var(--link);font-size:13px;border-radius:5px}
#crumb button:hover{background:var(--hover)}
#crumb .sep{opacity:.6}
dialog h2{font-size:27px;line-height:1.55;margin:12px 0 18px}
dialog #def-text,dialog .profile-section p{font-size:var(--reading-size);line-height:2;max-width:60ch;font-weight:400;text-align:start;margin:0}
dialog .profile-section,#lessons .profile-section,#related .profile-section{border-top:1px solid var(--line);margin-top:26px;padding-top:22px}
dialog .profile-section p+p{margin-top:18px}
dialog h3{font-size:17px;line-height:1.7;color:var(--accent);margin:0 0 12px;font-weight:600}
dialog .source-note{font-size:14px;line-height:1.9;margin-top:28px;color:var(--muted)}
dialog summary{cursor:pointer;color:var(--accent);font-size:15px;line-height:1.8}
#more>details{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
dialog a{color:var(--link);overflow-wrap:anywhere}
dialog a{display:block;font-size:15px;line-height:1.8;padding-top:10px}
.math-formula{font-family:ui-monospace,monospace;font-size:18px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;padding:18px;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--code-line);border-radius:12px;margin-top:22px}

/* পাঠ ও ঘোরাঘুরির তালিকা */
.lesson-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lesson-list li{padding:0}.lesson-list li:before,.lesson-list li:after{display:none}
.lesson{display:flex;gap:10px;align-items:baseline;font-size:16px;line-height:1.7;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--chip);color:var(--ink);text-decoration:none}
a.lesson:hover{background:var(--hover);border-color:var(--hover-line)}
.lesson .k{font:12px system-ui;color:var(--accent);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--btn-line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:15px;line-height:1.5;text-align:start}
.chips button:hover{background:var(--hover)}
.chips .at{display:block;font-size:12px;color:var(--muted)}

@media(max-width:650px){
  header{padding-top:28px}dialog{padding:14px 20px 28px;max-height:90dvh}dialog h2{font-size:24px}.term{font-size:16px}
  .reading-tools{gap:7px}ul{padding-left:18px}.map{padding:14px}.level-0>.row>.term{font-size:19px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
@media print{header .controls,#jump,.skip,footer{display:none}body{background:#fff;color:#000}.map{box-shadow:none;border:0}}

/* গল্প: তিন ধাপ */
.story .steps{display:grid;gap:18px}
.step{display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start;position:relative}
.step:not(:last-child):before{content:"";position:absolute;left:16px;top:36px;bottom:-14px;border-left:2px solid var(--line)}
.step .n{width:34px;height:34px;border-radius:50%;background:var(--root-bg);color:var(--root-ink);display:grid;place-items:center;font-weight:650;font-size:16px}
.step .lbl{font-size:14px;font-weight:650;color:var(--accent);padding-top:6px;margin-bottom:2px}
.step p{margin:0;font-size:var(--reading-size);line-height:1.95;max-width:60ch}
.nexts{display:grid;gap:8px;margin-top:6px}
.next{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;font-size:16px;line-height:1.7}
.next .why{color:var(--muted)}
.pick{border:1px solid var(--btn-line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 13px;font-size:15px;line-height:1.5;text-align:start}
button.pick:hover{background:var(--hover);border-color:var(--hover-line)}
.pick.plain{background:transparent;border-style:dashed}
.history{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line);display:grid;gap:12px}
.history .lbl{font-size:14px;font-weight:650;color:var(--accent)}
.hrow{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:16px;line-height:1.8}
.hrow .y{font:650 14px system-ui;color:var(--root-ink);background:var(--root-bg);border-radius:8px;padding:2px 9px;height:fit-content;white-space:nowrap}
.hrow .src{grid-column:2;font-size:13px;color:var(--link)}
/* কোন ক্ষেত্রে কোনটা */
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--chip)}
.choice .when{font-size:16px;line-height:1.7}
.choice .arrow{color:var(--muted)}
.choice .why{grid-column:1/-1;font-size:14px;color:var(--muted);line-height:1.6}
/* আরও জানতে */
details.more{margin-top:30px;border:1px dashed var(--line);border-radius:12px;padding:6px 16px}
details.more>summary{cursor:pointer;color:var(--accent);font-size:15px;line-height:1.8;padding:8px 0}
details.more .profile-section:first-child{border-top:0;margin-top:6px}
@media(max-width:650px){.choice{grid-template-columns:1fr}.choice .arrow{display:none}.step{grid-template-columns:30px 1fr;gap:10px}.step .n{width:30px;height:30px}.step:not(:last-child):before{left:14px}}

/* দেখার ধরন: গাছ | গল্পের পথ */
#views{max-width:1500px;margin:0 auto;padding:0 24px 12px;display:flex;gap:6px}
#views button{border:1px solid var(--btn-line);background:var(--btn);color:var(--ink);border-radius:10px;padding:8px 16px;font-size:14px}
#views button[aria-selected=true]{background:var(--root-bg);color:var(--root-ink);border-color:var(--root-bg)}
#path-count{font-size:12px;opacity:.85;margin-left:4px}
body.path-mode .map,body.path-mode #jump{display:none}
#pathview{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
#pathview[hidden]{display:none}
.path-head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:6px}
.path-head p{margin:0;color:var(--muted);font-size:15px;max-width:640px;line-height:1.7}
.progress{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin:8px 0 18px}
.progress .bar{flex:1;height:10px;border-radius:99px;background:var(--chip);overflow:hidden;border:1px solid var(--line)}
.progress .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.chapter{margin:22px 0 6px}
.chapter h3{margin:0;font-size:19px}
.chapter .intro{margin:3px 0 10px;color:var(--muted);font-size:14.5px}
.pstep{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:8px 0;background:var(--paper)}
.pstep.done{background:var(--chip)}
.pstep .num{width:30px;height:30px;border-radius:50%;background:var(--root-bg);color:var(--root-ink);display:grid;place-items:center;font-size:13px;font-weight:650}
.pstep.done .num{background:var(--accent);color:var(--paper)}
.pstep button.open{all:unset;cursor:pointer;display:block;text-align:start}
.pstep button.open:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.pstep .ttl{font-weight:650;font-size:17px}
.pstep .sub{color:var(--muted);font-size:14.5px;line-height:1.6;margin-top:2px}
.tick{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.tick input{width:18px;height:18px;padding:0;accent-color:var(--accent)}
.pathbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 12px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--chip);font-size:14px}
.pathbar .pos{color:var(--muted);flex:1;min-width:140px}
.pathbar button{border:1px solid var(--btn-line);background:var(--btn);color:var(--ink);border-radius:9px;padding:6px 12px;font-size:14px}
.pathbar button:hover:not(:disabled){background:var(--btn-hover)}
.pathbar button:disabled{opacity:.4;cursor:default}
.pathbar button.on{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.reset{border:1px solid var(--btn-line);background:var(--btn);color:var(--ink);border-radius:9px;padding:6px 12px;font-size:13px}
.reset.warn{border-color:#b3412f;color:#b3412f}
@media(max-width:650px){#views,#jump{padding-left:16px;padding-right:16px}#pathview{padding:14px}.pstep{grid-template-columns:auto 1fr}.pstep .tick{grid-column:2}}
@media print{#views,#pathbar{display:none}}

/* বাস্তবে কী হয় */
.practice .scn{margin:4px 0 12px;line-height:1.8}
.pblock{margin:12px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.pblock .lbl{font-size:13px;font-weight:650;color:var(--accent);margin-bottom:6px}
.pblock ul{margin:0;padding-left:20px;list-style:disc}
.pblock li{padding:2px 0;line-height:1.7}.pblock li:before,.pblock li:after{display:none}
.pblock.exp{border-style:dashed}
.pblock.pit .lbl{color:#b3412f}
:root[data-theme=dark] .pblock.pit .lbl{color:#f0a090}
.fact{display:flex;flex-wrap:wrap;gap:4px 10px;padding:5px 0;border-top:1px dashed var(--line);line-height:1.7}
.fact:first-of-type{border-top:0}
.fact .src{font-size:13px;color:var(--link)}
.practice .outside{font-size:14px;color:var(--muted);margin:8px 0 0}
@media print{.pblock{break-inside:avoid}}

/* ক্রমিক ধাপ-নম্বর */
.seq{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;margin-inline-end:9px;border-radius:99px;background:var(--accent);color:var(--paper);font:600 13px system-ui;vertical-align:1px}
.level-0>.row>.term .seq{background:var(--root-ink);color:var(--root-bg)}
.seq.big{font-size:13px;height:26px;padding:0 10px;margin-inline-end:6px;vertical-align:4px}

/* বাছাই ও আমার পথ */
.control.strong{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:600}
.control.strong:hover{filter:brightness(1.08);background:var(--accent)}
#plan-count{margin-left:6px;background:var(--paper);color:var(--accent);border-radius:99px;padding:0 8px;font-size:12px}
.kchip{display:inline-block;font:600 11px system-ui;padding:2px 9px;border-radius:99px;margin-inline-start:9px;vertical-align:2px;border:1px solid var(--btn-line);background:var(--paper);color:var(--muted);white-space:nowrap}
.kchip.one{color:var(--accent);border-color:var(--accent)}
.kchip.many{color:var(--link);border-color:var(--link)}
.kchip.tool{color:var(--ink);background:var(--chip)}
.kchip.basis{margin:0;color:var(--muted)}
.kchip.basis.paper{color:var(--link);border-color:var(--link)}
.kchip.basis.experience{border-style:dashed}
.selbtn{margin-inline-start:auto;border:1px solid var(--accent);background:var(--paper);color:var(--accent);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.selbtn:hover{background:var(--chip)}
.selbtn[aria-pressed=true]{background:var(--accent);color:var(--paper)}
li.picked>.row>.term{background:var(--hover);border-color:var(--hover-line)}
.row{flex-wrap:wrap}
#plan{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
#plan[hidden]{display:none}
.plan-head{display:flex;align-items:center;gap:10px}
.plan-head h2{margin:0;font-size:20px}
.plan-n{color:var(--muted);font-size:13px;flex:1}
.plan-close,.pi-x{border:1px solid var(--btn-line);background:var(--btn);color:var(--ink);border-radius:8px;width:30px;height:30px;line-height:1}
.plan-empty{color:var(--muted);line-height:1.8;font-size:15px}
.plan-acts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.plan-step h3{margin:14px 0 6px;font-size:14px;color:var(--accent)}
.plan-item{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:11px;margin:6px 0;background:var(--paper)}
.plan-item.warn{border-color:#b3412f}
.pi-body{flex:1;min-width:0}
.pi-path{font-size:12px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.pi-name{all:unset;cursor:pointer;font-weight:650;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.pi-name:hover{text-decoration:underline}.pi-name:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pi-meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-top:2px}
.plan-pending{margin-top:14px}.plan-pending h3{font-size:14px;margin:0 0 6px}
.pending{border:1px dashed var(--btn-line);background:transparent;color:var(--ink);border-radius:99px;padding:4px 11px;font-size:13px;margin:3px 4px 3px 0}
.pending:hover{background:var(--chip)}
#plan .reset{margin-top:14px;width:100%}
.pickbox{margin:8px 0 12px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.pickbox .when{flex-basis:100%;margin:2px 0 0;color:var(--muted);font-size:15px;line-height:1.7}
.toolinfo{flex-basis:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.toolinfo .lbl{font-size:13px;font-weight:650;color:var(--accent);margin-bottom:6px}
.trow{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:3px 0;font-size:14.5px;line-height:1.6;border-top:1px dashed var(--line)}
.trow:first-of-type{border-top:0}.trow .k{color:var(--muted)}.trow .v,.trow a{overflow-wrap:anywhere}
@media(max-width:900px){
  body.plan-open .layout{display:block}
  #plan{position:fixed;left:8px;right:8px;bottom:8px;top:auto;max-height:68vh;z-index:30;box-shadow:0 -10px 40px #00000040}
  .trow{grid-template-columns:90px 1fr}
}
@media print{#plan,.selbtn,#plan-toggle{display:none!important}}

/* পথের ধরন ও ধাপ-চিপ */
#startbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.modes{display:flex;flex-wrap:wrap;gap:8px}
.modebtn{border:1px solid var(--accent);background:var(--paper);color:var(--accent);border-radius:12px;padding:9px 16px;font-size:15px;font-weight:650}
.modebtn:hover{background:var(--chip)}
.modebtn.on{background:var(--accent);color:var(--paper)}
.stepchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stepchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--btn-line);background:var(--paper);color:var(--ink);border-radius:99px;padding:5px 12px 5px 6px;font-size:13px}
.stepchip:hover{background:var(--chip)}
.stepchip .sn{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:var(--root-bg);color:var(--root-ink);font:600 12px system-ui}
.stepchip.done{border-color:var(--accent)}
.stepchip.done .sn{background:var(--accent);color:var(--paper)}
.stepchip .sc{color:var(--muted);font-size:12px}
.kchip.mode{color:var(--paper);background:var(--accent);border-color:var(--accent)}
.selbtn.go{background:transparent}
.plan-steps{margin:10px 0 4px}
.plan-steps .modes{flex-direction:column}
.plan-steps .modebtn{text-align:start}
@media print{#startbar{display:none}}

/* বাছার কারণ: কখন, কেন, দাম, কীভাবে */
.guide{flex-basis:100%;border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--paper)}
.grow{display:grid;grid-template-columns:128px 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--line);line-height:1.7;font-size:15.5px}
.grow:first-child{border-top:0}
.grow .gk{font-weight:650;color:var(--accent);font-size:14px}
.grow.cost .gk{color:#b3412f}:root[data-theme=dark] .grow.cost .gk{color:#f0a090}
.grow .gv a{display:inline-block;margin:1px 0}
.infonote{flex-basis:100%;border:1px dashed var(--btn-line);border-radius:12px;padding:10px 12px;line-height:1.7;color:var(--muted);font-size:15px}
.kchip.info{color:var(--muted);border-style:dotted;margin-inline-start:8px}
.plan-note{font-size:13px;line-height:1.6;color:var(--muted);border:1px dashed var(--btn-line);border-radius:10px;padding:8px 10px;margin:10px 0}
@media(max-width:650px){.grow{grid-template-columns:1fr;gap:2px}}

/* Pseudo-code */
details.pseudo{margin:10px 0;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
details.pseudo summary{cursor:pointer;padding:8px 12px;font-weight:650;font-size:14px;color:var(--accent)}
.pseudo-pre{margin:0;padding:10px 12px;font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:46vh;overflow:auto;border-top:1px dashed var(--line);color:var(--ink)}
@media print{details.pseudo{break-inside:avoid}}

 optimizer.step(trainable only); schedule.step(); zero_grad()","    val_score = evaluate(val, metrics)","    ?ckpt save_checkpoint(policy = {{ckpt}})","    if should_stop(val_score, stop_rule): break","","# ধাপ ৪ — Output: মাপা ও deploy","report = compare(baseline, tuned_model, on = test, metrics = metrics)","?eval_tools measure_with {{eval_tools}}","?eval_open open_ended_check = {{eval_open}}","?regress old_abilities_check = {{regress}}","package = {{deploy_form}}","serve_with {{engine}}","?quant quantize_for_serving = {{quant}}","","# ধাপ ৫ — ভুল থেকে আবার","{{iterate}}"],"mode-scratch":["# ===== আমার পথ: শূন্য থেকে Train — pseudo-code =====","# ‹? …› মানে এই সিদ্ধান্ত এখনও বাছোনি; বাছলে লেখাটা নিজে বদলে যাবে।","","# ধাপ ১ — দরকার যাচাই ও লক্ষ্য","justify = {{need}}","metrics = {{metrics}}","","# ধাপ ২ — Architecture","model = {{family}}","?arch_impl implementation = {{arch_impl}}","?norm normalization = {{norm}}","?position position_info = {{position}}","?attn attention_efficiency = {{attn}}","","# ধাপ ৩ — Tokenizer ও data","?tokenizer tokenizer = {{tokenizer}}","?tok_lib tokenizer_library = {{tok_lib}}","?corpus clean(data, steps = {{corpus}})","data = load({{data_tool}})","train, val, test = split(data, by = {{split}})   # test তুলে রাখো","","# ধাপ ৪ — Initialization ও hyperparameter","init(model, {{init}})","optimizer = {{optimizer}}","lr        = {{lr}}","schedule  = {{schedule}}","","# ধাপ ৫ — স্কেল ও memory","?memory {{memory}}","?flash_impl attention_impl = {{flash_impl}}","parallel = {{parallel}}","?launcher launch_with {{launcher}}","?large large_scale_framework = {{large}}","","# ধাপ ৬ — Training চালানো","run_with {{framework}}","?tracking log_to {{tracking}}","for step in 1, 2, ...:","    batch = next(train)","    ?fwd_ctx # forward চলে এই ক্ষেত্রে: {{fwd_ctx}}","    loss = task_loss(model(batch.input), batch.target)   # যেমন next-token cross-entropy","    backward(loss)","    ?accum_step if step % {{accum_step}} == 0:","    ?accum_step     optimizer.s ":"https://ieeexplore.ieee.org/document/9357585"}]},"lessons":[{"k":"M09 · L03","t":"একটি Unit: কয়েকটি input থেকে একটি ফল","h":"module-09-model-architecture/lecture-03-one-neuron.md"}],"story":{"problem":"একটা সোজা রেখা সব সম্পর্ক ধরতে পারে না। কিন্তু অনেক ছোট ছোট হিসাব জুড়লে অনেক কিছু ধরা যায়।","idea":"unit হলো সেই ছোট হিসাব: input নেয়, weighted sum + bias করে, activation দিয়ে বাঁক আনে, ফল পরের অংশে পাঠায়। অনেক unit মিলে network।","next":[{"label":"Layer","why":"unit-গুলো কীভাবে সাজানো হয়","id":"layer"}]}},{"id":"layer","name":"Layer","definition":"Neural network-এর হিসাবের একটি স্তর।","insight":{"fact":"সব layer-এর parameter নেই। ReLU বা reshape layer গুনলে depth বাড়তে পারে, কিন্তু parameter count বাড়তেই হবে না।"},"lessons":[{"k":"M09 · L05","t":"পাশাপাশি Unit ও পরপর Layer","h":"module-09-model-architecture/lecture-05-hidden-layer.md"}],"story":{"problem":"অনেক unit এলোমেলো জুড়লে সামলানো যায় না।","idea":"পাশাপাশি থাকা unit-দের একটা স্তরে (layer) সাজানো হয়। স্তরের পর স্তর: আগের স্তরের ফল পরের স্তরের input।","next":[{"label":"Architecture","why":"সব layer মিলিয়ে নকশা","id":"architecture"}]}},{"id":"architecture","name":"Architecture","definition":"Model-এর অংশগুলো কী এবং কীভাবে যুক্ত—সেই গঠন।","insight":{"fact":"কত layer, কী সংযোগ ও কী operation—এসব গঠন। Weight-এর নির্দিষ্ট মান গঠনের বিবরণ নয়; training সেগুলো শেখে।"},"lessons":[{"k":"M09 · L08","t":"Architecture, Parameters ও Training আলাদা করা","h":"module-09-model-architecture/lecture-08-architecture-vs-training.md"},{"k":"M09 · L09","t":"Architecture কীভাবে বেছে নেওয়া হয়","h":"module-09-model-architecture/lecture-09-designing-a-model-architecture.md"}],"story":{"problem":"training শুরুর আগে ঠিক করতে হয় model-এর অংশ কী কী আর কীভাবে জুড়ে আছে। নইলে শেখানোর জায়গাই নেই।","idea":"architecture হলো সেই নকশা: কয়টা layer, কয়টা unit, কোন activation। এটা আমরা বেছে দিই। training শুধু নকশার ভেতরের মান (weight, bias) বদলায়, নকশা নয়।","next":[{"label":"Parameter বনাম Hyperparameter","why":"কোনটা শেখা হয়, কোনটা আমরা বাছি","id":"general-structure--parameters--parameter-hyperparameter"}]}},{"id":"representation","name":"Representation","definition":"তথ্যকে model-এর কাজের উপযোগী সংখ্যার রূপে প্রকাশ।","insight":{"fact":"একই ছবি raw pixel, edge feature বা learned embedding—বিভিন্ন representation-এ প্রকাশ করা যায়। কাজ সহজ বা কঠিন হওয়ার পেছনে এই পছন্দ গুরুত্বপূর্ণ।"},"story":{"problem":"কাঁচা ছবি বা লেখা সরাসরি কাজে লাগানো কঠিন।","idea":"তথ্যকে model-এর কাজের উপযোগী সংখ্যার রূপে প্রকাশ করা। ভালো representation কাজকে সহজ করে। neural network নিজেই ভেতরের স্তরে এমন representation শেখে।"}},{"id":"basics--attention","name":"Attention","definition":"বর্তমান হিসাবের জন্য কোন অংশের তথ্য কতটা ব্যবহার হবে, তা input অনুযায়ী নির্ধারণের ব্যবস্থা।","insight":{"fact":"অনুবাদে পুরো source sentence একটি vector-এ গুঁজে রাখলে তথ্য হারানোর সমস্যা ছিল। প্রয়োজনমতো source-এর অংশে ফিরে দেখার ব্যবস্থা সেই bottleneck কমাতে সাহায্য করে।","history":"২০১৪ সালে Bahdanau, Cho ও Bengio-এর অনুবাদ গবেষণায় source sentence-এর প্রাসঙ্গিক অংশে soft alignment ব্যবহার করা হয়। Transformer (২০১৭)-এর আগেও neural Attention ছিল।","sources":[{"title":"Bahdanau et al., 2014","url":"https://arxiv.org/abs/1409.0473"}]},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"লম্বা লেখায় প্রতিটা অংশ সমান গুরুত্বে দেখলে আসল অংশটা ঢাকা পড়ে যায়। এই মুহূর্তের হিসাবে কোন অংশ কাজের, তা আগে থেকে বলে দেওয়া যায় না।","idea":"attention input দেখেই ঠিক করে নেয় এই হিসাবের জন্য কোন অংশের তথ্য কতটা ব্যবহার হবে। প্রতিটা অংশ বাকি অংশগুলোর দিকে তাকিয়ে গুরুত্ব বাছে।","next":[{"label":"Transformer","why":"attention দিয়ে গড়া model","id":"transformer"}]}},{"id":"basics--weight","name":"Weight","definition":"Input বা মধ্যবর্তী মানের প্রভাব নিয়ন্ত্রণকারী শেখা গুণক।","insight":{"fact":"Weight ঋণাত্মকও হতে পারে। Input বাড়লে output কমার সম্পর্কও তাই শেখা যায়; তবে বড় weight দেখেই feature বেশি গুরুত্বপূর্ণ বলা যায় না, input-এর scale-ও দেখতে হয়।"},"lessons":[{"k":"M02 · L01","t":"Linear Regression: Prediction, Weight ও Bias","h":"module-02-linear-regression/lecture-01-prediction-weight-and-bias.md"},{"k":"M09 · L02","t":"Parameters: Model-এর শেখা মান","h":"module-09-model-architecture/lecture-02-parameters-and-hyperparameters.md"}],"story":{"problem":"সব input সমান গুরুত্বের নয়। বাড়ির দামে আয়তনের প্রভাব বেশি, দেয়ালের রঙের কম।","idea":"প্রতিটা input-এর সঙ্গে একটা গুণক বসে, সেটা weight। বড় weight মানে বেশি প্রভাব। training-এ এই গুণকগুলোই শেখা হয়।","next":[{"label":"Bias","why":"weight-এর সঙ্গী সংখ্যা","id":"model--linear-regression--bias"}]}},{"id":"basics--bias","name":"Bias","definition":"Weighted sum-এর সঙ্গে যোগ হওয়া শেখা মান।","insight":{"fact":"Input শূন্য হলেও output শূন্য হওয়া বাধ্যতামূলক নয়—bias সেই স্বাধীনতা দেয়। এই গাণিতিক bias আর data-র সামাজিক পক্ষপাত একই অর্থ নয়।"},"lessons":[{"k":"M02 · L01","t":"Linear Regression: Prediction, Weight ও Bias","h":"module-02-linear-regression/lecture-01-prediction-weight-and-bias.md"},{"k":"M09 · L02","t":"Parameters: Model-এর শেখা মান","h":"module-09-model-architecture/lecture-02-parameters-and-hyperparameters.md"}],"story":{"problem":"সব input শূন্য হলেও উত্তর শূন্য হওয়ার কথা নয়। একটা শুরুর মান দরকার।","idea":"weighted sum-এর সঙ্গে একটা শেখা সংখ্যা যোগ হয়, সেটা bias। এটা রেখাকে ওপরে-নিচে সরিয়ে ঠিক জায়গায় বসায়।","next":[{"label":"Weighted Sum","why":"দুটো মিলে হিসাব","id":"model--linear-regression--weighted-sum"}]}},{"id":"basics--weighted-sum","name":"Weighted Sum","definition":"প্রতিটি মানকে তার weight দিয়ে গুণ করে ফলগুলো যোগ করা।","insight":{"fact":"শুধু weight দিয়ে গুণ ও যোগ করলে ফল এখনও linear ধরনের হিসাব। অনেকগুলো এমন layer পরপর দিলেও nonlinear activation ছাড়া নতুন nonlinear সম্পর্ক তৈরি হয় না।"},"lessons":[{"k":"M02 · L04","t":"অনেকগুলো Feature ও Dot Product","h":"module-02-linear-regression/lecture-04-many-features-and-dot-product.md"},{"k":"M09 · L03","t":"একটি Unit: কয়েকটি input থেকে একটি ফল","h":"module-09-model-architecture/lecture-03-one-neuron.md"}],"story":{"problem":"অনেকগুলো input থেকে একটাই সংখ্যা বানাতে হবে, আর প্রতিটার প্রভাব আলাদা।","idea":"প্রতিটা input-কে তার weight দিয়ে গুণ করো, সব গুণফল যোগ করো। এটাই প্রায় সব model-এর মূল হিসাব।","next":[{"label":"Unit / Neuron","why":"এই হিসাব দিয়ে unit","id":"general-structure--hidden-layer--unit-neuron"}]}},{"id":"probability","name":"Probability","definition":"কোনো ঘটনা বা শ্রেণির সম্ভাবনাকে ০ থেকে ১-এর মধ্যে প্রকাশ করা মান।","insight":{"fact":"সম্ভাবনা ০.৮ বলা আর ৮০% নির্ভুল হওয়া আলাদা কথা। Probability-এর মানদণ্ড যাচাই করতে বহু prediction-এর ফল একসঙ্গে দেখতে হয়।"},"lessons":[{"k":"M01 · L07","t":"Mean, ছড়ানো ও Probability","h":"module-01-ml-fundamentals-and-math-basics/lecture-07-probability-and-statistics-basics.md"},{"k":"M04 · L03","t":"Mean, Variance ও Probability: হাতে-কলমে অনুশীলন","h":"module-04-math-foundations-practice/lecture-03-mean-variance-and-probability.md"}],"story":{"problem":"শুধু 'হ্যাঁ' বা 'না' বললে নিশ্চিততার খবর হারিয়ে যায়। ৫১% আর ৯৯% এক জিনিস নয়।","idea":"০ থেকে ১-এর মধ্যে একটা সংখ্যা, সব সম্ভাবনার যোগফল ১। ০.৮ মানে ৮০% সম্ভাবনা।","next":[{"label":"Softmax","why":"অনেক score থেকে probability বানানো","id":"model--logistic-regression--softmax"}]}}],"lessons":[{"k":"M01 · L01","t":"Machine Learning কী?","h":"module-01-ml-fundamentals-and-math-basics/lecture-01-what-is-ml.md"},{"k":"M01 · L02","t":"ML-এর তিন ধরন ও দরকারি শব্দ","h":"module-01-ml-fundamentals-and-math-basics/lecture-02-types-and-terminology.md"}],"story":{"problem":"একসঙ্গে অনেক নতুন শব্দ এলে সব গুলিয়ে যায়: model, input, weight, layer… অথচ এরা সবাই একটাই ছোট গল্পের অংশ।","idea":"গল্পটা এমন: data থেকে উদাহরণ নিই → model নামের একটা গাণিতিক কাঠামো input থেকে output বানায় → তার ভেতরের weight আর bias শেখা হয় → শেখা শেষে নতুন input-এ prediction। বাকি মানচিত্র এই শব্দগুলোরই বড় রূপ।","next":[{"label":"Machine Learning (ML)","why":"প্রথম শব্দ থেকে শুরু","id":"machine-learning-ml"}]}},{"id":"task","name":"১. Task — কী কাজ করাতে চাই?","definition":"Model দিয়ে যে কাজটি করাতে চাই।","insight":{"fact":"একই ছবিতে শ্রেণি চেনা, object-এর অবস্থান বলা ও বর্ণনা লেখা আলাদা task। Input এক হলেও output-এর প্রয়োজন বদলাতে পারে। বাড়ির দাম সংখ্যা, spam শ্রেণি, গ্রাহকের অজানা দল clustering—আগে কাঙ্ক্ষিত ফল ঠিক করলে model বাছাইয়ের প্রশ্ন পরিষ্কার হয়। প্রতিটি task খুলে model বা পদ্ধতি → গঠন → শেখা → ব্যবহার দেখো। এগুলো সম্ভাব্য পথ; সব model-এর সম্পূর্ণ তালিকা নয়। Generative framework ও RL algorithm-কে আলাদা architecture হিসেবে ধরে নিও না। বাছাইয়ের নিয়ম: কী output চাই → কী data/label আছে → সহজ baseline → আলাদা validation data-তে accuracy, সময় ও খরচ তুলনা। নিচের নির্দেশগুলো শুরুর shortlist, নিশ্চিত winner নয়।"},"children":[{"id":"regression","name":"Regression","definition":"সংখ্যামান অনুমান করা; যেমন বাড়ির দাম।","insight":{"fact":"নামে regression থাকলেও Logistic Regression মূলত classification করে। তাই শুধু নামের শব্দ দেখে task নির্ধারণ করা যায় না।"},"seq":"১","children":[{"id":"regression--linear-regression","name":"Linear Regression","definition":"Features → weighted sum + bias → একটি বা একাধিক সংখ্যামান।","insight":{"fact":"Input থেকে output-এর সরাসরি linear সম্পর্ক; hidden layer বা tree split নেই।"},"selection":{"problem":"দেওয়া feature থেকে একটি সংখ্যামান অনুমান করতে চাই।","when":"সরল ও ব্যাখ্যাযোগ্য baseline দরকার; feature ও target-এর সম্পর্ক মোটামুটি additive/linear হতে পারে।","avoid":"জটিল interaction সরাসরি ধরবে না; ভবিষ্যতের ভিন্ন পরিবেশে extrapolation নির্ভরযোগ্য ধরে নিও না।","compare":"একই validation data-তে Tree Regressor বা Tree Ensemble-এর সঙ্গে error ও inference খরচ তুলনা করো।","example":"আয়তন ও ঘরের সংখ্যা → বাড়ির দাম। আগে Linear Regression, তারপর বেশি জটিল model সত্যিই error কমায় কি না দেখো।"},"usageDetail":{"text":"সময়ভিত্তিক forecasting baseline; ২০২৫ সালের Linear Regression as a Litmus Test গবেষণায় benchmark যাচাই।","sources":[{"title":"Forecasting study, 2025","url":"https://openreview.net/pdf?id=wfyc8vLcq0"}]},"trainingDetail":"Prediction-এর সঙ্গে target-এর অমিল, যেমন squared error, কমিয়ে coefficients শেখে।","childre ি জানান।","s":"MacTutor: Legendre","u":"https://mathshistory.st-andrews.ac.uk/Biographies/Legendre/"},{"y":"১৮৮৬","t":"Francis Galton বাবা-মা আর সন্তানের উচ্চতা নিয়ে লেখেন: লম্বা বাবা-মায়ের সন্তান গড়ে কিছুটা কম লম্বা হয়। ঘটনাটার নাম দেন 'regression towards mediocrity' (Journal of the Anthropological Institute, খণ্ড ১৫, পৃ. ২৪৬–২৬৩)।","s":"Galton, 1886 (York)","u":"https://www.york.ac.uk/depts/maths/histstat/galton_reg.htm"}]},{"id":"decision-tree-regressor","name":"Decision Tree Regressor","definition":"শর্ত দিয়ে data ভাগ → leaf-এ সংখ্যামান।","insight":{"fact":"Classification tree-এর মতো গঠন; এখানে leaf শ্রেণি নয়, সংখ্যা দেয়।"},"selection":{"problem":"সংখ্যামান অনুমান করতে চাই, কিন্তু আলাদা শর্তে সম্পর্ক আলাদা।","when":"টেবিলের data এবং ছোট if–then নিয়মে ফল বোঝানো জরুরি।","avoid":"গভীর tree সহজে overfit করে; সাধারণ constant-leaf tree training target-এর সীমার বাইরে trend extrapolate করতে পারে না।","compare":"ব্যাখ্যা জরুরি হলে ছোট tree; স্থিতিশীল accuracy চাইলে forest/boosting পরীক্ষা করো।","example":"নতুন ও পুরোনো বাড়ির দামের নিয়ম আলাদা—tree সেই ভাগ শিখতে পারে।"},"usageDetail":{"text":"উদাহরণ: আয়তন, বয়স ও অবস্থান দেখে বাড়ির দাম অনুমান। এটি শেখানোর উদাহরণ, নির্দিষ্ট deployment নয়।","sources":[]},"trainingDetail":"প্রতিটি split-এ target-এর অমিল কমানোর মতো feature ও threshold বেছে নেয়।","children":[{"id":"decision-tree-regressor--structure","name":"গঠন ও হিসাব","definition":"শর্ত দিয়ে data ভাগ → leaf-এ সংখ্যামান।","children":[{"id":"decision-tree-regressor--structure--split","name":"Split","definition":"কোনো feature-এর ভিত্তিতে data ভাগ করার নিয়ম।","insight":{"fact":"আয়তন দিয়ে আগে ভাগ করলে লাভ হতে পারে, আবার অন্য dataset-এ ঘরের সংখ্যা ভালো হতে পারে। Tree নিজেই training data থেকে feature ও threshold বেছে নেয়।"},"story":{"problem":"data-কে কোন প্রশ্ন দিয়ে ভাগ করব?","idea":"একটা feature আর একটা সীমা (threshold) দিয়ে দুই ভাগ। tree নিজেই training data দেখে সবচেয়ে কাজের প্রশ্ন বাছে।"}},{"id":"decision-tree-regressor--structure--branch","name":"Branch","definition":"শর ConvNeXt V2","url":"https://arxiv.org/abs/2301.00808"}]},"trainingDetail":"Class target দিয়ে network-এর filter ও head শেখে।","children":[{"id":"cnn-classification-head--structure","name":"গঠন ও হিসাব","definition":"Image → convolutional features → pooling/readout → class scores।","children":[{"id":"cnn-classification-head--structure--convolution","name":"Convolution","definition":"একই filter বিভিন্ন স্থানে প্রয়োগ করে স্থানীয় pattern বের করা operation।","insight":{"fact":"এক filter ছবির বহু জায়গায় চলায় weight পুনর্ব্যবহার হয়। তাই ছবির width বাড়লেই সেই filter-এর parameter সংখ্যা বাড়াতে হয় না।","history":"LeCun ও সহকর্মীদের ১৯৮৯ handwritten ZIP-code recognition কাজে learned filter ও shared weight-ভিত্তিক গঠনের ব্যবহার দেখা যায়। এটি CNN-এর গুরুত্বপূর্ণ milestone।","sources":[{"title":"Handwritten ZIP codes, 1989","url":"https://henriquetmaia.github.io/pdf/papers/lecun1989.pdf"}]},"lessons":[{"k":"M11 · L03","t":"Local Pattern ও Convolution","h":"module-11-image-representation-and-vision/lecture-03-local-pattern-and-convolution.md"},{"k":"M11 · L04","t":"Feature Map","h":"module-11-image-representation-and-vision/lecture-04-feature-map.md"}],"story":{"problem":"একই নকশা (কিনারা) ছবির যেকোনো জায়গায় থাকতে পারে। প্রতি জায়গার জন্য আলাদা weight লাগালে অনেক parameter।","idea":"একটা ছোট filter ছবির উপর ঘুরিয়ে একই weight সব জায়গায় প্রয়োগ। জায়গা বদলালেও একই নকশা ধরা পড়ে।"}},{"id":"cnn-classification-head--structure--filter-kernel-cnn","name":"Filter / Kernel (CNN)","definition":"Convolution-এ ব্যবহৃত weight-এর ছোট সমষ্টি।","insight":{"fact":"Filter সাধারণত training-এ শেখে; মানুষকে সব edge detector হাতে বানাতে হয় না। ছোট filter-গুলো বহু layer জুড়ে বড় অঞ্চলের তথ্যও একত্র করতে পারে।","history":"LeCun ও সহকর্মীদের ১৯৮৯ handwritten ZIP-code recognition কাজে learned filter ও shared weight-ভিত্তিক গঠনের ব্যবহার দেখা যায়। এটি CNN-এর গুরুত্বপূর্ণ milestone।","sources":[{"title":"Handwritten ZIP codes, 1989","url":"https://henriquetmaia.github.io/pdf/papers/lecun1989.pdf"}]},"lessons":[{"k":"M11 · L03","t":"Local Pattern ও Convolution","h":"module-11-image-representation-and-vision/lecture-03-local-pattern-and-convolution.md"},{"k":"M11 · L04","t":"Feature Map","h":"module-11-image-representation-and-vision/lecture-04-feature-map.md"}],"story":{"problem":"কোন নকশা খুঁজব, তা-ও তো শিখতে হবে।","idea":"convolution-এ ব্যবহৃত weight-এর ছোট সমষ্টি (যেমন ৩×৩)। training-এ filter-এর মানই শেখা হয়। SVM-এর kernel থেকে এটা আলাদা জিনিস।"}},{"id":"cnn-classification-head--structure--pooling","name":"Pooling","definition":"একটি অঞ্চলের মানগুলো থেকে সংক্ষিপ্ত মান তৈরি; যেমন সর্বোচ্চ বা গড় মান।","insight":{"fact":"Max pooling শক্তিশালী মান রাখে, average pooling গড় রাখে। এতে আকার ছোট হয়, কিন্তু কিছু সূক্ষ্ম অবস্থানের তথ্যও হারায়।"},"story":{"problem":"feature map বড়; আর নকশা সামান্য সরলেও একই বস্তু।","idea":"একটা ছোট অঞ্চলের মান থেকে একটা সংক্ষিপ্ত মান (সর্বোচ্চ বা গড়)। আকার কমে, সামান্য সরে যাওয়ায় প্রভাব কমে।"}},{"id":"cnn-classification-head--structure--task-head","name":"Task Head","definition":"নির্দিষ্ট কাজের output তৈরির শেষ অংশ; এক বা একাধিক layer হতে পারে।","insight":{"fact":"এক model-এ একাধিক head থাকতে পারে: একটি object-এর শ্রেণি বলে, অন্যটি তার অবস্থান। Head-এর সংখ্যা আর attention head-এর সংখ্যা একই ধারণা নয়।"},"lessons":[{"k":"M09 · L10","t":"একাধিক Output: এক score, নাকি কয়েকটা Head?","h":"module-09-model-architecture/lecture-10-multiple-outputs-and-heads.md"}],"story":{"problem":"একই network দিয়ে সংখ্যা, দল, বা লেখা, নানা কাজ করাতে চাই।","idea":"শেষে কাজ অনুযায়ী একটা ছোট অংশ (head): সংখ্যার জন্য সরল unit, দলের জন্য softmax, ইত্যাদি। body একই থাকতে পারে, head বদলায়।"}}]}],"story":{"problem":"ছবি দেখে বলতে হবে এটা কোন দল।","idea":"convolution দিয়ে ছবির কিনারা-আকৃতি বের করো, pooling দিয়ে সংক্ষেপ করো, শেষে head থেকে প্রতি দলের score।"}},{"id":"transformer-classification-head","name":"Transformer + Classification Head","definition":"Token বা patch → Attention ও FFN → representation → class scores।","insight":{"fact":"বিভিন্ন অবস্থানের তথ্য A ":"দুই দলের দূরত্ব কীভাবে মাপব","id":"linkage"}]}}],"story":{"problem":"হাতে হাজার হাজার data, কিন্তু কেউ বলে দেয়নি কোনটা কোন দল। তবু এদের মধ্যে স্বাভাবিক দল থাকতে পারে (যেমন গ্রাহকের ধরন)।","idea":"কাছাকাছি জিনিসগুলোকে এক দলে ফেলা। 'কাছে' মাপার নিয়ম আর দলের আকার ভেদে আলাদা পদ্ধতি।","next":[{"label":"K-Means","why":"সবচেয়ে সরল clustering","id":"model--k-means"}]},"choose":[{"label":"K-Means","when":"দলের সংখ্যা মোটামুটি জানি, দল গোল","why":"সরল ও দ্রুত","id":"model--k-means"},{"label":"DBSCAN — ঘনত্বভিত্তিক","when":"দলের সংখ্যা জানি না, দলের আকার বাঁকা, noise আছে","why":"ঘন জায়গা দেখে দল বানায়","id":"dbscan"},{"label":"Agglomerative Clustering — দল জোড়া লাগানো","when":"দলের ভেতরে দল (ধাপে ধাপে ভাগ) দেখতে চাই","why":"ছোট থেকে বড় দলে জোড়া লাগায়","id":"agglomerative-clustering"}]},{"id":"generation","name":"Generation","definition":"শেখা pattern অনুযায়ী নতুন লেখা, ছবি বা অন্য content তৈরি করা।","insight":{"fact":"নতুন লেখা তৈরি করতে পারা আর তথ্য সত্য হওয়া এক জিনিস নয়। Training-এর pattern থেকে বিশ্বাসযোগ্য কিন্তু ভুল output-ও তৈরি হতে পারে।"},"seq":"৪","children":[{"id":"autoregressive-transformer","name":"Autoregressive Transformer","definition":"আগের tokens → masked attention + FFN → পরের token; বারবার চালিয়ে লেখা।","insight":{"fact":"একই token-classification ধাপ পুনরাবৃত্তি করে sequence তৈরি হয়। সব Transformer autoregressive নয়।"},"selection":{"problem":"আগের context অনুসারে নতুন text/token sequence তৈরি করতে চাই।","when":"Text generation, translation বা instruction-following; উপযুক্ত pretrained model আছে।","avoid":"শুধু category বা সংখ্যা দরকার হলে generation অপ্রয়োজনীয় হতে পারে। তৈরি text সত্যতার নিশ্চয়তা নয়।","compare":"Classification head-এর একবারের prediction বনাম বারবার next-token generation আলাদা।","example":"প্রশ্ন থেকে খসড়া উত্তর তৈরি; শুধু spam চেনার জন্য ছোট classifier দিয়েও শুরু করা যায়।"},"usageDetail":{"text":"Gemma 3 (২০২৫) language generation-এর নির্দিষ্ট উদাহরণ।","sources":[{"title":"Gemma 3","url":"https://arxiv.org/abs/2503.19786"}]},"trainingDetail":"একটি প্রচলিত objective হলো আগের tokens দেখে পরের token শেখা; training ও generation-এর ধাপের ব্যবস্থাপনা আলাদা।","children":[{"id":"autoregressive-transformer--structure","name":"গঠন ও হিসাব","definition":"আগের tokens → masked attention + FFN → পরের token; বারবার চালিয়ে লেখা।","children":[{"id":"autoregressive-transformer--structure--embedding","name":"Embedding","definition":"Token বা অন্য item-এর সংখ্যার vector representation; embedding layer সাধারণত শেখা table থেকে vector নেয়।","insight":{"fact":"Token ID-এর সংখ্যা বড় হলেই অর্থ বড় হয় না। Embedding সেই ID-কে শেখা vector-এ বদলায়, যেখানে সম্পর্ক প্রকাশ করা সম্ভব।","history":"Mikolov ও সহকর্মীদের ২০১৩ word-vector গবেষণা দ্রুত word representation শেখানোর গুরুত্বপূর্ণ milestone। Embedding ধারণা তার আগে থেকেও ছিল।","sources":[{"title":"Word representations, 2013","url":"https://arxiv.org/abs/1301.3781"}]},"lessons":[{"k":"M12 · L01","t":"Token ও Tokenizer: লেখাকে সংখ্যায় ভাঙা","h":"module-12-text-sequences-and-multimodal-models/lecture-01-token-and-tokenizer.md"},{"k":"M12 · L02","t":"Embedding: Token id থেকে Vector","h":"module-12-text-sequences-and-multimodal-models/lecture-02-embedding.md"}],"story":{"problem":"token-এর id একটা ঠিকানা মাত্র, তার সংখ্যাগত 'অর্থ' নেই (id ১৩ মানে ১১-এর চেয়ে বেশি কিছু নয়)।","idea":"প্রতিটা token-এর জন্য একটা শেখা সংখ্যার vector, একটা table থেকে সারি তুলে আনা। training-এ কাছাকাছি কাজের token কাছাকাছি vector পায়।","next":[{"label":"Token","why":"embedding-এর আগে লেখা ভাঙা","id":"token"}]}},{"id":"autoregressive-transformer--structure--attention-mask","name":"Attention Mask","definition":"কোন অবস্থানের তথ্য ব্যবহার করা যাবে, তা সীমিত করার নিয়ম; যেমন ভবিষ্যতের token আড়াল করা।","insight":{"fact":"আগের token দিয়ে পরের token শেখানোর সময় ভবিষ্যৎ উত্তর দেখা চলবে না। Causal mask তাই ভবিষ্যৎ অবস্থান আড়াল করে।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"training-এ পুরো বাক্য একসঙ্গে দেখানো হলে model পরের শব্দ দেখে নিয়ে উত্তর দিয়ে ফেলবে, অথচ আসলে ওটা তার অজানা থাকার কথা।","idea":"mask দিয়ে প্রতিটা অবস্থানকে শুধু নিজের আগের অংশ দেখতে দেওয়া হয়। এতে training আর generation-এর পরিস্থিতি মেলে।"}},{"id":"autoregressive-transformer--structure--self-attention","name":"Self-attention","definition":"একই sequence থেকে query, key ও value নিয়ে তার অংশগুলোর মধ্যে তথ্য মেশানো।","insight":{"fact":"একই token থেকে Q, K, V বের হলেও আলাদা projection ব্যবহৃত হয়। তাই একই source মানে তিনটি vector হুবহু একই নয়।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"একটা বাক্যে একটা শব্দের অর্থ ঠিক হয় বাকি শব্দ দেখে।","idea":"একই sequence থেকে query, key, value নিয়ে প্রতিটা অংশ বাকিগুলোর দিকে তাকায় ও তথ্য মেশায়।"}},{"id":"autoregressive-transformer--structure--transformer-ffn","name":"Transformer FFN","definition":"প্রতিটি token-এর representation আলাদাভাবে প্রক্রিয়া করা ছোট network; একই weights সব অবস্থানে ব্যবহৃত হয়।","insight":{"fact":"Attention বিভিন্ন অবস্থানের তথ্য মেশায়, FFN প্রতিটি অবস্থানে আলাদাভাবে চলে। একই FFN weights সব অবস্থানে ব্যবহৃত হলেও input আলাদা বলে ফল আলাদা হয়।","history":"২০১৭ সালের মূল Transformer-এ Attention-এর পাশে position-wise feed-forward অংশ ছিল। Attention দিয়ে পাওয়া তথ্যকে প্রতিটি অবস্থানে আরও রূপান্তর করা হয়।","sources":[{"title":"Transformer, 2017","url":"https://arxiv.org/abs/1706.03762"}]},"lessons":[{"k":"M12 · L06","t":"Transformer Block: Attention-এর সঙ্গে বাকি অংশ","h":"module-12-text-sequences-and-multimodal-models/lecture-06-transformer-block.md"}],"story":{"problem":"attention তথ্য মেশায়, কিন্তু মেশানো তথ্য নিয়ে 'ভাবার' জায়গা কোথায়?","idea":"প্রতিটা token-এর representation আলাদাভাবে একটা ছোট network দিয়ে চালানো; একই weights সব অবস্থানে।"}},{"id":"autoregressive-transformer--structure--logits","name":"Logits","definition":"Probability-তে রূপান্তরের আগের raw score; এগুলো input-নির্ভর ফল, pa ory":{"problem":"input আর weight-এর সংখ্যা না মিললে গুণই হয় না।","idea":"input-এ যতগুলো feature, weight-ও ততগুলো। আকার না মিললে হিসাব চালানোই যায় না, আর code ভাঙে।"}},{"id":"batch-matrix","name":"Batch Matrix","definition":"অনেক example-এর prediction একসঙ্গে হিসাব করা।","mathDetail":{"formula":"ŷ=Xw+b·1","meaning":"X: N×d matrix; w: d×1; ŷ: N×1; 1: Nটি একের vector।","example":"X=[[2,1],[1,0]],w=[1,3],b=1 → ŷ=[6,2]।"},"story":{"problem":"একটা একটা করে উদাহরণ হিসাব করলে অনেক সময় লাগে।","idea":"অনেক উদাহরণ একটা matrix-এ সাজিয়ে একসঙ্গে হিসাব করা। একই কাজ, কিন্তু অনেক দ্রুত।"}},{"id":"feature-scaling","name":"Feature Scaling","definition":"Feature-এর scale বদলে তুলনাযোগ্য range-এ আনা।","insight":{"fact":"Training data থেকেই mean/scale শেখাতে হয়; test data দিয়ে preprocessing fit করলে leakage হয়। Scaling gradient descent-কে সাহায্য করতে পারে।"},"story":{"problem":"আয়তন ১০০০, ঘর ৩। বড় সংখ্যার feature অযথা বেশি প্রভাব ফেলে, আর শেখাও এলোমেলো হয়।","idea":"সব feature-কে তুলনাযোগ্য সীমায় আনা (যেমন গড় বাদ দিয়ে ভাগ)। training-এর গড় ও মাপ দিয়েই test ও নতুন input scale করতে হয়, নইলে test-এর তথ্য training-এ ঢুকে পড়ে।"}}],"story":{"problem":"একটা feature দিয়ে দাম বলা সহজ। কিন্তু আয়তন, ঘর, বয়স সবই লাগে। এদের একসঙ্গে একটা হিসাবে আনব কীভাবে?","idea":"প্রতিটা feature-এর সঙ্গে নিজের weight গুণ করে সব যোগ: একেই dot product বলে। এক লাইনে সব feature-এর প্রভাব মেলানো যায়।"}}],"story":{"problem":"শেখার আগে জানতে হবে model এখন কী বলছে।","idea":"input থেকে prediction পর্যন্ত একমুখী হিসাব: input × weight, যোগ, bias। এখানে weight বদলায় না। এই ফলকেই পরে সঠিক উত্তরের সঙ্গে মেলানো হয়।","next":[{"label":"Squared-error Loss","why":"পাওয়া prediction কতটা ভুল","id":"squared-error-loss"}]}},{"id":"squared-error-loss","name":"Squared-error Loss","definition":"Prediction কতটা ভুল, তা training-এর সংখ্যা হিসেবে মাপা।","mathDetail":{"formula":"L = (1/2)(ŷ − y)²","meaning":"L: একটি example-এর half-squared error। 1/2 gradient সহজ করে; এটি plain MSE-এর scaling থেকে আলাদা।","example":"ŷ=2, y=4 রায় ঋণাত্মক-ধনাত্মক কাটাকাটি হয় না, আর বড় ভুল অনেক বেশি শাস্তি পায়।","next":[{"label":"Gradient","why":"এই ভুল কমাতে কোন দিকে সরব","id":"training--gradient"}]}},{"id":"regression-target--linear-regression--gradient","name":"Gradient","definition":"কোন parameter বদলালে loss কোন দিকে বদলাবে তা বের করা।","mathDetail":{"formula":"∂L/∂w = (ŷ−y)x;  ∂L/∂b = ŷ−y","meaning":"∂ হলো partial derivative: অন্য parameter স্থির রেখে একটির প্রভাব।","example":"error=−2, x=2 → weight gradient=−4; bias gradient=−2।"},"children":[{"id":"chain-rule","name":"Chain Rule","definition":"Weight → prediction → loss পথের প্রভাবগুলো গুণ করে gradient পাওয়া।","mathDetail":{"formula":"∂L/∂w = (∂L/∂ŷ)(∂ŷ/∂w)","meaning":"প্রথম অংশ prediction বদলালে loss-এর পরিবর্তন; দ্বিতীয় অংশ weight বদলালে prediction-এর পরিবর্তন।","example":"∂L/∂ŷ=−2 এবং ∂ŷ/∂w=2, তাই gradient=−4।"},"children":[{"id":"local-derivatives","name":"Local Derivatives","definition":"একটি বড় derivative-কে ছোট derivative-এ ভাগ করা।","mathDetail":{"formula":"z=wx+b; L=(1/2)(z−y)²","meaning":"z: prediction-এর মধ্যবর্তী নাম।","example":"∂L/∂z=z−y, ∂z/∂w=x, ∂z/∂b=1। তাই ∂L/∂w=(z−y)x।"},"story":{"problem":"বড় হিসাবের একটা derivative একবারে বের করা কঠিন।","idea":"বড় derivative-কে ধাপের ছোট ছোট derivative-এ ভাগ করা: প্রতিটা ধাপের নিজের প্রভাব সহজ। পরে গুণ করে জোড়া লাগে।"}},{"id":"computational-graph","name":"Computational Graph","definition":"প্রতিটি operation ও তার dependency-র graph।","insight":{"fact":"Forward-এ মান হিসাব হয়; backward-এ স্থানীয় derivatives দিয়ে প্রভাব ফেরে। একটি parameter একাধিক পথে ব্যবহৃত হলে contributions যোগ হয়।"},"story":{"problem":"কোন হিসাব কোনটার উপর নির্ভর করে তা মাথায় রাখা কঠিন।","idea":"প্রতিটা operation ও তাদের নির্ভরতা একটা graph-এ আঁকা। এই graph ধরে পেছনে হেঁটে gradient বের হয় (backpropagation)।"}}],"lessons":[{"k":"M10 · L03","t":"Chain Rule: পরপর ধাপের Derivative জোড়া লাগানো","h":"module-10-neural-network-training/lecture-03-chain-rule.md"},{"k":"M10 · L04","t":"Backpropagation: ছোট Network-এ পুরো Backward Pass","h":"module-10-neural-network-training/lecture-04-backpropagation.md"}],"story":{"problem":"weight সরাসরি loss-এ যায় না: weight → prediction → loss। দুই ধাপের প্রভাব কীভাবে মেলাব?","idea":"প্রতিটা ধাপের প্রভাব (local derivative) গুণ করলেই শুরু থেকে শেষের প্রভাব পাওয়া যায়। এটাই chain rule।","next":[{"label":"Chain Rule → Backpropagation","why":"অনেক layer-এর network-এ","id":"chain-rule-backpropagation"}]}}],"lessons":[{"k":"M10 · L02","t":"Derivative থেকে Gradient","h":"module-10-neural-network-training/lecture-02-derivative-to-gradient.md"},{"k":"M04 · L04","t":"Derivative ও Gradient: হাতে-কলমে অনুশীলন","h":"module-04-math-foundations-practice/lecture-04-derivative-and-gradient-practice.md"}],"story":{"problem":"ভুল (loss) কমাতে হলে প্রতিটা weight কোন দিকে সরাতে হবে? একটা একটা করে ঠেলে দেখলে কোটি weight-এর model-এ অসম্ভব।","idea":"gradient হলো সব weight-এর জন্য 'কোন দিকে সরলে loss কমে আর কতটা জোরে' একসঙ্গে বলে দেওয়া তালিকা। chain rule আর backpropagation একবার পেছনে হেঁটেই সবগুলো বের করে দেয়।","next":[{"label":"Gradient Descent","why":"দিক জানলাম, এবার কতটা সরব?","id":"gradient-descent"}]}},{"id":"gradient-descent-update","name":"Gradient Descent Update","definition":"Loss কমানোর দিকে parameters এক ধাপ সরানো।","mathDetail":{"formula":"w_new=w−η∂L/∂w; b_new=b−η∂L/∂b","meaning":"η: learning rate; দুটো gradient একই পুরোনো parameters থেকে হিসাব করা।","example":"η=0.1 → w_new=1.4, b_new=0.2। নতুন ŷ=3, নতুন L=0.5। এই ধাপে loss 2 থেকে 0.5 হয়েছে।"},"children":[{"id":"batch-gradient","name":"Batch Gradient","definition":"সব example-এর contribution গড় করে weight update-এর দিক পাওয়া।","mathDetail":{"formula":"∇wL=(1/N)Xᵀ(Xw+b·1−y)","meaning":"এটি mean half-squared error-এর gradient।","example":"x=[1,2],w=1,b=0,y=[2,4] → errors=[−1,−2]; weight gradient=−2.5,bias gradient=−1.5।"},"story":{"problem":"একটা উদাহরণের gradient এলোমেলো হতে পারে।","idea":"সব উদাহরণের gradient-এর গড় নিলে update-এর দিক স্থির হয়।"}},{"id":"learning-rate-stability","name":"Learning-rate Stability","definition":"সঠিক gradient পেলেও step অতিরিক্ত বড় হলে loss বাড়তে পারে।","insight":{"fact":"ছোট linear model-এ convex objective থাকলেও learning rate-এর শর্ত মানতে হয়; সব neural loss convex নয়।"},"story":{"problem":"gradient ঠিক থাকলেও ধাপ অতিরিক্ত বড় হলে লাফিয়ে ভালো জায়গা পার হয়ে যায়।","idea":"ধাপ (learning rate) এমন রাখা, যাতে loss নামে, বাড়ে না। loss বাড়তে থাকলে ধাপ ছোট করার সংকেত।"}},{"id":"convergence-check","name":"Convergence Check","definition":"Loss, gradient বা parameter পরিবর্তন যথেষ্ট স্থির হলে থামার শর্ত।","insight":{"fact":"Training loss কমার পাশাপাশি validation ফলও দেখো; numerical convergence এবং generalization আলাদা।"},"story":{"problem":"কখন শেখা থামাব? অনন্তকাল চালানো যায় না।","idea":"loss, gradient বা parameter-এর পরিবর্তন যথেষ্ট ছোট হলে থামো। এটাই থামার শর্ত।"}}],"lessons":[{"k":"M02 · L03","t":"Gradient Descent: Weight ও Bias শেখা","h":"module-02-linear-regression/lecture-03-gradient-descent-training.md"},{"k":"M10 · L05","t":"Optimizer ও Learning Rate","h":"module-10-neural-network-training/lecture-05-optimizer-and-learning-rate.md"}],"story":{"problem":"gradient দিক বলল। এবার সত্যিই weight সরাতে হবে।","idea":"পুরোনো মান − learning rate × gradient। loss কমার দিকে ছোট এক ধাপ। এটা বারবার করলে model শেখে।","next":[{"label":"Learning Rate","why":"ধাপের আকার কীভাবে ঠিক হয়","id":"learning-rate"}]}}],"selection":{"problem":"দেওয়া feature থেকে একটি সংখ্যামান অনুমান করতে চাই।","when":"সরল ও ব্যাখ্যাযোগ্য baseline দরকার; feature ও target-এর সম্পর্ক মোটামুটি additive/linear হতে পারে।","avoid":"জটিল interaction সরাসরি ধরবে না; ভবিষ্যতের ভিন্ন পরিবেশে extrapolation নির্ভরযোগ্য ধরে নিও না।","compare":"একই validation data-তে Tree Regressor বা Tree Ensemble-এর সঙ্গে error ও inference খরচ তুলনা করো।","example":"আয়তন ও ঘরের সংখ্যা → বাড়ির দাম। আগে Linear Regression, তারপর বেশি জটিল model সত্যিই error কমায় কি না দেখো।"},"trainingDetail":"Prediction-এর সঙ্গে target-এর অমিল, যেমন squared error, কমিয়ে coefficients শেখে।","usageDetail":{"text":"সময়ভিত্তিক forecasting baseline; ২০২৫ সালের Linear Regression as a Litmus Test গবেষণায় benchmark যাচাই।","sources":[{"title":"Forecasting study, 2025","url":"https://openreview.net/pdf?id=wfyc8vLcq0"}]},"insight":{"fact":"Input থেকে output-এর সরাসরি linear সম্পর্ক; hidden layer বা tree split নেই।"},"lessons":[{"k":"M02 · L01","t":"Linear Regression: Prediction, Weight ও Bias","h":"module-02-linear-regression/lecture-01-prediction-weight-and-bias.md"},{"k":"M02 · L03","t":"Gradient Descent: Weight ও Bias শেখা","h":"module-02-linear-regression/lecture-03-gradient-descent-training.md"}],"story":{"problem":"একটা সংখ্যা আগে থেকে বলতে চাই। যেমন বাড়ির আয়তন জানলে দাম কত হতে পারে। হাতে আছে আগের কিছু বাড়ির আয়তন আর দাম।","idea":"আগের উদাহরণগুলোর মাঝ দিয়ে একটা সোজা রেখা টানো। নতুন বাড়ির দাম ওই রেখা থেকে পড়ে নাও। রেখাটা দুটো সংখ্যায় ঠিক হয়: weight (আয়তন বাড়লে দাম কতটা বাড়ে) আর bias (শুরুর মান)। সেরা রেখা মানে সবচেয়ে কম ভুল।","next":[{"label":"Logistic Regression","why":"উত্তর সংখ্যা না হয়ে হ্যাঁ/না হলে","id":"model--logistic-regression"},{"label":"Decision Tree","why":"সম্পর্ক সোজা রেখায় ধরা না গেলে","id":"decision-tree"},{"label":"Neural Network","why":"খুব জটিল সম্পর্ক, বা ছবি/লেখা input হলে","id":"neural-network"}]},"choose":[{"label":"Linear Regression","when":"প্রথমবার একটা কাজ শুরু করছি","why":"আগে এটা দিয়ে মাপকাঠি বানাও","id":"model--linear-regression"},{"label":"Linear Regression","when":"সম্পর্ক মোটামুটি সোজা আর কারণ বোঝাতে হবে","why":"weight দেখে বলা যায় কোনটা কতটা প্রভাব ফেলে","id":"model--linear-regression"},{"label":"Tree Ensemble","when":"সম্পর্ক বাঁকা বা শর্তের মতো (আয়তন ১০০০-এর বেশি হলে এক রকম)","why":"শর্ত আর বাঁক নিজে ধরে","id":"tree-ensemble"},{"label":"Neural Network","when":"ছবি বা লেখা থেকে সংখ্যা","why":"নিজে feature বানায়","id":"neural-network"}],"history":[{"y":"১৮০৫–০৬ (সূত্রভেদে সাল আলাদা)","t":"Legendre ধূমকেতুর কক্ষপথ নিয়ে একটা বইয়ের পরিশিষ্টে least squares (ভুলের বর্গের যোগফল কমানোর পদ্ধতি) প্রথম প্রকাশ করেন। MacTutor বলছে ১৮০৬; অন্য সূত্রে ১৮০৫, তাই একটা সাল ধরে লিখলাম না।","s":"MacTutor: Legendre","u":"https://mathshistory.st-andrews.ac.uk/Biographies/Legendre/"},{"y":"১৮০৯","t":"Gauss নিজের সংস্করণ প্রকাশ করেন। Legendre-এর বইয়ে এটা আগে ছাপা হয়েছে মেনে নিয়েও তিনি আগে থেকে ব্যবহারের দাবি জানান।","s":"MacTutor: Legendre","u":"https://mathshistory.st-andrews.ac.uk/Biographies/Legendre/"},{"y":"১৮৮৬","t":"Francis Galton বাবা-মা আর সন্তানের উচ্চতা নিয়ে লেখেন: লম্বা বাবা-মায়ের সন্তান গড়ে কিছুটা কম লম্বা হয়। ঘটনাটার নাম দেন 'regression towards mediocrity' (Journal of the Anthropological Institute, খণ্ড ১৫, পৃ. ২৪৬–২৬৩)।","s":"Galton, 1886 (York)","u":"https://www.york.ac.uk/depts/maths/histstat/galton_reg.htm"}]},{"id":"regression-target--decision-tree-regressor","name":"Decision Tree Regressor","ref":"decision-tree-regressor","children":[{"id":"split-target","name":"Split বাছা — target-এর ছড়ানো কমানো","definition":"প্রতিটা ধাপে সব feature ও threshold পরীক্ষা করে এমন ভাগ নেয়, যাতে দুই ভাগের ভেতরে target-এর ছড়ানো (squared error) সবচেয়ে কম হয়।","insight":{"fact":"এখানে gradient নেই। প্রতিটা ধাপে সেই মুহূর্তের সেরা ভাগটাই নেওয়া হয় (greedy); পুরো গাছের সেরা গঠন খোঁজা হয় না।"},"story":{"problem":"কোন প্রশ্ন দিয়ে ভাগ করলে সবচেয়ে ভালো হবে?","idea":"সব সম্ভাব্য প্রশ্ন চেষ্টা করে দেখা, যেটা ভাগের পর target-এর ছড়ানো সবচেয়ে বেশি কমায় সেটা বাছা।"}},{"id":"leaf","name":"Leaf-এর মান — গড়","definition":"Leaf-এ পড়া training উদাহরণগুলোর target-এর গড়ই ওই leaf-এর prediction।","insight":{"fact":"Squared error কমানোর লক্ষ্য ধরলে একটা ভাগের জন্য গড়ই সবচেয়ে কম error দেয়।"},"story":{"problem":"শেষ দলে উত্তরটা কী হবে?","idea":"leaf-এ পড়া training উদাহরণগুলোর target-এর গড়। এটা squared error-কে কমায়।"}},{"id":"pruning","name":"গাছ থামানো ও ছাঁটা (Pruning)","definition":"গভীরতা বা leaf-এর ন্যূনতম আকার সীমা দিয়ে গাছ বাড়া থামানো, বা বড় গাছ থেকে কম কাজের শাখা ছেঁটে ফেলা।","insight":{"fact":"সীমা না দিলে গাছ প্রতিটা training উদাহরণের জন্য আলাদা leaf বানিয়ে training data মুখস্থ করে ফেলতে পারে (overfitting)।"},"story":{"problem":"পুরো গাছ বাড়তে দিলে প্রতিটা উদাহরণ আলাদা leaf-এ চলে যায়, মানে মুখস্থ।","idea":"গভীরতা বা ন্যূনতম নমুনা সীমায় থামানো, অথবা বড় গাছ বানিয়ে অকাজের ডালপালা ছাঁটা। validation দিয়ে সীমা ঠিক করা হয়।"}}],"definition":"শর্ত দিয়ে data ভাগ → leaf-এ সংখ্যামান।","selection":{"problem":"সংখ্যামান অনুমান করতে চাই, কিন্তু আলাদা শর্তে সম্পর্ক আলাদা।","when":"টেবিলের data এবং ছোট if–then নিয়মে ফল বোঝানো জরুরি।","avoid":"গভীর tree সহজে overfit করে; সাধারণ constant-leaf tree training target-এর সীমার বাইরে trend extrapolate করতে পারে না।","compare":"ব্যাখ্যা জরুরি হলে ছোট tree; স্থিতিশীল accuracy চাইলে forest/boosting পরীক্ষা করো।","example":"নতুন ও পুরোনো বাড়ির দামের নিয়ম আলাদা—tree সেই ভাগ শিখতে পারে।"},"trainingDetail":"প্রতিটি split-এ target-এর অমিল কমানোর মতো feature ও threshold বেছে নেয়।","usageDetail":{"text":"উদাহরণ: আয়তন, বয়স ও অবস্থান দেখে বাড়ির দাম অনুমান। এটি শেখানোর উদাহরণ, নির্দিষ্ট deployment নয়।","sources":[]},"insight":{"fact":"Classification tree-এর মতো গঠন; এখানে leaf শ্রেণি নয়, সংখ্যা দেয়।"},"story":{"problem":"সংখ্যা অনুমান করতে সোজা রেখা যথেষ্ট না হলে?","idea":"শর্ত দিয়ে data ভাগ করতে করতে ছোট দলে নামা; প্রতিটা শেষ দলের (leaf) গড়ই উত্তর।","next":[{"label":"Tree Ensemble Regressor","why":"একটা গাছ মুখস্থ করে ফেললে","id":"regression-target--tree-ensemble-regressor"}]}},{"id":"regression-target--tree-ensemble-regressor","name":"Tree Ensemble Regressor","ref":"tree-ensemble-regressor","children":[{"id":"bagging-random-forest","name":"Bagging / Random Forest","definition":"প্রতিটা tree আলাদা আলাদা random নমুনায় (এবং প্রায়ই random feature-এর অংশে) স্বাধীনভাবে শেখে; ফল গড় হয়।","insight":{"fact":"Tree-গুলো একে অপরের উপর নির্ভর করে না, তাই আলাদা আলাদা শেখানো যায়।"},"story":{"problem":"একটা গাছ একটু data বদলালেই অনেক বদলে যায় (high variance)।","idea":"data-র নানা নমুনা থেকে অনেক গাছ বানিয়ে গড় বা ভোট, সঙ্গে প্রতি ভাগে feature-ও এলোমেলো করা। ভুলগুলো কাটাকাটি হয়ে ফল স্থির।","next":[{"label":"Boosting","why":"বিকল্প পথ","id":"boosting"}]}},{"id":"boosting","name":"Boosting","definition":"Tree একটার পর একটা শেখে; প্রতিটা নতুন tree আগের মিলিত prediction-এর ভুল কমাতে চেষ্টা করে।","insight":{"fact":"Gradient boosting-এ 'gradient' বলতে loss কোন দিকে কমে তা বোঝায়, আর সেটা নতুন একটা tree দিয়ে আন্দাজ করা হয়। Neural network-এর মতো parameter সরাসরি বদলানো হয় না।"},"story":{"problem":"কিছু উদাহরণ প্রতিবার ভুল হয়। সবাইকে একই গুরুত্বে দেখলে তাদের ঠিক হয় না।","idea":"একটা model-এর পর পরেরটা শেখে আগের ভুল সংশোধনের জন্য। সবাই মিলে একসঙ্গে কম ভুল করে।"}}],"definition":"একাধিক regression tree → ফল একত্র → সংখ্যামান।","selection":{"problem":"একটি tree-এর অস্থিরতা বা সীমিত accuracy কমিয়ে tabular prediction চাই।","when":"অনেক feature-এর interaction আছে; regression বা classification-এর শক্তিশালী baseline দরকার।","avoid":"একটি ছোট tree-এর মতো সহজে ব্যাখ্যা করা যায় না; raw text/image-এ representation ছাড়া সরাসরি প্রথম পছন্দ নাও হতে পারে।","compare":"Linear model-এর তুলনায় validation উন্নতি বনাম latency, memory ও ব্যাখ্যার খরচ মাপো।","example":"বাড়ির দাম: আয়তন, বয়স, এলাকা একসঙ্গে কাজ করছে—forest বা boosting পরীক্ষা করো।"},"trainingDetail":"পদ্ধতি অনুযায়ী ভিন্ন sample-এ tree শেখে বা আগের prediction-এর ভুল কমায়।","usageDetail":{"text":"NASA-র ২০২৫ GEDI meeting প্রতিবেদনে random forest দিয়ে বনভূমির canopy profile অনুমান।","sources":[{"title":"NASA GEDI, 2025","url":"https://science.nasa.gov/science-research/earth-science/summary-of-the-2025-gedi-science-team-meeting/"}]},"insight":{"fact":"একটি tree-এর বদলে অনেক tree। Random forest সাধারণত গড় করে; boosting ধারাবাহিক সংশোধন যোগ করে।"},"story":{"problem":"একটা regression tree training data মুখস্থ করে নতুন data-য় ভুল করে।","idea":"অনেক tree মিলিয়ে ফল গড় করা (বা একটার পর একটা ভুল ঠিক করা)। এতে ফল স্থির ও ভালো হয়।"}},{"id":"k-nn-regressor","name":"k-NN Regressor","definition":"কাছের k-টা training উদাহরণের target-এর গড় (বা দূরত্ব অনুযায়ী ভারযুক্ত গড়) prediction হয়।","trainingDetail":"কোনো parameter শেখে না; training data সংরক্ষণই 'শেখা'। k আর দূরত্বের নিয়ম আগে :"neural-network-regression-head","children":[{"id":"regression-target--neural-network-regression-head--forward-pass","name":"Forward Pass","ref":"forward-pass","definition":"Input থেকে prediction তৈরি; এখানে parameters বদলায় না।","mathDetail":{"formula":"ŷ = wx + b","meaning":"x: input; w: weight; b: bias; ŷ: prediction; y: সঠিক target।","example":"x=2, w=1, b=0 হলে ŷ=2। সঠিক target y=4।"},"story":{"problem":"শেখার আগে জানতে হবে model এখন কী বলছে।","idea":"input থেকে prediction পর্যন্ত একমুখী হিসাব: input × weight, যোগ, bias। এখানে weight বদলায় না। এই ফলকেই পরে সঠিক উত্তরের সঙ্গে মেলানো হয়।","next":[{"label":"Squared-error Loss","why":"পাওয়া prediction কতটা ভুল","id":"squared-error-loss"}]}},{"id":"regression-target--neural-network-regression-head--squared-error-loss","name":"Squared-error Loss","ref":"squared-error-loss","definition":"Prediction কতটা ভুল, তা training-এর সংখ্যা হিসেবে মাপা।","mathDetail":{"formula":"L = (1/2)(ŷ − y)²","meaning":"L: একটি example-এর half-squared error। 1/2 gradient সহজ করে; এটি plain MSE-এর scaling থেকে আলাদা।","example":"ŷ=2, y=4 → error=−2 → L=2। একাধিক example হলে loss-এর গড় নেওয়া যায়।"},"lessons":[{"k":"M02 · L02","t":"ভুল মাপা: Error ও Mean Squared Error","h":"module-02-linear-regression/lecture-02-error-and-mean-squared-error.md"}],"story":{"problem":"prediction ভুল, কিন্তু কতটা ভুল? একটা সংখ্যা চাই, যা ছোট হলে ভালো।","idea":"আসল আর অনুমানের ফারাকের বর্গ। বর্গ করায় ঋণাত্মক-ধনাত্মক কাটাকাটি হয় না, আর বড় ভুল অনেক বেশি শাস্তি পায়।","next":[{"label":"Gradient","why":"এই ভুল কমাতে কোন দিকে সরব","id":"training--gradient"}]}},{"id":"regression-target--neural-network-regression-head--chain-rule-backpropagation","name":"Chain Rule → Backpropagation","ref":"chain-rule-backpropagation","definition":"Network-এর শেষ loss থেকে আগের parameters-এর প্রভাব দক্ষভাবে হিসাব করা।","mathDetail":{"formula":"∂L/∂w=(∂L/∂z)(∂z/∂w)","meaning":"z একটি মধ্যবর্তী হিসাব; একাধিক path থাকলে তাদের contribution যোগ হয়।","example":"z=wx,L=z²,x=2,w=1 → z=2; -regression"},{"label":"Softmax Regression","when":"অনেক দল (যেমন ১০টা অক্ষর)","why":"প্রতি দলের জন্য একটা probability","id":"softmax-regression"},{"label":"Tree Ensemble","when":"table data, সীমানা বাঁকা","why":"বাঁক ধরতে পারে","id":"tree-ensemble"}],"history":[{"y":"১৯৪৪","t":"Joseph Berkson 'logit' শব্দ চালু করেন এবং logistic regression-কে সাধারণ statistical model হিসেবে গড়ে তোলায় বড় ভূমিকা রাখেন।","s":"Wikipedia: Logistic regression","u":"https://en.wikipedia.org/wiki/Logistic_regression"},{"y":"১৯৫৮","t":"D. R. Cox 'The regression analysis of binary sequences' প্রকাশ করেন (Journal of the Royal Statistical Society B, খণ্ড ২০, পৃ. ২১৫–২৪২), যা দুই-উত্তরের (binary) logistic regression নিয়ে।","s":"Wikipedia: David Cox","u":"https://en.wikipedia.org/wiki/David_Cox_(statistician)"}]},{"id":"binary-classification--decision-tree-forest-classifier","name":"Decision Tree / Forest Classifier","ref":"decision-tree-forest-classifier","children":[{"id":"impurity-gini-entropy","name":"Impurity — Gini বা Entropy","definition":"কোনো node-এ class কতটা মিশে আছে তার মাপ। ভাগ করার পর মিশ্রণ কমলে সেই ভাগ ভালো।","mathDetail":{"formula":"Gini = 1 − Σ pₖ²","meaning":"pₖ: node-এ k নম্বর class-এর অনুপাত। সব উদাহরণ একই class-এর হলে Gini = 0 (খাঁটি)।","example":"৬টা উদাহরণ: ৪টা A, ২টা B → Gini = 1 − (4/6)² − (2/6)² ≈ 0.444। ভাগ করে বাঁয়ে [৩টা A], ডানে [১টা A, ২টা B]: বাঁয়ে Gini = 0, ডানে ≈ 0.444। ওজনসহ গড় = (3/6)×0 + (3/6)×0.444 ≈ 0.222। মিশ্রণ 0.444 থেকে 0.222-এ নেমেছে, তাই ভাগটা ভালো।"},"story":{"problem":"ভাগের ফল ভালো কি না, মাপব কীভাবে?","idea":"একটা দলে কতটা মিশ্র (বিভিন্ন class) তার মাপ: সব এক class হলে ০, যত মিশ্র তত বেশি। ভাগের পর যত কমে, ভাগ তত ভালো।"}},{"id":"leaf-class-distribution","name":"Leaf-এর class distribution","definition":"Leaf-এ পড়া training উদাহরণের class-অনুপাত। সবচেয়ে বড় অনুপাতের class-ই prediction।","story":{"problem":"leaf-এ উত্তরটা কী?","idea":"leaf-এ পড়া উদাহরণে প্রতি class-এর অনুপাত; সবচেয়ে বেশিটা উত্তর, অনুপাত probability।"}},{"id":"aggregation"," াপদগুলোতে ০।"}},{"id":"binary-classification--support-vector-machine-svm--support-vectors","name":"Support Vectors","ref":"support-vectors","definition":"SVM-এর শেখা সীমানা নির্ধারণে সরাসরি ভূমিকা রাখা training উদাহরণ।","insight":{"fact":"সীমানার কাছের কিছু উদাহরণ prediction-এ বিশেষ ভূমিকা রাখে। Kernel SVM-এ এসব উদাহরণ সংরক্ষণ করতে হয়; অনেক support vector হলে inference-ও ব্যয়বহুল হয়।"},"story":{"problem":"সব training বিন্দু কি রেখার অবস্থান ঠিক করে?","idea":"শুধু margin-এর উপর বা ভেতরে থাকা বিন্দুগুলো; বাকি সরালেও রেখা বদলায় না।"}},{"id":"binary-classification--support-vector-machine-svm--kernel-svm","name":"Kernel (SVM)","ref":"kernel-svm","definition":"আলাদা feature space-এর inner product সরাসরি হিসাবের পদ্ধতি; CNN filter-এর অর্থ থেকে আলাদা।","insight":{"fact":"CNN-এর kernel হলো ছোট filter; SVM-এর kernel হলো অন্য feature space-এর inner product হিসাবের function। একই নাম, কিন্তু আলাদা গাণিতিক ভূমিকা।"},"story":{"problem":"সোজা রেখা দিয়ে আলাদা করা যায় না এমন data?","idea":"বিন্দুগুলোকে অন্য এক উঁচু মাত্রার জায়গায় তুলে সেখানে সোজা রেখা টানা, অথচ সেই জায়গা সত্যি গড়ে না নিয়ে শুধু সাদৃশ্যের হিসাব করে।"}}],"definition":"Classification-এ শ্রেণিগুলোর মধ্যে যতটা সম্ভব প্রশস্ত ফাঁক রেখে সীমানা বেছে নেয়; regression সংস্করণও আছে।","selection":{"problem":"Class-এর মধ্যে margin-ভিত্তিক boundary বা সংশ্লিষ্ট regression solution চাই।","when":"ছোট-মাঝারি dataset, অনেক feature এবং scaling/tuning করার সুযোগ আছে।","avoid":"Kernel SVM খুব বড় sample count-এ ব্যয়বহুল হতে পারে; probability output আলাদা calibration চাইতে পারে।","compare":"Text-এ linear SVM বনাম Logistic Regression; nonlinear tabular-এ tree ensemble তুলনা করো।","example":"Feature vector থেকে দুই ধরনের sample আলাদা করা।"},"profile":{"why":"শ্রেণি আলাদা করার অনেক সীমানার মধ্যে বড় margin-সহ সীমানা বেছে নেওয়া; kernel দিয়ে nonlinear সম্পর্কও ধরা যায়।","history":"Cortes ও Vapnik-এর ১৯৯৫ সালের Support-Vector Networks আধুনিক SVM-এর গুরুত্বপূর্ণ milestone; আগের কাজও রয়েছে।","uses":"অনেক feature-সহ classification, text classif
