ব করা যায় না।","idea":"data-কে batch-এ ভাগ; প্রতি batch-এ এক step; সব batch একবার দেখলে এক epoch।"}},{"id":"gradient-accumulation","name":"Gradient Accumulation","definition":"ছোট micro-batch-এর gradient জমিয়ে পরে একটি optimizer step নেওয়া।","insight":{"fact":"সমান মাপের 4 micro-batch-এর গড় gradient চাইলে সঠিক scaling দরকার। সব operation-এ এটি বড় batch-এর হুবহু সমতুল্য নয়।"},"lessons":[{"k":"M10 · L06","t":"Sample, Batch, Step ও Epoch","h":"module-10-neural-network-training/lecture-06-batch-step-and-epoch.md"},{"k":"M10 · রেফারেন্স","t":"Parameter কখন বদলায়, আর কতগুলো থাকে","h":"module-10-neural-network-training/reference-parameter-update-timing.md"}],"story":{"problem":"আমার memory-তে বড় batch ধরে না, অথচ বড় batch-এর মতো ফল চাই।","idea":"কয়েকটা ছোট batch-এর gradient জমিয়ে একসঙ্গে একবার update।"}},{"id":"zero-grad-backward-step","name":"Zero Grad → Backward → Step","definition":"পুরোনো gradient পরিষ্কার, বর্তমান loss থেকে gradient হিসাব, তারপর update—একটি সাধারণ loop।","insight":{"fact":"Backward gradient বের করে; optimizer step মান বদলায়। Accumulation করলে প্রতি micro-batch-এ zero করা হয় না।"},"story":{"problem":"code-এ প্রতি ধাপের ক্রম কী?","idea":"আগের gradient সাফ, loss থেকে gradient বের, optimizer-এর step। সাফ না করলে gradient জমে যায়।"}}],"story":{"problem":"gradient পেলাম, এখন model সত্যিই বদলাবে কীভাবে?","idea":"প্রতিটা parameter-কে gradient-এর বিপরীতে একটু সরানো। সরানোর নিয়ম optimizer ঠিক করে।"}},{"id":"training--gradient","name":"Gradient","definition":"প্রতিটি parameter বদলালে objective স্থানীয়ভাবে কোন দিকে ও কত দ্রুত বদলায়, তার হিসাব।","insight":{"fact":"Gradient loss-এর মান নয়; parameters বদলালে loss স্থানীয়ভাবে কীভাবে বদলায় তার নির্দেশ। বড় loss থাকলেও কোনো parameter-এর gradient ছোট হতে পারে।","history":"Rumelhart, Hinton ও Williams-এর ১৯৮৬ paper multilayer network-এ error backpropagation দিয়ে representation শেখানোর গুরুত্বপূর্ণ milestone। Gradient ধারণা অবশ্য calculus থেকে অনেক পুরোনো।","sources":[{"title":"Backpropagation, 1986","url":"https://doi.org/10.1038/323533a0"}]},"seq":"৭","children":[{"id":"derivative","name":"Derivative — এক মানের পরিবর্তন","definition":"w একটু বাড়লে loss কোন দিকে কত দ্রুত বদলায় তা দেখা।","mathDetail":{"formula":"L(w)=w² ⇒ dL/dw=2w","meaning":"Derivative হলো স্থানীয় পরিবর্তনের হার।","example":"w=3-এ derivative=6। এটি loss নয়; loss তখন 9।"},"lessons":[{"k":"M10 · L02","t":"Derivative থেকে Gradient","h":"module-10-neural-network-training/lecture-02-derivative-to-gradient.md"},{"k":"M04 · L04","t":"Derivative ও Gradient: হাতে-কলমে অনুশীলন","h":"module-04-math-foundations-practice/lecture-04-derivative-and-gradient-practice.md"}],"story":{"problem":"loss কমাতে হলে জানতে হবে একটা weight একটু বদলালে loss কতটা বদলায়।","idea":"একটা চলকের সামান্য পরিবর্তনে ফল কতটা বদলায়, তার হার।"}},{"id":"partial-derivative-gradient-vector","name":"Partial Derivative → Gradient Vector","definition":"বহু parameter-এর প্রভাব একসঙ্গে রাখা।","mathDetail":{"formula":"L(w,b)=w²+3b²; ∇L=[2w,6b]","meaning":"Partial derivative-এ অন্য variable স্থির; gradient সব partial-এর vector।","example":"w=2,b=1 → gradient=[4,6]।"},"lessons":[{"k":"M10 · L02","t":"Derivative থেকে Gradient","h":"module-10-neural-network-training/lecture-02-derivative-to-gradient.md"},{"k":"M04 · L04","t":"Derivative ও Gradient: হাতে-কলমে অনুশীলন","h":"module-04-math-foundations-practice/lecture-04-derivative-and-gradient-practice.md"}],"story":{"problem":"weight অনেক; প্রতিটার প্রভাব আলাদা।","idea":"প্রতিটা weight-এর আলাদা derivative সাজিয়ে gradient vector, যা সবচেয়ে বেশি বাড়ার দিক বলে।"}},{"id":"chain-rule-backpropagation","name":"Chain Rule → Backpropagation","definition":"Network-এর শেষ loss থেকে আগের parameters-এর প্রভাব দক্ষভাবে হিসাব করা।","mathDetail":{"formula":"∂L/∂w=(∂L/∂z)(∂z/∂w)","meaning":"z একটি মধ্যবর্তী হিসাব; একাধিক path থাকলে তাদের contribution যোগ হয়।","example":"z=wx,L=z²,x=2,w=1 → z=2; gradient=(2z)x=8।"},"lessons":[{"k":"M10 · L03","t":"Chain Rule: পরপর ধাপের Derivative জোড়া লাগানো","h":"module-10-neural-network- g Rate","h":"module-10-neural-network-training/lecture-05-optimizer-and-learning-rate.md"}],"story":{"problem":"সবচেয়ে সরল update কী?","idea":"weight −= learning rate × gradient। আর কিছু না।"}},{"id":"momentum-gradient","name":"Momentum — gradient-এর স্মৃতি","definition":"পরপর gradient-এর দিক মিলিয়ে oscillation কমানো ও অগ্রগতি সাহায্য করা।","mathDetail":{"formula":"vₜ=βvₜ₋₁+gₜ; θₜ₊₁=θₜ−ηvₜ","meaning":"v: জমা direction; β: আগের direction-এর গুরুত্ব। এটি momentum-এর একটি convention।","example":"v_old=1,g=2,β=0.9 → v=2.9। θ=3,η=0.1 → θ_new=2.71।"},"lessons":[{"k":"M10 · L05","t":"Optimizer ও Learning Rate","h":"module-10-neural-network-training/lecture-05-optimizer-and-learning-rate.md"}],"story":{"problem":"gradient এদিক ওদিক দোল খেলে এগোনো ধীর হয়।","idea":"আগের কয়েক ধাপের গড় দিকও মনে রাখা। দোল কমে, ধারাবাহিক দিকে গতি বাড়ে।"}},{"id":"adam-adaptive-update","name":"Adam — adaptive update","definition":"Gradient ও squared gradient-এর চলমান গড়, bias correction ও প্রতি parameter-এর scaling ব্যবহার করে।","insight":{"fact":"প্রথম ধাপে চলমান গড় শূন্য থেকে শুরু হওয়ায় correction লাগে। এটি সব task-এ SGD-এর চেয়ে ভালো—এমন নিয়ম নেই।"},"lessons":[{"k":"M10 · L05","t":"Optimizer ও Learning Rate","h":"module-10-neural-network-training/lecture-05-optimizer-and-learning-rate.md"}],"story":{"problem":"প্রতিটা parameter-এর জন্য একই learning rate ঠিক না।","idea":"gradient-এর গড় দিক (momentum) আর তার ছড়ানো দুটোই মনে রেখে প্রতিটা parameter-এর ধাপ আলাদা করে ঠিক করা।"},"history":[{"y":"২০১৪ (ডিসেম্বর)","t":"Kingma ও Ba 'Adam: A Method for Stochastic Optimization' প্রকাশ করেন (arXiv); ICLR ২০১৫-এ উপস্থাপিত।","s":"arXiv:1412.6980","u":"https://arxiv.org/abs/1412.6980"}]},{"id":"adamw-decoupled-weight-decay","name":"AdamW — decoupled weight decay","definition":"Adam update থেকে আলাদা করে weights-এর decay প্রয়োগ করে।","insight":{"fact":"Adam-এ loss-এর L2 penalty আর decoupled weight decay সাধারণভাবে একই update নয়।"},"lessons":[{"k":"M10 · L05","t":"Optimizer ও Learning Rate","h":"module-10-n ঠিক 'হ্যাঁ', TN: সঠিক 'না'।","example":"মোট ২০: TP 8, FP 2, FN 4, TN 6 হলে Accuracy = 14 ÷ 20 = 0.7।"},"why":"সবচেয়ে সরল, এক সংখ্যায় বোঝা যায়।","tradeoff":"দল অসম হলে বিভ্রান্তিকর: ৯৫% উদাহরণ 'না' হলে সবসময় 'না' বললেই ৯৫% (Module 06)।"},{"id":"opt-precision-sc","name":"Precision","definition":"যেগুলোকে 'হ্যাঁ' বলা হলো তার মধ্যে কতগুলো সত্যিই 'হ্যাঁ'।","kind":"option","when":"ভুল সতর্কতা (false alarm) বেশি ক্ষতিকর","basis":"course","mathDetail":{"formula":"Precision = TP ÷ (TP + FP)","meaning":"FP: ভুল 'হ্যাঁ'।","example":"TP 8, FP 2 হলে Precision = 8 ÷ 10 = 0.8।"},"why":"ভুল 'হ্যাঁ' কমানো জরুরি হলে সরাসরি সেটাই মাপে।","tradeoff":"ধরা-না-পড়া 'হ্যাঁ' দেখে না; threshold বাড়ালে বাড়ে, কিন্তু Recall কমে।"},{"id":"opt-recall-sc","name":"Recall","definition":"সত্যিকারের 'হ্যাঁ'-গুলোর মধ্যে কতগুলো ধরা পড়ল।","kind":"option","when":"ধরতে না পারা (miss) বেশি ক্ষতিকর","basis":"course","mathDetail":{"formula":"Recall = TP ÷ (TP + FN)","meaning":"FN: ধরা-না-পড়া 'হ্যাঁ'।","example":"TP 8, FN 4 হলে Recall = 8 ÷ 12 ≈ 0.667।"},"why":"কিছু ধরতে না পারা ক্ষতিকর হলে সেটাই মাপে।","tradeoff":"ভুল 'হ্যাঁ' বাড়তে দেয়: সবকিছুকে 'হ্যাঁ' বললে Recall ১০০%।"},{"id":"opt-f1-sc","name":"F1","definition":"Precision আর Recall-এর হারমোনিক গড়: একটা সংখ্যায় দুটোর ভারসাম্য।","kind":"option","when":"Precision ও Recall দুটোই জরুরি আর দল অসম","basis":"course","mathDetail":{"formula":"F1 = 2·P·R ÷ (P + R)","meaning":"P = Precision, R = Recall।","example":"P 0.8, R 0.667 হলে F1 ≈ 0.727।"},"why":"Precision ও Recall-এর ভারসাম্য এক সংখ্যায়।","tradeoff":"কোনটা কতটা জরুরি তা লুকিয়ে ফেলে; সঠিক 'না' (TN) গোনে না।"},{"id":"opt-cer-wer-sc","name":"CER ও WER — OCR-এর মাপ","definition":"OCR আউটপুটের লেখা আর সঠিক লেখার মধ্যে সম্পাদনা-দূরত্ব (বদল, বাদ, যোগ) সঠিক লেখার দৈর্ঘ্য দিয়ে ভাগ। CER অক্ষর ধরে, WER শব্দ ধরে।","kind":"option","when":"লেখা-পড়া (OCR, speech) কাজে","basis":"course","mathDetail":{"formula":"CER = (বদল + বাদ + যোগ) ÷ সঠিক লেখার অক্ষর-সংখ্যা","meaning":"WER-এ একই হিসাব, একক শব্দ।","example" "lessons":[{"k":"M13 · L01","t":"Training আর Fine-Tuning: শুরুর মানটাই আলাদা","h":"module-13-pretraining-finetuning-and-lora/lecture-01-training-and-finetuning.md"},{"k":"M15 · L01","t":"Pretraining-এর লক্ষ্য ও Checkpoint","h":"module-15-domain-and-task-adaptation/lecture-01-pretraining-objective-and-checkpoint.md"}],"story":{"problem":"প্রতিটা নতুন কাজের জন্য model শূন্য থেকে শেখালে অনেক data, সময় আর টাকা লাগে। অথচ ভাষার গঠন বা সাধারণ জ্ঞান প্রতিবার আবার শেখানো অপচয়।","idea":"একবার বিশাল, নানা বিষয়ের লেখায় 'পরের token অনুমান' শিখিয়ে model সংরক্ষণ করে রাখা (checkpoint)। এরপর সবাই ওই checkpoint থেকে শুরু করে।","next":[{"label":"Checkpoint","why":"শেখার ফল কী আকারে সংরক্ষিত থাকে","id":"checkpoint"},{"label":"Fine-tuning","why":"নিজের কাজের জন্য checkpoint মানিয়ে নেওয়া","id":"fine-tuning"}]},"practice":{"scenario":"বাস্তবে বেশির ভাগ মানুষ ও কোম্পানি নিজে pretraining করে না। বিশাল GPU-ক্লাস্টার, সপ্তাহ-মাস সময় আর বিশাল data লাগে। তারা কারও আগে-শেখা (প্রায়ই open-weight) model ডাউনলোড করে সেখান থেকে শুরু করে।","typical":["নিজের pretraining প্রায় শুধু বড় গবেষণা-দল বা কোম্পানি করে; ব্যক্তি বা ছোট দল সাধারণত পাওয়া checkpoint নেয়।","কোন checkpoint নেবে তা বাছাই (আকার, ভাষা, licence) নিজেই একটা সিদ্ধান্ত। বাংলা-জাতীয় কম-পাওয়া ভাষায় base model-এর ঘাটতি fine-tuning-এ পুরো পোষায় না, আগে সেটা পরীক্ষা করা ভালো।"],"pitfalls":["licence না দেখে নেওয়া: কিছু checkpoint-এর ব্যবহারে শর্ত আছে।","tokenizer বদলে ফেলা: checkpoint-এর সঙ্গে তারই tokenizer চালাতে হয়।"],"outside":"কোন checkpoint নেবে, licence আর ভাষা-সমর্থন কোর্সে নেই।"}},{"id":"fine-tuning","name":"Fine-tuning","definition":"আগে শেখানো parameters থেকে শুরু করে নতুন data বা উদ্দেশ্যের জন্য আরও training।","insight":{"fact":"Fine-tuning-ও training: একই loss, gradient আর update। পার্থক্য শুধু শুরুর মান (checkpoint) আর উদ্দেশ্য। 'কোন parameter বদলাবে' আর 'কী থেকে শিখবে' দুটো আলাদা সিদ্ধান্ত।"},"seq":"৩","children":[{"id":"wf-goal","name":"লক্ষ্য ও মাপকাঠি ঠিক করা","definition":"আগে ঠিক করা 'ভালো' মানে কী: কোন মাপে (accuracy, CER/WER, মানুষের পছন্দ), আর base model + ভালো prompt আজ কতটা পারে। এই baseline না জেনে tuning-এর লাভ মাপা যায় না।","kind":"step","seq":"১","children":[{"id":"goal-metric","name":"মাপকাঠি (metric) কী হবে?","definition":"কাজ সফল হলো কি না মাপার সংখ্যা। কাজের ধরন অনুযায়ী বাছো; একাধিকও রাখা যায়।","kind":"decision","pick":"many","children":[{"id":"opt-accuracy","name":"Accuracy","definition":"সব উদাহরণের মধ্যে কতগুলো ঠিক হয়েছে তার অনুপাত। দলগুলো প্রায় সমান হলেই অর্থপূর্ণ।","kind":"option","when":"দল প্রায় সমান ভাগের, আর সব ভুল সমান ক্ষতিকর","basis":"course","mathDetail":{"formula":"Accuracy = (TP + TN) ÷ মোট","meaning":"TP: সঠিক 'হ্যাঁ', TN: সঠিক 'না'।","example":"মোট ২০: TP 8, FP 2, FN 4, TN 6 হলে Accuracy = 14 ÷ 20 = 0.7।"},"why":"সবচেয়ে সরল, এক সংখ্যায় বোঝা যায়।","tradeoff":"দল অসম হলে বিভ্রান্তিকর: ৯৫% উদাহরণ 'না' হলে সবসময় 'না' বললেই ৯৫% (Module 06)।"},{"id":"opt-precision","name":"Precision","definition":"যেগুলোকে 'হ্যাঁ' বলা হলো তার মধ্যে কতগুলো সত্যিই 'হ্যাঁ'।","kind":"option","when":"ভুল সতর্কতা (false alarm) বেশি ক্ষতিকর","basis":"course","mathDetail":{"formula":"Precision = TP ÷ (TP + FP)","meaning":"FP: ভুল 'হ্যাঁ'।","example":"TP 8, FP 2 হলে Precision = 8 ÷ 10 = 0.8।"},"why":"ভুল 'হ্যাঁ' কমানো জরুরি হলে সরাসরি সেটাই মাপে।","tradeoff":"ধরা-না-পড়া 'হ্যাঁ' দেখে না; threshold বাড়ালে বাড়ে, কিন্তু Recall কমে।"},{"id":"opt-recall","name":"Recall","definition":"সত্যিকারের 'হ্যাঁ'-গুলোর মধ্যে কতগুলো ধরা পড়ল।","kind":"option","when":"ধরতে না পারা (miss) বেশি ক্ষতিকর","basis":"course","mathDetail":{"formula":"Recall = TP ÷ (TP + FN)","meaning":"FN: ধরা-না-পড়া 'হ্যাঁ'।","example":"TP 8, FN 4 হলে Recall = 8 ÷ 12 ≈ 0.667।"},"why":"কিছু ধরতে না পারা ক্ষতিকর হলে সেটাই মাপে।","tradeoff":"ভুল 'হ্যাঁ' বাড়তে দেয়: সবকিছুকে 'হ্যাঁ' বললে Recall ১০০%।"},{"id":"opt-f1","name":"F1","definition":"Precision আর Recall-এর হারমোনিক গড়: একটা সংখ্যায় দুটোর ভারসাম্য।","kind":"option","when":"Precision ও Recall দুটোই জরুরি আর দল অসম","basis":"course","mathDetail":{"formula":"F1 = 2·P·R ÷ (P + R)","meaning":"P = Precision, R = Recall।","example":"P 0.8, R 0.667 হলে F1 ≈ 0.727।"},"why":"Precision ও Recall-এর ভারসাম্য এক সংখ্যায়।","tradeoff":"কোনটা কতটা জরুরি তা লুকিয়ে ফেলে; সঠিক 'না' (TN) গোনে না।"},{"id":"opt-cer-wer","name":"CER ও WER — OCR-এর মাপ","definition":"OCR আউটপুটের লেখা আর সঠিক লেখার মধ্যে সম্পাদনা-দূরত্ব (বদল, বাদ, যোগ) সঠিক লেখার দৈর্ঘ্য দিয়ে ভাগ। CER অক্ষর ধরে, WER শব্দ ধরে।","kind":"option","when":"লেখা-পড়া (OCR, speech) কাজে","basis":"course","mathDetail":{"formula":"CER = (বদল + বাদ + যোগ) ÷ সঠিক লেখার অক্ষর-সংখ্যা","meaning":"WER-এ একই হিসাব, একক শব্দ।","example":"সঠিক 'বই', পড়া হলো 'বউ': ১টা বদল, সঠিক লেখায় ২টা অক্ষর, তাই CER = 1 ÷ 2 = 0.5।"},"insight":{"fact":"বাংলায় যুক্তাক্ষর একাধিক Unicode code point দিয়ে তৈরি হতে পারে, তাই 'অক্ষর' বলতে code point না grapheme ধরছ তা আগে ঠিক করা দরকার (সাধারণ অভিজ্ঞতা)।"},"children":[{"id":"tool-jiwer","name":"jiwer","definition":"WER ও CER হিসাব করার Python library।","kind":"tool","basis":"tool-doc","tool":{"repo":"https://github.com/jitsi/jiwer","license":"Apache-2.0","archived":false,"pushed":"২০২৬-০৯-০৩","checked":"২০২৬-১০-১৭","src":"GitHub API ও README","docs":"https://github.com/jitsi/jiwer#readme","supports":["WER","CER"],"owner":"jitsi","host":"github"},"when":"OCR বা speech আউটপুট মাপতে","why":"WER ও CER-এর তৈরি ফাংশন, ছোট ও সরল।","tradeoff":"কোন লেখাকে 'সমান' ধরবে (যতিচিহ্ন, বড়-ছোট হাতের অক্ষর, Unicode রূপ) তা মাপার আগে নিজে ঠিক করা দরকার।"}],"why":"OCR ও speech-এ সরাসরি ভুলের পরিমাণ (সম্পাদনা-দূরত্ব) দেয়।","tradeoff":"বাংলায় 'অক্ষর' বলতে code point না grapheme তা আগে ঠিক করা দরকার; WER-এ শব্দের একটা অক্ষর ভুল হলে পুরো শব্দ ভুল গোনা হয়।"},{"id":"opt-mse-mae","name":"MSE / RMSE / MAE — সংখ্যা অনুমানের ভুল","definition":"সংখ্যা অনুমানের ভুল: MSE (ভুলের বর্গের গড়), RMSE (তার বর্গমূল), MAE (ভুলের পরম মানের গড়)।","kind":"option","when":"regression: সংখ্যা অনুমান","basis":"course","mathDetail":{"formula":"MSE = (1/n) Σ (ŷ − y)²;  RMSE = √MSE;  MAE = (1/n) Σ |ŷ − y|","meaning":"ŷ: অনুমান, y: সঠিক মান। MSE বড় ভুলকে বেশি শাস্তি দেয়, MAE কম।","example":"ভুল 1 আর 3 হলে MSE = (1+9)/2 = 5, MAE = (1+3)/2 = 2।"},"why":"সংখ্যা অনুমানের ভুল সরাসরি, দুই রূপে (বড় ভুলে সংবেদী বনাম স্থির)।","tradeoff":"MSE outlier-এ খুব সংবেদনশীল; MAE-তে বড় ভুলের বাড়তি শাস্তি নেই (Module 06)।"},{"id":"opt-perplexity","name":"Perplexity — ভাষা-model","definition":"ভাষা-model পরের token নিয়ে কতটা অনিশ্চিত: cross-entropy-র exp।","kind":"option","when":"ভাষা-model (pretraining, continued pretraining)","basis":"experience","mathDetail":{"formula":"PPL = exp( −(1/N) Σ ln p(tokenᵢ | আগের token) )","meaning":"কম মান মানে model পরের token আরও নিশ্চিতভাবে ধরছে।","example":"প্রতি token-এ গড় ঋণাত্মক-log 2.0 হলে PPL = e² ≈ 7.39।"},"why":"label ছাড়া data-তেও মাপা যায়; model পরের token-কে কতটা ধরছে তার সরাসরি মাপ।","tradeoff":"tokenizer বদলালে সংখ্যা তুলনীয় থাকে না; উত্তরের আসল মান (সঠিকতা) মাপে না।"},{"id":"opt-bleu-rouge","name":"BLEU / ROUGE — লেখার মিল","definition":"BLEU: model-এর লেখার n-gram কতটা reference-এ আছে; ROUGE: reference-এর n-gram কতটা model-এর লেখায় আছে।","kind":"option","when":"অনুবাদ, সারসংক্ষেপ","basis":"experience","why":"reference-এর সঙ্গে স্বয়ংক্রিয় তুলনা, সস্তা।","tradeoff":"শব্দ-মিলের মাপ: ভিন্ন শব্দে অর্থ-সঠিক উত্তরকে কম নম্বর দেয়।"}]},{"id":"goal-baseline","name":"baseline কী হবে?","definition":"tuning-এর লাভ মাপার তুলনা-বিন্দু। এটা না থাকলে 'ভালো হয়েছে' বলা যায় না।","kind":"decision","pick":"one","children":[{"id":"opt-baseline-prompt","name":"base model + ভালো prompt","definition":"কোনো training ছাড়া, শুধু ভালো নির্দেশ দিয়ে base model-এর ফল।","kind":"option","when":"সবসময় প্রথম পছন্দ: সবচেয়ে সস্তা","basis":"experience","why":"সবচেয়ে সস্তা তুলনা-বিন্দু: training ছাড়াই base model কত পায়।","tradeoff":"ভালো prompt লেখাও একটা কাজ; খারাপ prompt-এ baseline অযথা দুর্বল দেখায়।"},{"id":"opt-baseline-fewshot","name":"base model + কয়েকটা উদাহরণসহ prompt (few-shot)","definition":"prompt-এর সঙ্গে কয়েকটা সঠিক উদাহরণ জুড ১","u":"https://arxiv.org/abs/2106.10199"}],"typical":["বড় আধুনিক LLM-এ এখন LoRA বেশি প্রচলিত; BitFit বেশি দেখা যায় গবেষণা বা ছোট encoder model-এ।"],"pitfalls":["BERT-জাতীয় masked-LM model-এর ফল সব LLM-এ হুবহু খাটবে ধরে নেওয়া।"]}},{"id":"parameter-efficient-fine-tuning-peft","name":"Parameter-efficient Fine-tuning (PEFT)","definition":"মূল model-এর তুলনায় অল্প trainable parameter দিয়ে মানিয়ে নেওয়ার পরিবার।","kind":"option","when":"অল্প parameter বদলে মানাতে; একই base-এ অনেক কাজ","basis":"course","children":[{"id":"peft-which","name":"কোন PEFT?","definition":"parameter-efficient পদ্ধতির পরিবার থেকে একটা। LoRA সবচেয়ে প্রচলিত; বাকিরা তার কোনো অংশ বদলায় বা অন্য জায়গায় বসে।","kind":"decision","pick":"one","children":[{"id":"lora-low-rank-update","name":"LoRA — low-rank update","definition":"পুরো weight matrix update না করে ছোট A ও B matrix শেখানো।","mathDetail":{"formula":"W_effective = W + (α/r)BA","meaning":"W: frozen base matrix; B: d_out×r; A: r×d_in; r: ছোট rank; α: scaling।","example":"2×2 W-তে 4 মান। r=1 হলে A ও B মিলে 4 trainable মান—এ ছোট উদাহরণে সাশ্রয় নেই। বড় matrix ও ছোট r-এ সাশ্রয় হয়।"},"kind":"option","when":"memory সীমিত, একই base-এ অনেক কাজ","basis":"paper","children":[{"id":"lora-forward-pass-scale","name":"LoRA-র forward pass ও scale","definition":"মূল পথের পাশে ছোট একটা সংশোধন-পথ: input আগে A দিয়ে ছোট মাপে নামে, B দিয়ে আবার ফেরে, scale s দিয়ে গুণ হয়ে মূল ফলের সঙ্গে যোগ হয়।","mathDetail":{"formula":"z = Wx + b + s·B(Ax),  s = α / r","meaning":"W, b: frozen মূল অংশ; A: r×d, B: m×r শেখা matrix; s: সংশোধন কত জোরে যোগ হবে।","example":"W 1000×1000 হলে A ও B মিলে trainable r×(d+m); r=8-এ 16,000।"},"kind":"info","lessons":[{"k":"M13 · L03","t":"LoRA-র Forward Pass: একই input, দুই পথ","h":"module-13-pretraining-finetuning-and-lora/lecture-03-lora-forward-pass-and-activation.md"},{"k":"M13 · L04","t":"A আর B-র আকার, Parameter সংখ্যা ও Effective Weights","h":"module-13-pretraining-finetuning-and-lora/lecture-04-lora-matrix-pairs-and-effective-weights.md"}],"story":{"problem":"মূল weight না ছুঁয়ে model-এর আচরণে সংশোধন আনব কীভাবে?","idea":"মূল পথের পাশে আরেকটা ছোট পথ: input A দিয়ে ছোট মাপে নামে, B দিয়ে ফেরে, scale s গুণ হয়ে মূল ফলে যোগ হয়: z = Wx + b + s·B(Ax)।","next":[{"label":"Rank (r) — সংশোধনের ক্ষমতা","why":"ছোট মাপটা কত বড় হবে","id":"lora-rank"},{"label":"Alpha (α) — সংশোধনের জোর","why":"s কত হবে","id":"lora-alpha"}]},"practice":{"scenario":"code-এ এটা দুটো ছোট linear layer, একটা scale আর যোগ।","facts":[{"t":"LoRA paper: ΔW x কে α/r দিয়ে scale করা হয়; B শূন্য দিয়ে শুরু, তাই training-এর শুরুতে ΔW = 0।","s":"LoRA paper (Hu et al.), ২০২১","u":"https://arxiv.org/abs/2106.09685"}],"typical":["library-তে এটা `lora_alpha` ও `r` সেটিং; নাম মিলিয়ে নাও।"]}},{"id":"lora-rank","name":"Rank (r) — সংশোধনের ক্ষমতা","definition":"A, B-র মাঝের ছোট মাত্রা। r যত বড়, সংশোধনের বৈচিত্র্য তত বেশি, কিন্তু trainable parameter-ও তত বেশি।","mathDetail":{"formula":"trainable = r × (d + m)","meaning":"ΔW = B·A-র rank সর্বোচ্চ r। r বাড়ালে parameter সমানুপাতে বাড়ে।","example":"1000×1000 matrix-এ r = 1, 8, 64 হলে trainable 2,000, 16,000, 128,000 (W-র 0.2%, 1.6%, 12.8%)। কোন r ভালো, কাজ দেখে পরীক্ষা করে ঠিক করতে হয়।"},"kind":"info","lessons":[{"k":"M13 · L07","t":"LoRA-র চারটা Setting: Rank, Alpha, শুরুর মান, Dropout","h":"module-13-pretraining-finetuning-and-lora/lecture-07-lora-rank-alpha-init-dropout.md"}],"story":{"problem":"r বড় হলে সংশোধন বেশি ক্ষমতা পায়, কিন্তু parameter-ও বাড়ে। কতটা দেব?","idea":"trainable = r × (d + m)। r দ্বিগুণ করলে parameter দ্বিগুণ। কোন r ভালো, তা কাজ আর data দেখে পরীক্ষা করেই ঠিক হয়।","next":[{"label":"Alpha (α) — সংশোধনের জোর","why":"r-এর সঙ্গে জোড়া সেটিং","id":"lora-alpha"}]},"practice":{"scenario":"প্রথমে ছোট r (যেমন 8) দিয়ে শুরু করো; মান কম হলে বাড়াও।","facts":[{"t":"LoRA paper-এ অবাক করা ফল: Wq ও Wv দুটোয় বসালে r = 1-ও WikiSQL ও MultiNLI-তে প্রতিযোগিতামূলক ছিল।","s":"LoRA paper (Hu et al.), ২০২১","u":"https://arxiv.org/abs/2106.09685"},{"t":"QLoRA paper: সব layer-এ LoRA থাকলে r-এর মান শেষ ফলের সঙ্গে সম্পর্কহীন দেখা গেছে (তাদের পরীক্ষায়)।","s":"QLoRA paper (Dettmers et al.), ২০২৩","u":"https://arxiv.org/abs/2305.14314"}],"typical":["r নিয়ে বেশি সময় না দিয়ে আগে 'কোথায় বসাব' ঠিক করো।"],"pitfalls":["বড় r মানেই ভালো ধরে নেওয়া: parameter ও overfitting-এর ঝুঁকি বাড়ে।"]}},{"id":"lora-alpha","name":"Alpha (α) — সংশোধনের জোর","definition":"scale s = α/r-এর α অংশ: LoRA পথের ফল কতগুণ হয়ে মূল ফলে যোগ হবে।","mathDetail":{"formula":"s = α / r","meaning":"α/r এক রাখলে r বদলালেও সংশোধনের জোর একই থাকে। (rsLoRA-র scale আলাদা)","example":"B(Ax) = [1, 2, 1] হলে s = 0.5-এ সংশোধন [0.5, 1, 0.5], s = 2-এ [2, 4, 2]।"},"kind":"info","lessons":[{"k":"M13 · L07","t":"LoRA-র চারটা Setting: Rank, Alpha, শুরুর মান, Dropout","h":"module-13-pretraining-finetuning-and-lora/lecture-07-lora-rank-alpha-init-dropout.md"}],"story":{"problem":"r বদলালে সংশোধনের জোরও বদলে যেতে পারে, প্রতিবার সব সেটিং নতুন করে বাছা বিরক্তিকর।","idea":"scale s = α/r। r বদলে α/r এক রাখলে জোর একই থাকে। rsLoRA অন্য scale নেয়, তাই সেখানে একই α-তে তুলনা চলে না।","next":[{"label":"rsLoRA","why":"scale-এর বিকল্প নিয়ম","id":"rslora"}]},"practice":{"scenario":"r বদলে পরীক্ষা চালালে α/r এক রেখে তুলনা করো, নইলে দুই পরিবর্তন মিশে যায়।","facts":[{"t":"LoRA paper: Adam-এ α টিউন করা প্রায় learning rate টিউনের সমান; তাই তারা α-কে প্রথম পরীক্ষা-করা r-এর সমান রেখেছিল।","s":"LoRA paper (Hu et al.), ২০২১","u":"https://arxiv.org/abs/2106.09685"},{"t":"rsLoRA paper বলে, rank-দিয়ে-ভাগ করা scale বড় rank-এ শেখা ধীর ও ফল দুর্বল করে; তারা scale বদলানোর প্রস্তাব দেয়।","s":"rsLoRA paper (Kalajdzievski), ২০২৩","u":"https://arxiv.org/abs/2312.03732"}],"pitfalls":["α আর learning rate একসঙ্গে বদলানো: কারণ আলাদা করা যায় না।"]}},{"id":"lora-init","name":"LoRA-র শুরুর মান — B শূন্য","definition":"Standard LoRA-তে A ছোট random, B পুরো শূন্য দিয়ে শুরু। তাই শুরুতে ΔW = 0 এবং model ঠিক checkpoint-এর মতো চলে।","insight":{"fact":"দুটোই শূন্য হলে কারও gradient শূন্যের বেশি হয় না, শেখা আটকে যায়। B শূন্য, A random হলে প্রথম up alls":["বড় dropout: শেখাই কঠিন হয়।"]}},{"id":"lora-target-modules","name":"Target modules — কোথায় বসাবে","definition":"কোন weight matrix-এ (যেমন attention-এর q_proj, v_proj) LoRA বসবে তার তালিকা। তালিকার প্রতিটা module প্রতি block-এ নিজের আলাদা A, B জোড়া পায়।","insight":{"fact":"বড় model-এ (24 block, r=8) শুধু q বাছলে trainable মূলের 0.16%, চারটা module বাছলে 1.09%। target বাড়ালে trainable সমানুপাতে বাড়ে; কোনটা ভালো কাজ দেখে ঠিক হয়।"},"kind":"info","lessons":[{"k":"M13 · L08","t":"কোথায় LoRA বসাবে: Target, Gradient ও Memory","h":"module-13-pretraining-finetuning-and-lora/lecture-08-target-selection-gradient-and-memory.md"}],"story":{"problem":"শত শত weight matrix-এর কোনটায় LoRA বসাব?","idea":"তালিকা দিয়ে বলা: প্রতি block-এ তালিকার প্রতি module নিজের A, B পায়। বেশি module মানে বেশি ক্ষমতা, বেশি trainable ও memory।","next":[{"label":"Frozen-এর ভেতর দিয়ে gradient ও Memory","why":"এর খরচ ও gradient-এর পথ","id":"lora-gradient-memory"}]},"practice":{"scenario":"library-তে `target_modules` তালিকা দাও। প্রথমে শুধু attention-এর q, v দিয়ে দেখা যায়; মান কম হলে সব linear layer-এ।","facts":[{"t":"মূল LoRA paper attention-এর Wq ও Wv-তে কেন্দ্রীভূত ছিল, MLP বাদ।","s":"LoRA paper (Hu et al.), ২০২১","u":"https://arxiv.org/abs/2106.09685"},{"t":"QLoRA paper-এ সব linear layer-এ বসানো full fine-tuning-এর মানের জন্য জরুরি দেখা গেছে।","s":"QLoRA paper (Dettmers et al.), ২০২৩","u":"https://arxiv.org/abs/2305.14314"}],"typical":["module-এর নাম model-ভেদে আলাদা: নাম মিলিয়ে নাও।"],"pitfalls":["ভুল নাম দিলে library কিছুই বসায় না বা error দেয়: trainable parameter সংখ্যা ছাপিয়ে নিশ্চিত হও।"]}},{"id":"lora-gradient-memory","name":"Frozen-এর ভেতর দিয়ে gradient ও Memory","definition":"মূল weight frozen হলেও gradient তার ভেতর দিয়ে পেছনে যায়, তাই কম layer-এর LoRA-ও শিখতে পারে। frozen weight-এর নিজের gradient আর optimizer-এর হিসাব রাখতে হয় না, এখানেই memory বাঁচে।","insight":{"fact":"সংখ্যা-গোনায় trainable-এর জন্য মান, gradient আর Adam-এর দুটো, মোট ৪টা; frozen-এর শুধু মান, ১ট ral-network-training/README.md"}],"story":{"problem":"Fine-tuning কি আলাদা দ্বীপ?","idea":"না, অন্য শাখার ধারণার ওপর দাঁড়ায়। এই link-গুলো ধরে ফিরে ফিরে পড়তে পারো।","next":[{"label":"Loss","why":"ভুল মাপা","id":"loss"},{"label":"Gradient Descent","why":"শেখার ধাপ","id":"gradient-descent"},{"label":"Learning Rate","why":"ধাপের আকার","id":"learning-rate"},{"label":"Overfitting","why":"মুখস্থ করা","id":"overfitting"},{"label":"Validation Data","why":"বাছাইয়ের data","id":"validation-data"},{"label":"Transformer","why":"যে model-এ সাধারণত হয়","id":"transformer"}]},"practice":{"scenario":"Fine-tuning-এ আটকে গেলে প্রায়ই সমস্যা অন্য শাখার ধারণায়: loss, learning rate, overfitting, split। ওখানে ফিরে যাও।","typical":["loss না নামলে Training শাখা, মান ভালো দেখালেও আসলে খারাপ হলে Evaluation শাখা।"]}}],"lessons":[{"k":"M13 · L02","t":"Fine-Tuning পদ্ধতির মানচিত্র: দুটো আলাদা প্রশ্ন","h":"module-13-pretraining-finetuning-and-lora/lecture-02-finetuning-methods-map.md"},{"k":"M13 · L06","t":"Full, Selective ও Head-only Training: কে নড়বে, কে স্থির","h":"module-13-pretraining-finetuning-and-lora/lecture-06-full-selective-and-head-training.md"},{"k":"M08 · সূচি","t":"End-to-End ML Project — Python Practical","h":"module-08-end-to-end-ml-project/README.md"}],"story":{"problem":"pretrained model সাধারণ জ্ঞান জানে, কিন্তু আমার নির্দিষ্ট কাজ (যেমন বাংলা হাতের লেখা পড়া) জানে না।","idea":"checkpoint থেকে শুরু করে নিজের data-য় আরও শেখানো। শুরুর মান ভালো বলে অনেক কম data ও সময় লাগে। দুটো আলাদা সিদ্ধান্ত নিতে হয়: কোন parameter বদলাবে, আর কী থেকে শিখবে।","next":[{"label":"লক্ষ্য ও মাপকাঠি ঠিক করা","why":"আগে ঠিক করো কী মাপবে","id":"wf-goal"},{"label":"Input — আগের model ও নতুন data","why":"কী ঢোকে","id":"ft-input"},{"label":"Model শেখা (Fine-tuning-এ)","why":"ভেতরে কী ঘটে","id":"ft-cycle"},{"label":"Output — নতুন model ও রিপোর্ট","why":"কী বেরোয়","id":"ft-output"},{"label":"Domain ও Task Adaptation — মানিয়ে নেওয়া","why":"নির্দিষ্ট বিষয়ে মানাতে","id":"adaptation"}]},"choose":[{"label":"Full Fine-tuning","when":"GPU memory প্রচুর, পুরো model বদলাতে চাই","why":"সব weight শেখে, memory বেশি লাগে","id":"full-fine-tuning"},{"label":"LoRA — low-rank update","when":"memory কম, নতুন কাজ বা ধরন শেখাতে চাই","why":"মূল স্থির, ছোট adapter শেখে","id":"lora-low-rank-update"},{"label":"QLoRA","when":"memory আরও কম","why":"মূল weight কম bit-এ রেখে LoRA","id":"qlora"},{"label":"Head-only Fine-tuning","when":"শুধু শেষের সিদ্ধান্ত নতুন করে শেখাতে চাই","why":"আগের জ্ঞান অক্ষত","id":"head-only-fine-tuning"}],"practice":{"scenario":"ধরো তোমার একটা বাংলা গ্রাহকসেবা বট দরকার যে ব্যাংকের নিয়ম মেনে নির্দিষ্ট ভঙ্গিতে উত্তর দেয়। আগে prompt দিয়ে চেষ্টা করো। কাজ না হলে তথ্যের জন্য retrieval জোড়ো। উত্তরের ধরন, ভঙ্গি, ফরম্যাট বা সরু দক্ষতা তবুও না মিললে তবে fine-tuning।","facts":[{"t":"BERT-এ মূল model-এর ওপর মাত্র একটা বাড়তি output layer জুড়ে বহু কাজের জন্য fine-tune করা যায়।","s":"BERT paper (Devlin et al.), ২০১৮","u":"https://arxiv.org/abs/1810.04805"},{"t":"ULMFiT NLP-তে transfer learning-এর জন্য একটা পদ্ধতি দেয়, আর ছয়টা text classification কাজে বেশির ভাগ dataset-এ error ১৮–২৪% কমায় বলে paper জানিয়েছে।","s":"ULMFiT paper (Howard & Ruder), ২০১৮","u":"https://arxiv.org/abs/1801.06146"},{"t":"মাত্র ১,০০০ যত্নে-বাছা উদাহরণেই SFT শক্ত ফল দিতে পারে (LIMA)।","s":"LIMA paper (Zhou et al.), ২০২৩","u":"https://arxiv.org/abs/2305.11206"}],"typical":["কাজের ক্রম প্রায়ই: prompt → (দরকারে) retrieval → fine-tuning। উল্টো ক্রমে শুরু করা বেশি খরচের।","fine-tuning সাধারণত আচরণ, ভঙ্গি, ফরম্যাট ও সরু দক্ষতায় ভালো; নতুন বিশাল তথ্য মুখস্থ করাতে নির্ভরযোগ্য নয় বলে প্রচলিত ধারণা। তথ্য বদলায় এমন হলে retrieval আগে ভাবো।","শুরুতে ছোট, পরিষ্কার data আর ছোট LoRA run দিয়ে 'কাজ হচ্ছে কি না' দেখো; তারপর বড় করো।","প্রথম চক্র ছোট রাখো: ছোট, পরিষ্কার data আর ছোট run; 'কাজ হচ্ছে কি না' আগে দেখো, তারপর বড় করো।","ধাপগুলো সরলরেখা নয়, চক্র: মাপার ফল দেখে data বা সেটিং-এ ফিরতে হয়।"],"pitfalls":["আগে test আলাদা না করে tuning শুরু করা।","শুধু নতুন কাজে মাপা: পুরোনো সাধারণ ক্ষমতা কমল কি না না-দ "kind":"option","basis":"course","when":"মানানসই আগে-শেখা model নেই, data যথেষ্ট, আর শুরু থেকে নিয়ন্ত্রণ চাই","steps":["sc-justify","sc-arch","sc-data","sc-init-hp","sc-scale","sc-run","sc-eval","sc-deploy"],"children":[{"id":"go-sc-justify","name":"দরকার যাচাই ও লক্ষ্য","definition":"এই ধাপের সিদ্ধান্তগুলো দেখতে ও বাছতে এখানে চাপো।","kind":"stepref","goto":"sc-justify","seq":"১"},{"id":"go-sc-arch","name":"Architecture বাছা","definition":"এই ধাপের সিদ্ধান্তগুলো দেখতে ও বাছতে এখানে চাপো।","kind":"stepref","goto":"sc-arch","seq":"২"},{"id":"go-sc-data","name":"Tokenizer ও data","definition":"এই ধাপের সিদ্ধান্তগুলো দেখতে ও বাছতে এখানে চাপো।","kind":"stepref","goto":"sc-data","seq":"৩"},{"id":"go-sc-init-hp","name":"Initialization ও hyperparameter","definition":"এই ধাপের সিদ্ধান্তগুলো দেখতে ও বাছতে এখানে চাপো।","kind":"stepref","goto":"sc-init-hp","seq":"৪"},{"id":"go-sc-scale","name":"স্কেল ও memory","definition":"এই ধাপের সিদ্ধান্তগুলো দেখতে ও বাছতে এখানে চাপো।","kind":"stepref","goto":"sc-scale","seq":"৫"},{"id":"go-sc-run","name":"Training চালানো ও নজর রাখা","definition":"এই ধাপের সিদ্ধান্তগুলো দেখতে ও বাছতে এখানে চাপো।","kind":"stepref","goto":"sc-run","seq":"৬"},{"id":"go-sc-eval","name":"মাপা","definition":"এই ধাপের সিদ্ধান্তগুলো দেখতে ও বাছতে এখানে চাপো।","kind":"stepref","goto":"sc-eval","seq":"৭"},{"id":"go-sc-deploy","name":"Deploy","definition":"এই ধাপের সিদ্ধান্তগুলো দেখতে ও বাছতে এখানে চাপো।","kind":"stepref","goto":"sc-deploy","seq":"৮"}],"why":"tokenizer, architecture আর data-র ওপর পুরো নিয়ন্ত্রণ।","tradeoff":"সবচেয়ে বেশি data, GPU-সময় ও খরচ; ভুল সিদ্ধান্তে পুরো run নষ্ট হতে পারে।"}]}]}],"story":{"problem":"কিছু কাজের নিয়ম আমরা নিজেরাই জানি না। ছবিতে বিড়াল চেনার নিয়ম কেউ লিখে দিতে পারে না, অথচ দেখলেই চিনি। নিয়ম হাতে লিখতে হলে কম্পিউটারকে দিয়ে এসব কাজ হতো না।","idea":"নিয়ম না লিখে অনেক উদাহরণ দেখাও, আর যন্ত্র নিজে সেখান থেকে নিয়ম খুঁজে নিক। এটাই Machine Learning। মানচিত্রটা ছয়টা প্রশ্নের উত্তর: কী কাজ (১), কী থেকে শিখবে (২), কোন model (৩), কীভাবে শিখবে (৪), কতটা ভালো হলো (৫), কোথায় লাগবে (৬)।","next":[{"label":"১. Task — কী কাজ করাতে চাই?","why":"প্রথমে ঠিক করো কী পেতে চাও","id":"task"}]}}</script>
<script>
/* বাছাই-যুক্তি (DOM-মুক্ত): "আমার পথ"-এর সব নিয়ম এখানে, যাতে Node-এ test করা যায়।
 * records: গাছের ক্রমে সব node-record  { node, parent, children, depth, order }
 * byId:    id → record
 * নিয়ম:
 *   ১. বাছা যায় kind = option | tool।
 *   ২. কিছু বাছলে তার বাছাইযোগ্য সব পূর্বপুরুষও বাছা হয় (বন্ধ-ওপরমুখী)।
 *   ৩. decision.pick = 'one' হলে ভাই-বোনের একটা বাছলে বাকিরা (সন্তানসহ) বাদ।
 *   ৪. কিছু বাদ দিলে তার নিচের সব বাছাইও বাদ।
 */
const AtlasEngine = (function () {
  'use strict';
  const SELECTABLE = new Set(['option', 'tool']);
  const GENERIC = new Set(['গঠন ও হিসাব', 'ধরন', 'সাধারণ গঠন', 'প্রচলিত অতিরিক্ত অংশ', 'প্রয়োজন অনুযায়ী সহায়ক অংশ', 'বিন্যাস অনুযায়ী']);
  const short = (name) => name.replace(/^[০-৯0-9]+\.\s*/, '').split(' — ')[0];

  function create(records, byId) {
    const selected = new Set();   // জীবন্ত Set: কখনো নতুন করে বসানো হয় না, শুধু বদলানো হয়

    const ancestors = (r) => { const out = []; for (let x = r; x; x = x.parent) if (SELECTABLE.has(x.node.kind)) out.push(x); return out; };
    function removeWithDesc(id) {
      const r = byId.get(id); if (!r) return;
      (function rec(x) { selected.delete(x.node.id); x.children.forEach(rec); })(r);
    }
    function enforceOne(x) {
      const p = x.parent;
      if (p && p.node.kind === 'decision' && p.node.pick === 'one') for (const sib of p.children) if (sib !== x && selected.has(sib.node.id)) removeWithDesc(sib.node.id);
    }
    /** @returns {{ok:boolean, on:boolean, record:object|null}} on = এখন বাছা অবস্থায় */
    function toggle(id) {
      const r = byId.get(id);
      if (!r || !SELECTABLE.has(r.node.kind)) return { ok: false, on: false, record: null };
      if (selected.has(id)) { removeWithDesc(id); return { ok: true, on: false, record: r }; }
      for (const x of ancestors(r).reverse()) { enforceOne(x); selected.add(x.node.id); }
      return { ok: true, on: true, record: r };
    }
    function setFrom(ids) {
      selected.clear();
      for (const id of ids) {
        const r = byId.get(id);
        if (r && SELECTABLE.has(r.node.kind)) for (const x of ancestors(r).reverse()) { enforceOne(x); selected.add(x.node.id); }
      }
    }
    const clear = () => selected.clear();
    const stepOf = (r) => { for (let x = r.parent; x; x = x.parent) if (x.node.kind === 'step') return x; return null; };
    const pathNames = (r, stop) => { const out = []; for (let x = r; x && x !== stop && (stop || x.depth > 1); x = x.parent) if (!GENERIC.has(x.node.name)) out.unshift(short(x.node.name)); return out; };
    const ordered = () => [...selected].map((id) => byId.get(id)).sort((a, b) => a.order - b.order);
    const activeMode = () => { for (const id of selected) { const r = byId.get(id); if (r && r.node.steps) return r; } return null; };
    function stepStat(sid) {
      const r = byId.get(sid); let n = 0;
      if (!r) return 0;
      (function rec(x) { if (selected.has(x.node.id) && SELECTABLE.has(x.node.kind) && !x.node.steps) n++; x.children.forEach(rec); })(r);
      return n;
    }
    function pending() {
      const steps = new Set(ordered().map((r) => stepOf(r)).filter(Boolean));
      const out = [];
      for (const r of records) {
        if (r.node.kind !== 'decision') continue;
        let a = r.parent;
        while (a && a.node.kind !== 'step' && !SELECTABLE.has(a.node.kind)) a = a.parent;   // info/decision পেরিয়ে
        if (!a) continue;
        const active = a.node.kind === 'step' ? steps.has(a) : selected.has(a.node.id);
        if (active && !r.children.some((c) => selected.has(c.node.id))) out.push(r);
      }
      return out;
    }
    function groups() {
      const g = new Map();
      for (const r of ordered()) { const st = stepOf(r); const key = st ? st.node.id : '_'; if (!g.has(key)) g.set(key, { step: st, items: [] }); g.get(key).items.push(r); }
      return [...g.values()];
    }
    function toolLine(n) {
      if (n.kind !== 'tool' || !n.tool) return '';
      const t = n.tool;
      return `${t.repo} · licence: ${t.license}${t.archived ? ' · ⚠ archived' : ''}`;
    }
    function markdown(dateStr) {
      const md = activeMode();
      const lines = ['# আমার পথ' + (md ? ': ' + short(md.node.name) : ''), '', `> ML Learning Atlas থেকে · ${dateStr} · ${selected.size}টা বাছাই`, ''];
      for (const g of groups()) {
        lines.push('## ' + (g.step ? g.step.node.name : 'পথের ধরন'));
        for (const r of g.items) {
          lines.push('- ' + pathNames(r, g.step).join(' › ') + (r.node.kind === 'tool' ? ' (tool)' : ''));
          const tl = toolLine(r.node); if (tl) lines.push('  - ' + tl);
          if (r.node.when) lines.push('  - কখন: ' + r.node.when);
          if (r.node.why) lines.push('  - কেন: ' + r.node.why);
          if (r.node.tradeoff) lines.push('  - দাম/সীমা: ' + r.node.tradeoff);

    if (r && inPlanTree(r)) {
      let a = r.parent;
      while (a && !SELECTABLE.has(a.node.kind) && a.node.kind !== 'decision') a = a.parent;
      const where = a && SELECTABLE.has(a.node.kind) ? `"${short(a.node.name)}" বাছলে এটা নিজে থেকেই তার অংশ হয়ে আসে` : 'এটা ব্যাখ্যা, সিদ্ধান্ত নয়';
      const note = el('div', 'infonote');
      note.append(el('span', 'kchip info', 'ব্যাখ্যা'), el('span', '', ' বাছার বিষয় নয়: ' + where + '; আলাদা করে বাছার কিছু নেই। সিদ্ধান্তগুলো ওপরের ও নিচের "বাছো" বোতামওয়ালা node-এ।'));
      wrap.append(note); box.append(wrap);
    }
    return;
  }
  if (node.kind === 'decision') {
    wrap.append(el('span', 'kchip ' + (node.pick === 'one' ? 'one' : 'many'), node.pick === 'one' ? 'এখানে একটা বাছো' : 'এখানে একাধিক বাছতে পারো'));
  } else {
    const on = selected.has(node.id);
    const b = el('button', 'control strong', on ? '✓ পথে আছে (বাদ দিতে চাপো)' : 'এটা আমার পথে বাছো');
    b.type = 'button'; b.onclick = () => toggleSel(node.id);
    wrap.append(b);
    if (node.basis && BASIS[node.basis]) wrap.append(el('span', 'kchip basis ' + node.basis, BASIS[node.basis]));
    if (node.docs) { const a = el('a', 'src', 'docs'); a.href = node.docs; a.target = '_blank'; a.rel = 'noopener noreferrer'; wrap.append(a); }
    const guide = el('div', 'guide');
    const row = (cls, label, text) => { if (!text) return; const d = el('div', 'grow ' + cls); d.append(el('span', 'gk', label), el('span', 'gv', text)); guide.append(d); };
    row('when', 'কখন বাছবে', node.when);
    row('why', 'কেন বাছবে', node.why);
    row('cost', 'দাম / কখন এড়াবে', node.tradeoff);
    if (node.how && node.how.length) {
      const d = el('div', 'grow how'); d.append(el('span', 'gk', 'কীভাবে চালু করবে'));
      const v = el('span', 'gv');
      for (const h of node.how) { const a = el('a', 'src', h.t); a.href = h.u; a.target = '_blank'; a.rel = 'noopener noreferrer'; v.append(a, el('br')); }
      d.append(v); guide.append(d);
    }
    if (guide.childNodes.length) wrap.append(guide);
  }
  if (node.kind === 'tool' && node.tool) {
    const t = node.tool, info = el('div', 'toolinfo');
    info.append(el('div', 'lbl', t.archived ? '⚠ tool-এর তথ্য (archived)' : 'tool-এর তথ্য'));
    const row = (k, v) => { const d = el('div', 'trow'); d.append(el('span', 'k', k), v instanceof Node ? v : el('span', 'v', v)); info.append(d); };
    const link = (u, text) => { const a = el('a', 'src', text || u); a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer'; return a; };
    row('repo / উৎস', link(t.repo));
    if (t.owner) row('মালিক', t.owner + (t.owner === 'huggingface' && t.host === 'github' ? ' (Hugging Face ইকোসিস্টেম)' : ''));
    if (t.docs) row('docs', link(t.docs));
    row('licence', t.license);
    row('অবস্থা', t.archived ? 'archived: আর আপডেট নেই, নতুন কাজে এড়াও' : 'সক্রিয় (শেষ push: ' + t.pushed + ')');
    if (t.supports) row('যা চলে', t.supports.join(', '));
    if (t.note) row('সতর্কতা', t.note);
    row('যাচাই', t.src + ', ' + t.checked);
    wrap.append(info);
  }
  box.append(wrap);
}
/* ---------- শুরু ---------- */
const ALIAS = cfg.aliases || {};
const resolveId = (id) => (byId.has(id) ? id : (ALIAS[id] && byId.has(ALIAS[id]) ? ALIAS[id] : id));
const root = build(data, tree, 0, []);
buildJump(root);
{
  let ids = [];
  if (location.hash.startsWith('#plan=')) ids = location.hash.slice(6).split(',').filter(Boolean).map(resolveId);
  else { try { const a = JSON.parse(store('ml-atlas-plan') || '[]'); if (Array.isArray(a)) ids = a.map(resolveId); } catch (e) { ids = []; } }
  setSelFrom(ids);
  refreshSel();
  if (selected.size && window.innerWidth > 900) openPlan(true);
}
updateCount();
setView(location.hash === '#path' ? 'path' : (store('ml-atlas-view') === 'path' ? 'path' : 'tree'));
{ const id = resolveId(decodeURIComponent(location.hash.slice(1))); if (id && byId.has(id)) openNode(id, { hash: false }); }
})();
