nd-math-basics/lecture-03-how-supervised-learning-works.md"},{"k":"M01 · L04","t":"Unsupervised Learning: K-Means","h":"module-01-ml-fundamentals-and-math-basics/lecture-04-how-unsupervised-learning-works.md"},{"k":"M01 · L05","t":"Reinforcement Learning: Q-learning","h":"module-01-ml-fundamentals-and-math-basics/lecture-05-how-reinforcement-learning-works.md"}],"story":{"problem":"model-কে শেখাতে হলে কিছু একটা থেকে শেখাতে হবে। সেই 'কিছু'টা কখনো সঠিক উত্তর, কখনো শুধু data, কখনো কাজের ফল। কী আছে তার উপর পদ্ধতি বদলে যায়।","idea":"শেখার তথ্য কোথা থেকে আসে, সেটাই learning setting। নিচের প্রশ্নে নিজের হাতের তথ্য মিলিয়ে নাও।","next":[{"label":"৩. Model — ধরন → ভেতরের অংশ","why":"শেখার তথ্য ঠিক হলে model বাছো","id":"model"}]},"choose":[{"label":"Supervised Learning","when":"প্রতিটা উদাহরণের সঠিক উত্তর আছে","why":"উত্তর দেখে শেখে","id":"supervised-learning"},{"label":"Unsupervised Learning","when":"উত্তর নেই, শুধু data","why":"data-র গঠন খোঁজে","id":"unsupervised-learning"},{"label":"Self-supervised Learning","when":"অনেক লেখা বা ছবি আছে, উত্তর নেই, কিন্তু data-র ভেতর থেকেই উত্তর বানানো যায়","why":"যেমন লেখার পরের শব্দ লুকিয়ে অনুমান","id":"self-supervised-learning"},{"label":"Semi-supervised Learning","when":"কিছু উদাহরণের উত্তর আছে, বেশিরভাগের নেই","why":"অল্প উত্তর দিয়ে শুরু, বাকিটা নিজে","id":"semi-supervised-learning"},{"label":"Reinforcement Learning (RL)","when":"সঠিক উত্তর নেই, কাজ করে ফল (পুরস্কার) পাই","why":"চেষ্টা করে শেখে","id":"reinforcement-learning-rl"}]},{"id":"model","name":"৩. Model — ধরন → ভেতরের অংশ","definition":"আগে model বেছে নাও, তারপর তার ভেতরের অংশ খোলো। একই component একাধিক model-এ ব্যবহার হতে পারে।","insight":{"fact":"একই Attention RNN ও Transformer—দুটোর সঙ্গেই থাকতে পারে। গাছে দুই জায়গায় নাম দেখলে দুটি আলাদা আবিষ্কার ভেবো না; একই যন্ত্রাংশের একাধিক ব্যবহার।"},"children":[{"id":"model--linear-regression","name":"Linear Regression","definition":"Input-গুলোর weighted sum ও bias দিয়ে সংখ্যামান অনুমান করে।","profile":{"why":"মাপজোখের ভুল থাকা সত্ত্বেও সংখ্যার সম্পর্ক থেকে সহজ prediction দরকার। সরল সম্পর্কের ক্ষেত্রে কম খরচে ব্যাখ্যাযোগ্য baseline দেয়।","history":"একক আবিষ্কারের সাল নয়। Least squares: Legendre ১৮০৫; Gauss ১৮০৯। প্রাথমিক প্রেক্ষাপট ছিল জ্যোতির্বিজ্ঞানের পর্যবেক্ষণ থেকে অজানা মান নির্ণয়।","uses":"সংখ্যামান অনুমান, feature-এর সঙ্গে ফলের সম্পর্ক বিশ্লেষণ এবং regression baseline।","status":"২০২৫: Linear Regression as a Litmus Test for Time Series Forecasting Benchmarks গবেষণায় linear regression দিয়ে forecasting benchmark যাচাই করা হয়েছে। অর্থাৎ পুরোনো model দিয়ে আধুনিক foundation model মূল্যায়নের পদ্ধতিকেই প্রশ্ন করা হচ্ছে।","sources":[{"title":"Least squares-এর ঐতিহাসিক বিবরণ","url":"https://www.york.ac.uk/depts/maths/histstat/legendre.pdf"},{"title":"বর্তমান official documentation","url":"https://scikit-learn.org/stable/modules/linear_model.html"},{"title":"Linear Regression forecasting study, 2025","url":"https://openreview.net/pdf?id=wfyc8vLcq0"},{"title":"LTSF-Linear: official code, AAAI 2023","url":"https://github.com/cure-lab/LTSF-Linear"}],"story":["কম্পিউটার আসার অনেক আগেই বিজ্ঞানীদের একটি সমস্যা ছিল: একই জিনিস বারবার মাপলেও ফল একটু আলাদা আসে। আকাশের বস্তুর অবস্থান নির্ণয়ের মতো কাজে সব পর্যবেক্ষণ মিলিয়ে একটি গ্রহণযোগ্য হিসাব দরকার হতো। Least squares সেই অমিলকে একসঙ্গে ছোট করার পথ দেয়।","পরে একই ধারণা দিয়ে input ও output-এর সম্পর্ক শেখানো হলো। বাড়ির আয়তনের মতো feature-কে weight দিয়ে গুণ করে bias যোগ করলে দাম অনুমান করা যায়। তাই Linear Regression সত্যিই পুরোনো model; ML নামটি প্রচলিত হওয়ার অনেক আগে তার গাণিতিক ভিত্তি ছিল।","আজ বড় model এলেও সহজ model দরকার: জটিল model আসলে কতটা বাড়তি সুবিধা দিল, তা বুঝতে তুলনা করতে হয়। আর কোনো neural network-এ linear layer থাকলেই পুরো network-কে Linear Regression বলা যায় না—একই operation বড় ভিন্ন কাঠামোর অংশ হতে পারে।"],"role":"সরাসরি model হিসেবে: সময়ের আগের মান থেকে পরের মান অনুমানের baseline। আলাদা উদাহরণ LTSF-Linear/DLinear (AAAI ২০২৩): linear forecasting architecture; এটি neural forecasting বিন্যাস, সাধারণ least-squares implementation-এর সঙ্গে হুবহু এক নয়।"},"selection":{"problem":"দেওয়া feature থেকে একটি সংখ্যামান অনুমান করতে চাই।","when":"সরল ও ব্যাখ্যাযোগ্য baseline দরকার; feature ও target-এর সম্পর্ক মোটামুটি additive/linear হতে পারে।","avoid":"জটিল interaction সরাসরি ধরবে না; ভবিষ্যতের ভিন্ন পরিবেশে extrapolation নির্ভরযোগ্য ধরে নিও না।","compare":"একই validation data-তে Tree Regressor বা Tree Ensemble-এর সঙ্গে error ও inference খরচ তুলনা করো।","example":"আয়তন ও ঘরের সংখ্যা → বাড়ির দাম। আগে Linear Regression, তারপর বেশি জটিল model সত্যিই error কমায় কি না দেখো।"},"children":[{"id":"model--linear-regression--weight","name":"Weight","definition":"Input বা মধ্যবর্তী মানের প্রভাব নিয়ন্ত্রণকারী শেখা গুণক।","insight":{"fact":"Weight ঋণাত্মকও হতে পারে। Input বাড়লে output কমার সম্পর্কও তাই শেখা যায়; তবে বড় weight দেখেই feature বেশি গুরুত্বপূর্ণ বলা যায় না, input-এর scale-ও দেখতে হয়।"},"lessons":[{"k":"M02 · L01","t":"Linear Regression: Prediction, Weight ও Bias","h":"module-02-linear-regression/lecture-01-prediction-weight-and-bias.md"},{"k":"M09 · L02","t":"Parameters: Model-এর শেখা মান","h":"module-09-model-architecture/lecture-02-parameters-and-hyperparameters.md"}],"story":{"problem":"সব input সমান গুরুত্বের নয়। বাড়ির দামে আয়তনের প্রভাব বেশি, দেয়ালের রঙের কম।","idea":"প্রতিটা input-এর সঙ্গে একটা গুণক বসে, সেটা weight। বড় weight মানে বেশি প্রভাব। training-এ এই গুণকগুলোই শেখা হয়।","next":[{"label":"Bias","why":"weight-এর সঙ্গী সংখ্যা","id":"model--linear-regression--bias"}]}},{"id":"model--linear-regression--bias","name":"Bias","definition":"Weighted sum-এর সঙ্গে যোগ হওয়া শেখা মান।","insight":{"fact":"Input শূন্য হলেও output শূন্য হওয়া বাধ্যতামূলক নয়—bias সেই স্বাধীনতা দেয়। এই গাণিতিক bias আর data-র সামাজিক পক্ষপাত একই অর্থ নয়।"},"lessons":[{"k":"M02 · L01","t":"Linear Regression: Prediction, Weight ও Bias","h":"module-02-linear-regression/lecture-01-prediction-weight-and-bias.md"},{"k":"M09 · L02","t":"Parameters: Model-এর শেখা মান","h":"module-09-model-architecture/lecture-02-parameters-and-hyperparameters.md"}],"story":{"problem":"সব input শূন্য হলেও উত্তর শূন্য হওয়ার কথা নয়। একটা শুরুর মান দরকার।","idea":"weighted sum-এর সঙ্গে একটা শেখা সংখ্যা যোগ হয়, সেটা bias। এটা রেখাকে ওপরে-নিচে সরিয়ে ঠিক জায়গায় বসায়।","next":[{"label":"Weighted Sum","why":"দুটো মিলে হিসাব","id":"model--linear-regression--weighted-sum"}]}},{"id":"model--linear-regression--weighted-sum","name":"Weighted Sum","definition":"প্রতিটি মানকে তার weight দিয়ে গুণ করে ফলগুলো যোগ করা।","insight":{"fact":"শুধু weight দিয়ে গুণ ও যোগ করলে ফল এখনও linear ধরনের হিসাব। অনেকগুলো এমন layer পরপর দিলেও nonlinear activation ছাড়া নতুন nonlinear সম্পর্ক তৈরি হয় না।"},"lessons":[{"k":"M02 · L04","t":"অনেকগুলো Feature ও Dot Product","h":"module-02-linear-regression/lecture-04-many-features-and-dot-product.md"},{"k":"M09 · L03","t":"একটি Unit: কয়েকটি input থেকে একটি ফল","h":"module-09-model-architecture/lecture-03-one-neuron.md"}],"story":{"problem":"অনেকগুলো input থেকে একটাই সংখ্যা বানাতে হবে, আর প্রতিটার প্রভাব আলাদা।","idea":"প্রতিটা input-কে তার weight দিয়ে গুণ করো, সব গুণফল যোগ করো। এটাই প্রায় সব model-এর মূল হিসাব।","next":[{"label":"Unit / Neuron","why":"এই হিসাব দিয়ে unit","id":"general-structure--hidden-layer--unit-neuron"}]}}],"lessons":[{"k":"M02 · L01","t":"Linear Regression: Prediction, Weight ও Bias","h":"module-02-linear-regression/lecture-01-prediction-weight-and-bias.md"},{"k":"M02 · L03","t":"Gradient Descent: Weight ও Bias শেখা","h":"module-02-linear-regression/lecture-03-gradient-descent-training.md"}],"story":{"problem":"একটা সংখ্যা আগে থেকে বলতে চাই। যেমন বাড়ির আয়তন জানলে দাম কত হতে পারে। হাতে আছে আগের কিছু বাড়ির আয়তন আর দাম।","idea":"আগের উদাহরণগুলোর মাঝ দিয়ে একটা সোজা রেখা টানো। নতুন বাড়ির দাম ওই রেখা থেকে পড়ে নাও। রেখাটা দুটো সংখ্যায় ঠিক হয়: weight (আয়তন বাড়লে দাম কতটা বাড়ে) আর bias (শুরুর মান)। সেরা রেখা মানে সবচেয়ে কম ভুল।","next":[{"label":"Logistic Regression","why":"উত্তর সংখ্যা না হয়ে হ্যাঁ/না হলে","id":"model--logistic-regression"},{"label":"Decision Tree","why":"সম্পর্ক সোজা রেখায় ধরা না গেলে","id":"decision-tree"},{"label":"Neural Network","why":"খুব জটিল সম্পর্ক, বা ছবি/লেখা input হলে","id":"neural-network"}]},"choose":[{"label":"Linear Regression","when":"প্রথমবার একটা কাজ শুরু করছি","why":"আগে এটা দিয়ে মাপকাঠি বানাও","id":"model--linear-regression"},{"label":"Linear Regression","when":"সম্পর্ক মোটামুটি সোজা আর কারণ বোঝাতে হবে","why":"weight দেখে বলা যায় কোনটা কতটা প্রভাব ফেলে","id":"model--linear-regression"},{"label":"Tree Ensemble","when":"সম্পর্ক বাঁকা বা শর্তের মতো (আয়তন ১০০০-এর বেশি হলে এক রকম)","why":"শর্ত আর বাঁক নিজে ধরে","id":"tree-ensemble"},{"label":"Neural Network","when":"ছবি বা লেখা থেকে সংখ্যা","why":"নিজে feature বানায়","id":"neural-network"}],"history":[{"y":"১৮০৫–০৬ (সূত্রভেদে সাল আলাদা)","t":"Legendre ধূমকেতুর কক্ষপথ নিয়ে একটা বইয়ের পরিশিষ্টে least squares (ভুলের বর্গের যোগফল কমানোর পদ্ধতি) প্রথম প্রকাশ করেন। MacTutor বলছে ১৮০৬; অন্য সূত্রে ১৮০৫, তাই একটা সাল ধরে লিখলাম না।","s":"MacTutor: Legendre","u":"https://mathshistory.st-andrews.ac.uk/Biographies/Legendre/"},{"y":"১৮০৯","t":"Gauss নিজের সংস্করণ প্রকাশ করেন। Legendre-এর বইয়ে এটা আগে ছাপা হয়েছে মেনে নিয়েও তিনি আগে থেকে ব্যবহারের দাবি জানান।","s":"MacTutor: Legendre","u":"https://mathshistory.st-andrews.ac.uk/Biographies/Legendre/"},{"y":"১৮৮৬","t":"Francis Galton বাবা-মা আর সন্তানের উচ্চতা নিয়ে লেখেন: লম্বা বাবা-মায়ের সন্তান গড়ে কিছুটা কম লম্বা হয়। ঘটনাটার নাম দেন 'regression towards mediocrity' (Journal of the Anthropological Institute, খণ্ড ১৫, পৃ. ২৪৬–২৬৩)।","s":"Galton, 1886 (York)","u":"https://www.york.ac.uk/depts/maths/histstat/galton_reg.htm"}]},{"id":"model--logistic-regression","name":"Logistic Regression","definition":"Input থেকে পাওয়া score-কে শ্রেণির probability-তে বদলায়; নামের মধ্যে regression থাকলেও এটি classification model।","profile":{"why":"হ্যাঁ/না ধরনের ফলের সম্ভাবনা দরকার; সরাসরি linear output ০–১ সীমা মানে না। Logistic link সেই probability model তৈরি করে।","history":"ধাপে ধাপে বিকাশ। D. R. Cox-এর ১৯৫৮ সালের binary sequence regression গবেষণা গুরুত্বপূর্ণ milestone; এটিই একমাত্র সূচনা নয়।","uses":"Binary বা multiclass classification; text classification-এর দ্রুত ও ব্যাখ্যাযোগ্য baseline।","status":"DINOv2 (২০২৩)-এর official evaluation code-এ logistic regression আছে; code ১৭ অক্টোবর ২০২৬-এ যাচাই করা হয়েছে। এটি DINOv2-এর শেখা image features দিয়ে classification পরীক্ষা করে।","sources":[{"title":"Cox, 1958","url":"https://doi.org/10.1111/j.2517-6161.1958.tb00292.x"},{"title":"বর্তমান official documentation","url":"https://scikit-learn.org/stable/modules/linear_model.html"},{"title":"DINOv2: official logistic-regression evaluation","url":"https://github.com/facebookresearch/dinov2/blob/main/dinov2/eval/log_regression.py"}],"story":["সংখ্যা অনুমানের পরে আসে আরেক প্রয়োজন: কোনো ঘটনা ঘটবে কি না? একটি সরল রেখার ফল ঋণাত্মক বা ১-এর বেশি হতে পারে, তাই সেটিকে সরাসরি probability বলা যায় না। Logistic model score-কে ০–১-এর সম্ভাবনায় প্রকাশের পথ দেয়।","এর শক্তি শুধু সহজ হওয়া নয়; কোন feature ফলকে কোন দিকে ঠেলে দিচ্ছে, সেটিও বোঝা যায়। আধুনিক image model ছবি থেকে ভালো feature বের করলেও শেষের শ্রেণি চেনার কাজ একটি ছোট logistic classifier-কে দেওয়া যায়।"],"role":"বড় model-এর পরে আলাদা classifier/evaluator। DINOv2 নিজে Logistic Regression নয়; তার representation মূল্যায়নে এই পুরোনো model ব্যবহৃত হয়।"},"selection":{"problem":"উদাহরণ কোন শ্রেণির এবং তার probability কত, তা অনুমান করতে চাই।","when":"দ্রুত classification baseline; sparse text features বা আগে থেকে তৈরি embedding আছে।","avoid":"কাঁচা feature-এ খুব জটিল nonlinear boundary হলে feature engineering বা অন্য model লাগতে পারে।","compare":"Text-এ Naive Bayes/linear SVM; tabular data-তে tree ensemble-এর সঙ্গে তুলনা করো।","example":"Spam/স্বাভাবিক email: word features → Logistic Regression। এটি নতুন email লিখে দেয় না।"},"children":[{"id":"model--logistic-regression--weight","name":"Weight","definition":"Input বা মধ্যবর্তী মানের প্রভাব নিয়ন্ত্রণকারী শেখা গুণক।","insight":{"fact":"Weight ঋণাত্মকও হতে পারে। Input বাড়লে output কমার সম্পর্কও তাই শেখা যায়; তবে বড় weight দেখেই feature বেশি গুরুত্বপূর্ণ বলা যায় না, input-এর scale-ও দেখতে হয়।"},"lessons":[{"k":"M02 · L01","t":"Linear Regression: Prediction, Weight ও Bias","h":"module-02-linear-regression/lecture-01-prediction-weight-and-bias.md"},{"k":"M09 · L02","t":"Parameters: Model-এর শেখা মান","h":"module-09-model-architecture/lecture-02-parameters-and-hyperparameters.md"}],"story":{"problem":"সব input সমান গুরুত্বের নয়। বাড়ির দামে আয়তনের প্রভাব বেশি, দেয়ালের রঙের কম।","idea":"প্রতিটা input-এর সঙ্গে একটা গুণক বসে, সেটা weight। বড় weight মানে বেশি প্রভাব। training-এ এই গুণকগুলোই শেখা হয়।","next":[{"label":"Bias","why":"weight-এর সঙ্গী সংখ্যা","id":"model--linear-regression--bias"}]}},{"id":"model--logistic-regression--bias","name":"Bias","definition":"Weighted sum-এর সঙ্গে যোগ হওয়া শেখা মান।","insight":{"fact":"Input শূন্য হলেও output শূন্য হওয়া বাধ্যতামূলক নয়—bias সেই স্বাধীনতা দেয়। এই গাণিতিক bias আর data-র সামাজিক পক্ষপাত একই অর্থ নয়।"},"lessons":[{"k":"M02 · L01","t":"Linear Regression: Prediction, Weight ও Bias","h":"module-02-linear-regression/lecture-01-prediction-weight-and-bias.md"},{"k":"M09 · L02","t":"Parameters: Model-এর শেখা মান","h":"module-09-model-architecture/lecture-02-parameters-and-hyperparameters.md"}],"story":{"problem":"সব input শূন্য হলেও উত্তর শূন্য হওয়ার কথা নয়। একটা শুরুর মান দরকার।","idea":"weighted sum-এর সঙ্গে একটা শেখা সংখ্যা যোগ হয়, সেটা bias। এটা রেখাকে ওপরে-নিচে সরিয়ে ঠিক জায়গায় বসায়।","next":[{"label":"Weighted Sum","why":"দুটো মিলে হিসাব","id":"model--linear-regression--weighted-sum"}]}},{"id":"model--logistic-regression--sigmoid","name":"Sigmoid","definition":"একটি score-কে ০ ও ১-এর মাঝের মানে রূপান্তর করে; binary classification-এ ব্যবহৃত হয়।","insight":{"fact":"একটি score থেকে probability-সদৃশ সংখ্যা পেতে সুবিধা হয়। কিন্তু output ০.৯ হলেই model বাস্তবে ৯০% ক্ষেত্রে ঠিক—এমন নিশ্চয়তা নেই; calibration যাচাই দরকার।"},"lessons":[{"k":"M03 · L01","t":"Sigmoid: যেকোনো score-কে 0 থেকে 1-এর probability বানানো","h":"module- gression","when":"দুটো উত্তরের একটা, আর কারণ বোঝাতে হবে","why":"সম্ভাবনা দেয়, ব্যাখ্যা সহজ","id":"model--logistic-regression"},{"label":"Softmax Regression","when":"অনেক দল (যেমন ১০টা অক্ষর)","why":"প্রতি দলের জন্য একটা probability","id":"softmax-regression"},{"label":"Tree Ensemble","when":"table data, সীমানা বাঁকা","why":"বাঁক ধরতে পারে","id":"tree-ensemble"}],"history":[{"y":"১৯৪৪","t":"Joseph Berkson 'logit' শব্দ চালু করেন এবং logistic regression-কে সাধারণ statistical model হিসেবে গড়ে তোলায় বড় ভূমিকা রাখেন।","s":"Wikipedia: Logistic regression","u":"https://en.wikipedia.org/wiki/Logistic_regression"},{"y":"১৯৫৮","t":"D. R. Cox 'The regression analysis of binary sequences' প্রকাশ করেন (Journal of the Royal Statistical Society B, খণ্ড ২০, পৃ. ২১৫–২৪২), যা দুই-উত্তরের (binary) logistic regression নিয়ে।","s":"Wikipedia: David Cox","u":"https://en.wikipedia.org/wiki/David_Cox_(statistician)"}]},{"id":"decision-tree","name":"Decision Tree","definition":"ধারাবাহিক শর্ত দিয়ে data ভাগ করে prediction তৈরি করে।","profile":{"why":"একটি সরল রেখায় সব সম্পর্ক ধরা যায় না। Data থেকে if–then ধরনের ভাগ শিখে nonlinear classification বা regression করতে সাহায্য করে।","history":"বহু গবেষণার ফল। CART: Breiman, Friedman, Olshen ও Stone, ১৯৮৪; Quinlan-এর ID3 গবেষণা, ১৯৮৬—দুটি গুরুত্বপূর্ণ milestone।","uses":"টেবিলের data-তে prediction, বোঝানো যায় এমন সিদ্ধান্তের নিয়ম এবং tree ensemble-এর ভিত্তি।","status":"২০২৫: HYDRAVIPER গবেষণায় decision tree দিয়ে একাধিক reinforcement-learning agent-এর সিদ্ধান্ত সমন্বয় করা হয়েছে, যাতে আচরণ ব্যাখ্যা করা সহজ হয়। এটি একটি গবেষণা-ব্যবহার; বাণিজ্যিক deployment-এর দাবি নয়।","sources":[{"title":"বর্তমান official documentation","url":"https://scikit-learn.org/stable/modules/tree.html"},{"title":"HYDRAVIPER, 2025","url":"https://arxiv.org/abs/2505.19316"}],"story":["সব data-কে একটি রেখা দিয়ে বোঝানো কঠিন। আবার prediction-এর কারণটিও মানুষকে দেখাতে হয়। Decision Tree সমস্যা ভাঙে ছোট শর্তে: এই feature এই সীমার ওপরে কি না—তারপর পরের প্রশ্ন।","শর্তের পথ ধরে শেষে leaf-এ পৌঁছে prediction পাওয়া যায়। শেখার সময় model ঠিক করে কোন প্রশ্ন করলে data ভালোভাবে ভাগ হয়। এই পড়তে-পারা নিয়মই tree-কে জটিল model-এর আচরণ ব্যাখ্যা করার কাজেও উপযোগী করে।"],"role":"Decision tree সরাসরি agent-এর সিদ্ধান্তের নিয়ম প্রকাশ করে। এটি neural network-এর weight–bias layer নয়।"},"selection":{"problem":"শর্তভিত্তিক feature সম্পর্ক থেকে class বাছতে চাই।","when":"টেবিলের label আছে; বোঝানো যায় এমন নিয়ম চাইলে ছোট tree, বেশি স্থিতিশীল prediction চাইলে forest।","avoid":"একটি unrestricted tree overfit করতে পারে। Forest সাধারণত পুরো সিদ্ধান্তের পথ সংক্ষেপে বোঝানো কঠিন করে।","compare":"Logistic Regression-এর simplicity বনাম tree-এর nonlinear split তুলনা করো।","example":"গ্রাহকের activity থেকে membership category চেনা; tree দিয়ে কারণের পথও দেখা যায়।"},"children":[{"id":"decision-tree--tree-node","name":"Tree Node","definition":"Decision tree-এর একটি বিন্দু; ভেতরের node-এ শর্ত পরীক্ষা হয়।","insight":{"fact":"Root-ও একটি node, leaf-ও একটি node। তবে প্রশ্ন করে সাধারণত ভেতরের node; leaf ফল দেয়। নামগুলো একই গাছের ভিন্ন ভূমিকা বোঝায়।"},"story":{"problem":"গাছের প্রতিটা জায়গায় কী ঘটে?","idea":"ভেতরের node-এ একটা শর্ত পরীক্ষা হয়, আর শেষের node-এ (leaf) উত্তর থাকে।"}},{"id":"decision-tree--split","name":"Split","definition":"কোনো feature-এর ভিত্তিতে data ভাগ করার নিয়ম।","insight":{"fact":"আয়তন দিয়ে আগে ভাগ করলে লাভ হতে পারে, আবার অন্য dataset-এ ঘরের সংখ্যা ভালো হতে পারে। Tree নিজেই training data থেকে feature ও threshold বেছে নেয়।"},"story":{"problem":"data-কে কোন প্রশ্ন দিয়ে ভাগ করব?","idea":"একটা feature আর একটা সীমা (threshold) দিয়ে দুই ভাগ। tree নিজেই training data দেখে সবচেয়ে কাজের প্রশ্ন বাছে।"}},{"id":"decision-tree--branch","name":"Branch","definition":"শর্তের ফল অনুযায়ী tree-তে যাওয়ার পথ।","insight":{"fact":"একটি branch একটি শর্তের ফলের পথ। সাধারণ binary tree-তে প্রতিটি split-এর দুই পথ; সব ধরনের tree-তে পথের সংখ্যা দুই হতে হবে না।"},"story":{"problem":"প্রশ্নের উত্তর অনুযায়ী পরের ধাপ কোথায়?","idea":"প্রশ্নের ফল (হ্যাঁ/না) অনুযায়ী যে পথে নেমে যাওয়া হয়, সেটাই  ২০২৫ GEDI Science Team Meeting প্রতিবেদনে random forest দিয়ে satellite/forest data থেকে গাছের canopy-এর বিভিন্ন উচ্চতার profile অনুমানের কাজ বর্ণিত হয়েছে।","sources":[{"title":"Breiman-এর papers","url":"https://www.stat.berkeley.edu/~breiman/papers.html"},{"title":"বর্তমান official documentation","url":"https://scikit-learn.org/stable/modules/ensemble.html"},{"title":"NASA: 2025 GEDI meeting","url":"https://science.nasa.gov/science-research/earth-science/summary-of-the-2025-gedi-science-team-meeting/"}],"story":["একটি tree সহজে বোঝা গেলেও training data একটু বদলালে তার প্রশ্নের ক্রম অনেক বদলাতে পারে। তখন ধারণা আসে: একটি tree-এর ওপর নির্ভর না করে অনেক tree-এর ফল মেলানো যাক।","Bagging ভিন্ন sample-এ model শিখিয়ে ফল মেলায়; random forest-এ feature বাছাইয়েও randomness আসে। Boosting-এর ধারা আবার আগের ভুল কমাতে পরের tree যোগ করে। এগুলো একই পরিবারের ভিন্ন উপায়, একই algorithm নয়।"],"role":"এখানে ensemble নিজেই prediction model; শুধু অন্য model-এর ছোট component নয়।"},"selection":{"problem":"একটি tree-এর অস্থিরতা বা সীমিত accuracy কমিয়ে tabular prediction চাই।","when":"অনেক feature-এর interaction আছে; regression বা classification-এর শক্তিশালী baseline দরকার।","avoid":"একটি ছোট tree-এর মতো সহজে ব্যাখ্যা করা যায় না; raw text/image-এ representation ছাড়া সরাসরি প্রথম পছন্দ নাও হতে পারে।","compare":"Linear model-এর তুলনায় validation উন্নতি বনাম latency, memory ও ব্যাখ্যার খরচ মাপো।","example":"বাড়ির দাম: আয়তন, বয়স, এলাকা একসঙ্গে কাজ করছে—forest বা boosting পরীক্ষা করো।"},"children":[{"id":"tree-ensemble--base-model","name":"Base Model","definition":"Ensemble-এর ভেতরের একটি পৃথক model।","insight":{"fact":"Ensemble-এর base model সবসময় tree নয়। আলাদা ধরনের model-এর ফলও একসঙ্গে মেলানো যায়।"},"story":{"problem":"ensemble বানাতে ছোট ছোট model লাগে।","idea":"ensemble-এর ভেতরের প্রতিটা আলাদা model। প্রায়ই ছোট গাছ, কিন্তু সবসময় গাছ নয়।"}},{"id":"tree-ensemble--aggregation","name":"Aggregation","definition":"একাধিক model-এর ফল মেলানোর নিয়ম; যেমন vote, average বা weighted sum।","insight":{ ised Learning: K-Means","h":"module-01-ml-fundamentals-and-math-basics/lecture-04-how-unsupervised-learning-works.md"}],"story":{"problem":"কোনো উত্তর (label) নেই, শুধু অনেক data। এদের মধ্যে স্বাভাবিক দল আছে কি না, থাকলে কীভাবে ভাগ হবে?","idea":"দলের সংখ্যা k আগে ঠিক করে k-টা কেন্দ্র (centroid) দিয়ে শুরু। প্রতিটা বিন্দু কাছের কেন্দ্রের দলে যায়, তারপর কেন্দ্র সরে দলের গড়ে আসে। এভাবে ঘুরতে ঘুরতে দল থিতু হয়।","next":[{"label":"DBSCAN — ঘনত্বভিত্তিক","why":"দলের সংখ্যা জানা না থাকলে বা আকার গোল না হলে","id":"dbscan"}]},"choose":[{"label":"K-Means","when":"দলের সংখ্যা মোটামুটি জানি, দল গোল","why":"সরল ও দ্রুত","id":"model--k-means"},{"label":"DBSCAN — ঘনত্বভিত্তিক","when":"দলের সংখ্যা জানি না, আকার বাঁকা","why":"ঘনত্ব দেখে দল খোঁজে","id":"dbscan"}],"history":[{"y":"১৯৫৭","t":"Bell Labs-এর Stuart Lloyd pulse-code modulation-এর জন্য এই পদ্ধতি প্রস্তাব করেন; জার্নালে ছাপা হয় ১৯৮২ সালে।","s":"Wikipedia: K-means","u":"https://en.wikipedia.org/wiki/K-means_clustering"},{"y":"১৯৬৭","t":"James MacQueen প্রথম 'k-means' নামটা ব্যবহার করেন।","s":"Wikipedia: K-means","u":"https://en.wikipedia.org/wiki/K-means_clustering"}]},{"id":"neural-network","name":"Neural Network","definition":"যুক্ত computational unit ও layer দিয়ে input থেকে output হিসাব করে; সংযোগের মান training-এ শেখে।","profile":{"why":"হাতে সব feature ও নিয়ম লেখা কঠিন। বহু শেখা unit একত্র করে জটিল সম্পর্ক ও representation শেখানো যায়।","history":"একক আবিষ্কার নয়। Rosenblatt-এর perceptron (১৯৫৮), এবং Rumelhart, Hinton ও Williams-এর backpropagation গবেষণা (১৯৮৬) গুরুত্বপূর্ণ milestone।","uses":"ছবি, ভাষা ও শব্দের কাজ; নির্দিষ্ট কাজের জন্য CNN, RNN, Transformer-এর মতো architecture ব্যবহার হয়।","status":"২০২৫: Gemma 3 report-এ ভাষা এবং বড় সংস্করণগুলোতে image-text কাজের neural model প্রকাশ করা হয়েছে।","sources":[{"title":"Perceptron, 1958","url":"https://ieeexplore.ieee.org/document/9357585"},{"title":"Backpropagation, 1986","url":"https://doi.org/10.1038/323533a0"},{"title":"Gemma 3, 2025","url":"https://arxiv.org/abs/250  অনেক ছোট ছোট হিসাব জুড়লে অনেক কিছু ধরা যায়।","idea":"unit হলো সেই ছোট হিসাব: input নেয়, weighted sum + bias করে, activation দিয়ে বাঁক আনে, ফল পরের অংশে পাঠায়। অনেক unit মিলে network।","next":[{"label":"Layer","why":"unit-গুলো কীভাবে সাজানো হয়","id":"layer"}]}},{"id":"general-structure--hidden-layer--linear-dense-layer","name":"Linear / Dense Layer","definition":"Input-এর weighted sum তৈরি করে; bias থাকতে পারে। Dense layer-এ প্রতিটি output সব input-এর সঙ্গে যুক্ত।","insight":{"fact":"একটি dense layer input-এর সংখ্যা থেকে output-এর সংখ্যা বদলাতে পারে। কিন্তু অনেক linear layer একত্র করলেই nonlinear model হয় না—activation-এর ভূমিকা সেখানেই।"},"children":[{"id":"general-structure--hidden-layer--linear-dense-layer--weight","name":"Weight","definition":"Input বা মধ্যবর্তী মানের প্রভাব নিয়ন্ত্রণকারী শেখা গুণক।","insight":{"fact":"Weight ঋণাত্মকও হতে পারে। Input বাড়লে output কমার সম্পর্কও তাই শেখা যায়; তবে বড় weight দেখেই feature বেশি গুরুত্বপূর্ণ বলা যায় না, input-এর scale-ও দেখতে হয়।"},"lessons":[{"k":"M02 · L01","t":"Linear Regression: Prediction, Weight ও Bias","h":"module-02-linear-regression/lecture-01-prediction-weight-and-bias.md"},{"k":"M09 · L02","t":"Parameters: Model-এর শেখা মান","h":"module-09-model-architecture/lecture-02-parameters-and-hyperparameters.md"}],"story":{"problem":"সব input সমান গুরুত্বের নয়। বাড়ির দামে আয়তনের প্রভাব বেশি, দেয়ালের রঙের কম।","idea":"প্রতিটা input-এর সঙ্গে একটা গুণক বসে, সেটা weight। বড় weight মানে বেশি প্রভাব। training-এ এই গুণকগুলোই শেখা হয়।","next":[{"label":"Bias","why":"weight-এর সঙ্গী সংখ্যা","id":"model--linear-regression--bias"}]}},{"id":"general-structure--hidden-layer--linear-dense-layer--bias","name":"Bias","definition":"Weighted sum-এর সঙ্গে যোগ হওয়া শেখা মান।","insight":{"fact":"Input শূন্য হলেও output শূন্য হওয়া বাধ্যতামূলক নয়—bias সেই স্বাধীনতা দেয়। এই গাণিতিক bias আর data-র সামাজিক পক্ষপাত একই অর্থ নয়।"},"lessons":[{"k":"M02 · L01","t":"Linear Regression: Prediction, Weight ও Bias","h":"module-02-linear-regression/lecture-01-prediction-weight-and-bias.md"},{"k":"M09 · L02","t":"Parameters: Model-এর শেখা মান","h":"module-09-model-architecture/lecture-02-parameters-and-hyperparameters.md"}],"story":{"problem":"সব input শূন্য হলেও উত্তর শূন্য হওয়ার কথা নয়। একটা শুরুর মান দরকার।","idea":"weighted sum-এর সঙ্গে একটা শেখা সংখ্যা যোগ হয়, সেটা bias। এটা রেখাকে ওপরে-নিচে সরিয়ে ঠিক জায়গায় বসায়।","next":[{"label":"Weighted Sum","why":"দুটো মিলে হিসাব","id":"model--linear-regression--weighted-sum"}]}},{"id":"general-structure--hidden-layer--linear-dense-layer--weighted-sum","name":"Weighted Sum","definition":"প্রতিটি মানকে তার weight দিয়ে গুণ করে ফলগুলো যোগ করা।","insight":{"fact":"শুধু weight দিয়ে গুণ ও যোগ করলে ফল এখনও linear ধরনের হিসাব। অনেকগুলো এমন layer পরপর দিলেও nonlinear activation ছাড়া নতুন nonlinear সম্পর্ক তৈরি হয় না।"},"lessons":[{"k":"M02 · L04","t":"অনেকগুলো Feature ও Dot Product","h":"module-02-linear-regression/lecture-04-many-features-and-dot-product.md"},{"k":"M09 · L03","t":"একটি Unit: কয়েকটি input থেকে একটি ফল","h":"module-09-model-architecture/lecture-03-one-neuron.md"}],"story":{"problem":"অনেকগুলো input থেকে একটাই সংখ্যা বানাতে হবে, আর প্রতিটার প্রভাব আলাদা।","idea":"প্রতিটা input-কে তার weight দিয়ে গুণ করো, সব গুণফল যোগ করো। এটাই প্রায় সব model-এর মূল হিসাব।","next":[{"label":"Unit / Neuron","why":"এই হিসাব দিয়ে unit","id":"general-structure--hidden-layer--unit-neuron"}]}}],"lessons":[{"k":"M09 · L05","t":"পাশাপাশি Unit ও পরপর Layer","h":"module-09-model-architecture/lecture-05-hidden-layer.md"},{"k":"M09 · L07","t":"Shape ও Parameter Count","h":"module-09-model-architecture/lecture-07-shapes-and-parameter-count.md"}],"story":{"problem":"প্রতিটা input থেকে প্রতিটা output-এ যোগ রাখতে চাই।","idea":"প্রতিটা output unit সব input-এর weighted sum + bias নেয়। neural network-এর সবচেয়ে সরল পাথর।"}},{"id":"general-structure--hidden-layer--activation","name":"Activation","definition":"হিসাবের ফলের ওপর প্রয়োগ করা function; nonlinear activation জটিল সম্পর্ক প্রকাশ করতে সাহায্য করে।","insight":{"fact":"সব layer একই সরল হিসাব করলে গভীর করেও সম্পর্কের ধরন বদলাত না। Nonlinear activation সেই বাধা কাটায়।"},"children":[{"id":"general-structure--hidden-layer--activation--relu","name":"ReLU","definition":"ঋণাত্মক মানকে শূন্য করে, অন্য মান অপরিবর্তিত রাখে।","insight":{"fact":"ঋণাত্মক input-এ ReLU-এর output শূন্য। কোনো unit সব relevant input-এ এই অংশে পড়ে থাকলে শেখা আটকে যেতে পারে—একে প্রায়ই dying ReLU বলা হয়।"},"lessons":[{"k":"M09 · L04","t":"Activation: Score-কে বদলে নেওয়া","h":"module-09-model-architecture/lecture-04-activation.md"}],"story":{"problem":"activation সরল, দ্রুত আর gradient সহজে বয়ে নেওয়ার মতো চাই।","idea":"ঋণাত্মক মান ০, ধনাত্মক মান যেমন আছে তেমন। হিসাব ছোট, আর ধনাত্মক দিকে gradient নষ্ট হয় না।"}},{"id":"general-structure--hidden-layer--activation--gelu-silu","name":"GELU / SiLU","definition":"মসৃণ nonlinear activation; আধুনিক network-এর hidden layer-এ ব্যবহৃত হয়।","insight":{"fact":"ReLU-এর মতো সব ঋণাত্মক মান একেবারে কেটে দেয় না; মসৃণভাবে scale করে। নাম কাছাকাছি হলেও GELU ও SiLU একই formula নয়।","history":"Hendrycks ও Gimpel-এর ২০১৬ GELU paper মসৃণ activation নিয়ে গবেষণার একটি milestone। GELU ও SiLU আলাদা function—এই সালকে দুটোর একক আবিষ্কার-সাল ধরা হয়নি।","sources":[{"title":"GELU, 2016","url":"https://arxiv.org/abs/1606.08415"}]},"story":{"problem":"ReLU-র তীক্ষ্ণ কোণ মসৃণ করা যায় কি?","idea":"নেতিবাচক দিকে সামান্য সংকেত রেখে মসৃণ বাঁক। বড় Transformer-জাতীয় model-এ বেশি দেখা যায়।"}},{"id":"general-structure--hidden-layer--activation--sigmoid","name":"Sigmoid","definition":"একটি score-কে ০ ও ১-এর মাঝের মানে রূপান্তর করে; binary classification-এ ব্যবহৃত হয়।","insight":{"fact":"একটি score থেকে probability-সদৃশ সংখ্যা পেতে সুবিধা হয়। কিন্তু output ০.৯ হলেই model বাস্তবে ৯০% ক্ষেত্রে ঠিক—এমন নিশ্চয়তা নেই; calibration যাচাই দরকার।"},"lessons":[{"k":"M03 · L01","t":"Sigmoid: যেকোনো score-কে 0 থেকে 1-এর probability বানানো","h":"module-03-logistic-regression/lecture-01-sigmoid.md"},{"k":"M09 · L04","t":"Activation: Score-কে বদলে নেওয়া","h":"module-09-model-architecture/lecture-04-activation.md"}],"story":{"problem":"সোজা রেখার ফল যেকোনো সংখ্যা, অথচ probability হতে হবে ০ থেকে ১-এর মধ্যে।","idea":"sigmoid যেকোনো সংখ্যাকে ০–১-এর মধ্যে চেপে আনে: বড় ধনাত্মক ১-এর কাছে, বড় ঋণাত্মক ০-এর কাছে, শূন্য ঠিক ০.৫। দুই-উত্তরের কাজে ব্যবহৃত।"}},{"id":"general-structure--hidden-layer--activation--softmax","name":"Softmax","definition":"একদল score-কে এমন probability-তে রূপান্তর করে যাদের যোগফল ১।","insight":{"fact":"সব score-এ একই সংখ্যা যোগ করলেও probabilities বদলায় না। তাই কম্পিউটার বড় সংখ্যার সমস্যা এড়াতে প্রায়ই সবচেয়ে বড় score-টি সবার থেকে বাদ দিয়ে হিসাব করে।"},"lessons":[{"k":"M12 · L03","t":"Logits ও Softmax: Score থেকে Probability","h":"module-12-text-sequences-and-multimodal-models/lecture-03-logits-and-softmax.md"}],"story":{"problem":"অনেক দলের প্রতিটার একটা score আছে, কিন্তু আমাদের চাই এমন probability যাদের যোগফল ১।","idea":"প্রতিটা score-এর e-ঘাত নিয়ে মোট দিয়ে ভাগ। বড় score বড় probability পায়। দুই দল হলে এটা sigmoid-এর সমান।"}}],"lessons":[{"k":"M09 · L04","t":"Activation: Score-কে বদলে নেওয়া","h":"module-09-model-architecture/lecture-04-activation.md"}],"story":{"problem":"শুধু weighted sum-এর স্তর বাড়ালে সব মিলে একটা সোজা রেখাই থাকে, জটিলতা আসে না।","idea":"হিসাবের ফলের উপর একটা বাঁকা ফাংশন (nonlinear)। এতে রেখায় বাঁক আসে, তাই অনেক স্তর সত্যিই জটিল সম্পর্ক ধরতে পারে।","next":[{"label":"ReLU","why":"সবচেয়ে প্রচলিত","id":"general-structure--hidden-layer--activation--relu"},{"label":"Sigmoid","why":"০–১-এর probability দরকার হলে","id":"model--logistic-regression--sigmoid"}]},"choose":[{"label":"ReLU","when":"সাধারণ hidden layer","why":"সরল ও দ্রুত","id":"general-structure--hidden-layer--activation--relu"},{"label":"GELU / SiLU","when":"আধুনিক বড় model (যেমন Transformer)","why":"মসৃণ বাঁক","id":"general-structure--hidden-layer--activation--gelu-silu"},{"label":"Sigmoid","when":"শেষ layer-এ হ্যাঁ/না probability","why":"০–১-এর মধ্যে চেপে দেয়","id":"model--logistic-regression--sigmoid"},{"label":"Softmax","when":"শেষ layer-এ অনেক দলের probability","why":"মোট ১","id":"model--logistic-regression--softmax"}]}],"lessons":[{"k":"M09 · L05","t":"পাশাপাশি Unit ও পরপর Layer","h":"module-09-model-architecture/lecture-05-hidden-layer.md"}],"story":{"problem":"input থেকে সরাসরি output-এ গেলে জটিল সম্পর্ক ধরা যায় না।","idea":"input আর output-এর মাঝের স্তর। এখানে network নিজের মতো করে কাজের বৈশিষ্ট্য তৈরি করে নেয়।"}},{"id":"output-layer","name":"Output Layer","definition":"শেষ ফল তৈরির layer।","insight":{"fact":"দামের জন্য একটি সংখ্যা, ছবির শ্রেণির জন্য অনেক score—শেষ layer-এর আকার task অনুযায়ী বদলায়। একই backbone-এর ওপর আলাদা output layer বসানো সম্ভব।"},"children":[{"id":"output-layer--task-head","name":"Task Head","definition":"নির্দিষ্ট কাজের output তৈরির শেষ অংশ; এক বা একাধিক layer হতে পারে।","insight":{"fact":"এক model-এ একাধিক head থাকতে পারে: একটি object-এর শ্রেণি বলে, অন্যটি তার অবস্থান। Head-এর সংখ্যা আর attention head-এর সংখ্যা একই ধারণা নয়।"},"lessons":[{"k":"M09 · L10","t":"একাধিক Output: এক score, নাকি কয়েকটা Head?","h":"module-09-model-architecture/lecture-10-multiple-outputs-and-heads.md"}],"story":{"problem":"একই network দিয়ে সংখ্যা, দল, বা লেখা, নানা কাজ করাতে চাই।","idea":"শেষে কাজ অনুযায়ী একটা ছোট অংশ (head): সংখ্যার জন্য সরল unit, দলের জন্য softmax, ইত্যাদি। body একই থাকতে পারে, head বদলায়।"}},{"id":"output-layer--output","name":"Output","definition":"Model-এর হিসাব থেকে পাওয়া ফল।","insight":{"fact":"Model-এর output সবসময় চূড়ান্ত মানুষের-পড়া উত্তর নয়। আগে score বের হতে পারে, তারপর নিয়ম বা decoding দিয়ে শব্দ বা শ্রেণি বাছা হয়।"},"lessons":[{"k":"M09 · L01","t":"Model-এর হিসাব: Input, হিসাব, Output","h":"module-09-model-architecture/lecture-01-input-computation-output.md"}],"story":{"problem":"model হিসাব করে একটা ফল দেবে। ফলটা কী ধরনের হবে, তা কাজের উপর নির্ভর করে।","idea":"output হতে পারে একটা সংখ্যা (দাম), কয়েকটা দলের probability (spam কি না), বা পরের token। কাজ বদলালে output-এর ধরন ও শেষ অংশ বদলায়।"}},{"id":"o meter বাছাই: validation দিয়ে বেছে, test দিয়ে একবার যাচাই","h":"module-07-generalization-and-overfitting/lecture-05-choosing-hyperparameters.md"}],"story":{"problem":"কোন সংখ্যা training শেখে আর কোনটা আমাদের ঠিক করে দিতে হয়?","idea":"parameter (weight, bias) training-এ শেখা হয়। hyperparameter (learning rate, layer-সংখ্যা) আমরা আগে বা পাশাপাশি বেছে দিই, validation দিয়ে যাচাই করি।"}}],"story":{"problem":"model যা শেখে তা কোথায় জমা থাকে?","idea":"weight আর bias-এর সমষ্টি। training-এ এগুলোই বদলায়।"}}]},{"id":"neural-network--architecture","name":"Architecture-এর ধরন","definition":"MLP, CNN, RNN ও Transformer neural architecture-এর পরিচিত ধরন। বহু layer-এর network নিয়ে কাজ করাকে Deep Learning বলা হয়; MLP/CNN/RNN অগভীরও হতে পারে।","insight":{"fact":"CNN স্থানীয় pattern-এর গঠন ব্যবহার করে; RNN ধাপের state রাখে; Transformer Attention দিয়ে তথ্য মেশায়। নাম মুখস্থের চেয়ে কোন হিসাব বদলেছে তা দেখো।"},"children":[{"id":"multilayer-perceptron-mlp","name":"Multilayer Perceptron (MLP)","definition":"পরপর fully connected layer-এর network; এমন layer-এ প্রতিটি unit আগের layer-এর সব output নেয়।","profile":{"why":"এক layer-এর সরল সিদ্ধান্তের সীমা ছাড়িয়ে nonlinear সম্পর্ক শেখা দরকার; hidden layer সেই সুযোগ দেয়।","history":"একক সাল নেই। ১৯৮৬ সালে Rumelhart, Hinton ও Williams-এর গবেষণা multilayer network-এ representation শেখানোকে প্রতিষ্ঠিত করতে গুরুত্বপূর্ণ ভূমিকা রাখে।","uses":"সাধারণ classification/regression; বড় neural model-এর ছোট feed-forward অংশ হিসেবেও ব্যবহৃত হয়।","status":"২০২৪: TimeMixer একটি fully MLP-based time-series forecasting architecture। বিভিন্ন সময়ের scale-এর pattern মিশিয়ে ভবিষ্যতের মান অনুমান করে।","sources":[{"title":"Backpropagation, 1986","url":"https://doi.org/10.1038/323533a0"},{"title":"বর্তমান official documentation","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"},{"title":"TimeMixer, ICLR 2024","url":"https://arxiv.org/abs/2405.14616"}],"story":["একটি সরল unit দিয়ে সব nonlinear সম্পর্ক ধরা যায় না। একাধিক layer ও activation দিয়ে একটি স্তরের তৈরি feature পরের স্তরে রূপান্তর করার সুযোগ আসে—এটাই MLP-এর মূল শক্তি।","MLP শুধু আলাদা classifier নয়। একই ধরনের network বড় architecture-এর মাঝখানেও থাকতে পারে। Transformer-এ Attention token-এর তথ্য মেশানোর পরে FFN সাধারণত প্রতিটি অবস্থানের representation আরও বদলায়।"],"role":"এখানে MLP নতুন forecasting model-এর মূল building block; TimeMixer কেবল সাধারণ একটিমাত্র MLP classifier নয়।"},"selection":{"problem":"স্থির আকারের feature vector থেকে nonlinear prediction চাই।","when":"প্রস্তুত feature/embedding আছে; scaling, data ও tuning-এর ব্যবস্থা আছে।","avoid":"ছবির spatial বা sequence-এর order structure সরাসরি ব্যবহার করে না; ছোট tabular dataset-এ tree baseline শক্তিশালী হতে পারে।","compare":"Table-এ ensemble, image-এ CNN, sequence-এ RNN/Transformer-এর উপযোগিতা তুলনা করো।","example":"আগে তৈরি embedding থেকে category বা সংখ্যামান অনুমান।"},"seq":"১","children":[{"id":"multilayer-perceptron-mlp--feed-forward-network-ffn","name":"Feed-forward Network (FFN)","definition":"সামনে এগোনো সংযোগের network; recurrent feedback loop থাকে না।","insight":{"fact":"Feed-forward মানে forward computation-এ recurrent loop নেই। Training-এর সময় backpropagation ব্যবহার করা যায়—তাতে এটি recurrent network হয়ে যায় না।","history":"MLP-এর দীর্ঘ ইতিহাসের পরে একই ধরনের FFN Transformer-এর block-এও ব্যবহৃত হয়। ২০২৪ সালের TimeMixer আবার MLP-ভিত্তিক forecasting-এর উদাহরণ দেয়।","sources":[{"title":"TimeMixer, 2024","url":"https://arxiv.org/abs/2405.14616"}]},"children":[{"id":"multilayer-perceptron-mlp--feed-forward-network-ffn--linear-dense-layer","name":"Linear / Dense Layer","definition":"Input-এর weighted sum তৈরি করে; bias থাকতে পারে। Dense layer-এ প্রতিটি output সব input-এর সঙ্গে যুক্ত।","insight":{"fact":"একটি dense layer input-এর সংখ্যা থেকে output-এর সংখ্যা বদলাতে পারে। কিন্তু অনেক linear layer একত্র করলেই nonlinear model হয় না—activation-এর ভূমিকা সেখানেই।"},"children":[{"id":"multilayer-perceptron-mlp--feed-forward-network-ffn--linear-dense-layer--weight","name":"Weight","defini iv.org/abs/2301.00808"}],"story":["ছবির একটি রেখা বা বাঁক ডানে-বামে সরলেও সেটি একই pattern। প্রত্যেক অবস্থানের জন্য আলাদা weight শিখলে অনেক parameter লাগে। Convolution একই filter বিভিন্ন স্থানে চালিয়ে এই সমস্যা কমায়।","হাতের লেখা postal code চেনার মতো কাজে এই গঠন বাস্তব সুবিধা দেখায়। পরে network গভীর হয়, সংযোগ ও training বদলায়; কিন্তু স্থানীয় pattern এবং shared filter-এর ধারণা থেকে যায়।"],"role":"ConvNeXt V2 হলো আধুনিক CNN family। এটি যাচাই করা নির্দিষ্ট উদাহরণ; সর্বশেষ CNN দাবি নয়।"},"selection":{"problem":"ছবির স্থানীয় edge, texture ও shape থেকে class বা অন্য visual ফল চাই।","when":"Image data, উপযুক্ত pretrained CNN এবং স্থানীয় pattern গুরুত্বপূর্ণ।","avoid":"অল্প image data-তে শুরু থেকে বড় CNN শেখানো কঠিন; শুধু head বদলালেই সব domain shift মিটবে না।","compare":"Pretrained CNN ও vision Transformer-এর validation accuracy, memory ও latency তুলনা করো।","example":"ফুলের ছবি → ফুলের প্রজাতি; pretrained CNN-এর ওপর ছোট classifier দিয়ে শুরু করা যায়।"},"seq":"২","children":[{"id":"convolutional-neural-network-cnn--convolution","name":"Convolution","definition":"একই filter বিভিন্ন স্থানে প্রয়োগ করে স্থানীয় pattern বের করা operation।","insight":{"fact":"এক filter ছবির বহু জায়গায় চলায় weight পুনর্ব্যবহার হয়। তাই ছবির width বাড়লেই সেই filter-এর parameter সংখ্যা বাড়াতে হয় না।","history":"LeCun ও সহকর্মীদের ১৯৮৯ handwritten ZIP-code recognition কাজে learned filter ও shared weight-ভিত্তিক গঠনের ব্যবহার দেখা যায়। এটি CNN-এর গুরুত্বপূর্ণ milestone।","sources":[{"title":"Handwritten ZIP codes, 1989","url":"https://henriquetmaia.github.io/pdf/papers/lecun1989.pdf"}]},"children":[{"id":"convolutional-neural-network-cnn--convolution--filter-kernel-cnn","name":"Filter / Kernel (CNN)","definition":"Convolution-এ ব্যবহৃত weight-এর ছোট সমষ্টি।","insight":{"fact":"Filter সাধারণত training-এ শেখে; মানুষকে সব edge detector হাতে বানাতে হয় না। ছোট filter-গুলো বহু layer জুড়ে বড় অঞ্চলের তথ্যও একত্র করতে পারে।","history":"LeCun ও সহকর্মীদের ১৯৮৯ handwritten ZIP-code recognition কাজে learned filter ও shared weight-ভিত্তিক গঠনের ব্যবহার দেখা যায়। এটি CNN-এর গুরুত্বপূর্ণ milestone।","sources":[{"title":"Handwritten ZIP codes, 1989","url":"https://henriquetmaia.github.io/pdf/papers/lecun1989.pdf"}]},"lessons":[{"k":"M11 · L03","t":"Local Pattern ও Convolution","h":"module-11-image-representation-and-vision/lecture-03-local-pattern-and-convolution.md"},{"k":"M11 · L04","t":"Feature Map","h":"module-11-image-representation-and-vision/lecture-04-feature-map.md"}],"story":{"problem":"কোন নকশা খুঁজব, তা-ও তো শিখতে হবে।","idea":"convolution-এ ব্যবহৃত weight-এর ছোট সমষ্টি (যেমন ৩×৩)। training-এ filter-এর মানই শেখা হয়। SVM-এর kernel থেকে এটা আলাদা জিনিস।"}}],"lessons":[{"k":"M11 · L03","t":"Local Pattern ও Convolution","h":"module-11-image-representation-and-vision/lecture-03-local-pattern-and-convolution.md"},{"k":"M11 · L04","t":"Feature Map","h":"module-11-image-representation-and-vision/lecture-04-feature-map.md"}],"story":{"problem":"একই নকশা (কিনারা) ছবির যেকোনো জায়গায় থাকতে পারে। প্রতি জায়গার জন্য আলাদা weight লাগালে অনেক parameter।","idea":"একটা ছোট filter ছবির উপর ঘুরিয়ে একই weight সব জায়গায় প্রয়োগ। জায়গা বদলালেও একই নকশা ধরা পড়ে।"}},{"id":"convolutional-neural-network-cnn--activation","name":"Activation","definition":"হিসাবের ফলের ওপর প্রয়োগ করা function; nonlinear activation জটিল সম্পর্ক প্রকাশ করতে সাহায্য করে।","insight":{"fact":"সব layer একই সরল হিসাব করলে গভীর করেও সম্পর্কের ধরন বদলাত না। Nonlinear activation সেই বাধা কাটায়।"},"children":[{"id":"convolutional-neural-network-cnn--activation--relu","name":"ReLU","definition":"ঋণাত্মক মানকে শূন্য করে, অন্য মান অপরিবর্তিত রাখে।","insight":{"fact":"ঋণাত্মক input-এ ReLU-এর output শূন্য। কোনো unit সব relevant input-এ এই অংশে পড়ে থাকলে শেখা আটকে যেতে পারে—একে প্রায়ই dying ReLU বলা হয়।"},"lessons":[{"k":"M09 · L04","t":"Activation: Score-কে বদলে নেওয়া","h":"module-09-model-architecture/lecture-04-activation.md"}],"story":{"problem":"activation সরল, দ্রুত আর gradient সহজে বয়ে নেওয়ার মতো চাই।","idea":"ঋণাত্মক মান ০, ধনাত্মক মান যেমন আছে তেমন। হিসাব ছোট, আর ধনাত্মক দিকে gradient নষ্ট হয় না।"}},{"id":"convolutional-neural-network-cnn--activation--gelu-silu","name":"GELU / SiLU","definition":"মসৃণ nonlinear activation; আধুনিক network-এর hidden layer-এ ব্যবহৃত হয়।","insight":{"fact":"ReLU-এর মতো সব ঋণাত্মক মান একেবারে কেটে দেয় না; মসৃণভাবে scale করে। নাম কাছাকাছি হলেও GELU ও SiLU একই formula নয়।","history":"Hendrycks ও Gimpel-এর ২০১৬ GELU paper মসৃণ activation নিয়ে গবেষণার একটি milestone। GELU ও SiLU আলাদা function—এই সালকে দুটোর একক আবিষ্কার-সাল ধরা হয়নি।","sources":[{"title":"GELU, 2016","url":"https://arxiv.org/abs/1606.08415"}]},"story":{"problem":"ReLU-র তীক্ষ্ণ কোণ মসৃণ করা যায় কি?","idea":"নেতিবাচক দিকে সামান্য সংকেত রেখে মসৃণ বাঁক। বড় Transformer-জাতীয় model-এ বেশি দেখা যায়।"}},{"id":"convolutional-neural-network-cnn--activation--sigmoid","name":"Sigmoid","definition":"একটি score-কে ০ ও ১-এর মাঝের মানে রূপান্তর করে; binary classification-এ ব্যবহৃত হয়।","insight":{"fact":"একটি score থেকে probability-সদৃশ সংখ্যা পেতে সুবিধা হয়। কিন্তু output ০.৯ হলেই model বাস্তবে ৯০% ক্ষেত্রে ঠিক—এমন নিশ্চয়তা নেই; calibration যাচাই দরকার।"},"lessons":[{"k":"M03 · L01","t":"Sigmoid: যেকোনো score-কে 0 থেকে 1-এর probability বানানো","h":"module-03-logistic-regression/lecture-01-sigmoid.md"},{"k":"M09 · L04","t":"Activation: Score-কে বদলে নেওয়া","h":"module-09-model-architecture/lecture-04-activation.md"}],"story":{"problem":"সোজা রেখার ফল যেকোনো সংখ্যা, অথচ probability হতে হবে ০ থেকে ১-এর মধ্যে।","idea":"sigmoid যেকোনো সংখ্যাকে ০–১-এর মধ্যে চেপে আনে: বড় ধনাত্মক ১-এর কাছে, বড় ঋণাত্মক ০-এর কাছে, শূন্য ঠিক ০.৫। দুই-উত্তরের কাজে ব্যবহৃত।"}},{"id":"convolutional-neural-network-cnn--activation--softmax","name":"Softmax","definition":"একদল score-কে এমন probability-তে রূপান্তর করে যাদের যোগফল ১।","insight":{"fact":"সব score-এ একই সংখ্যা যোগ করলেও probabilities বদলায় না। তাই কম্পিউটার বড় সংখ্যার সমস্যা এড়াতে প্রায়ই সবচেয়ে বড় score-টি সবার থেকে বাদ দিয়ে হিসাব করে।"},"lessons":[{"k":"M12 · L03","t":"Logits ও Softmax: Score থেকে Probability","h":"module-12-text-sequences-and-multimodal-models/lecture-03-logits-and-softmax.md"}],"story":{"problem":"অনেক দলের প্রতিটার একটা score আছে, কিন্তু আমাদের চাই এমন probability যাদের যোগফল ১।","idea":"প্রতিটা score-এর e-ঘাত নিয়ে মোট দিয়ে ভাগ। বড় score বড় probability পায়। দুই দল হলে এটা sigmoid-এর সমান।"}}],"lessons":[{"k":"M09 · L04","t":"Activation: Score-কে বদলে নেওয়া","h":"module-09-model-architecture/lecture-04-activation.md"}],"story":{"problem":"শুধু weighted sum-এর স্তর বাড়ালে সব মিলে একটা সোজা রেখাই থাকে, জটিলতা আসে না।","idea":"হিসাবের ফলের উপর একটা বাঁকা ফাংশন (nonlinear)। এতে রেখায় বাঁক আসে, তাই অনেক স্তর সত্যিই জটিল সম্পর্ক ধরতে পারে।","next":[{"label":"ReLU","why":"সবচেয়ে প্রচলিত","id":"general-structure--hidden-layer--activation--relu"},{"label":"Sigmoid","why":"০–১-এর probability দরকার হলে","id":"model--logistic-regression--sigmoid"}]},"choose":[{"label":"ReLU","when":"সাধারণ hidden layer","why":"সরল ও দ্রুত","id":"general-structure--hidden-layer--activation--relu"},{"label":"GELU / SiLU","when":"আধুনিক বড় model (যেমন Transformer)","why":"মসৃণ বাঁক","id":"general-structure--hidden-layer--activation--gelu-silu"},{"label":"Sigmoid","when":"শেষ layer-এ হ্যাঁ/না probability","why":"০–১-এর মধ্যে চেপে দেয়","id":"model--logistic-regression--sigmoid"},{"label":"Softmax","when":"শেষ layer-এ অনেক দলের probability","why":"মোট ১","id":"model--logistic-regression--softmax"}]},{"id":"common-extras","name":"প্রচলিত অতিরিক্ত অংশ","definition":"CNN-এর কাজ ও architecture অনুযায়ী এসব অংশ থাকে।","insight":{"fact":"Pooling ও normalization সুবিধাজনক হলেও সব CNN-এ বাধ্যতামূলক নয়। একটি diagram দেখে সব architecture-এর স্থায়ী নিয়ম বানানো ঠিক নয়।"},"children":[{"id":"common-extras--pooling","name":"Pooling","definition":"একটি অঞ্চলের মানগুলো থেকে সংক্ষিপ্ত মান তৈরি; যেমন সর্বোচ্চ বা গড় মান।","insight":{"fact":"Max pooling শক্তিশালী মান রাখে, average pooling গড় রাখে। এতে আকার ছোট হয়, কিন্তু কিছু সূক্ষ্ম অবস্থানের তথ্যও হারায়।"},"story":{"problem":"feature map বড়; আর নকশা সামান্য সরলেও একই বস্তু।","idea":"একটা ছোট অঞ্চলের মান থেকে একটা সংক্ষিপ্ত মান (সর্বোচ্চ বা গড়)। আকার কমে, সামান্য সরে যাওয়ায় প্রভাব কমে।"}},{"id":"common-extras--normalization","name":"Normalization","definition":"নির্দিষ্ট নিয়মে মধ্যবর্তী মানের scale সামঞ্জস্য করা; training স্থিতিশীল রাখতে সাহায্য করে।","insight":{"fact":"Input data scaling ও network-এর ভেতরের normalization সম্পর্কিত হলেও একই operation নয়। কোন অক্ষ বরাবর কোন পরিসংখ্যান নেওয়া হচ্ছে, সেটিই ধরন আলাদা করে।"},"children":[{"id":"common-extras--normalization--layernorm","name":"LayerNorm","definition":"প্রতিটি উদাহরণ বা token-এর নির্দিষ্ট feature dimension জুড়ে mean ও variance ব্যবহার করে normalization।","insight":{"fact":"প্রতিটি উদাহরণ বা token-এর feature-গুলোর মধ্যে হিসাব করে। তাই একটি উদাহরণের normalization সরাসরি পাশের batch-এর উদাহরণগুলোর ওপর নির্ভর করতে হয় না।","history":"Ba, Kiros ও Hinton-এর ২০১৬ সালের Layer Normalization paper batch-এর বদলে এক training case-এর feature জুড়ে normalization প্রস্তাব করে।","sources":[{"title":"Layer Normalization, 2016","url":"https://arxiv.org/abs/1607.06450"}]},"lessons":[{"k":"M12 · L06","t":"Transformer Block: Attention-এর সঙ্গে বাকি অংশ","h":"module-12-text-sequences-and-multimodal-models/lecture-06-transformer-block.md"}],"story":{"problem":"batch ছোট বা বদলায়, তবু normalization চাই।","idea":"প্রতিটা উদাহরণের নিজের feature-গুলোর গড় ও ছড়ানো দিয়ে normalize।"}},{"id":"common-extras--normalization--rmsnorm","name":"RMSNorm","definition":"Mean বাদ না দিয়ে root-mean-square অনুযায়ী scale সামঞ্জস্য করা normalization।","insight":{"fact":"LayerNorm-এর mean বাদ দেওয়ার ধাপটি সরিয়েও কাজে লাগতে পারে—এই প্রশ্ন থেকে সরলতর normalization। সব normalization-এর জন্য একই ধাপ দরকার নয়।","history":"Zhang ও Sennrich ২০১৯ সালে mean সরানোর ধাপ ছাড়াই RMS দিয়ে scale ঠিক করার সহজতর পদ্ধতি পরীক্ষা করেন।","sources":[{"title":"RMSNorm, 2019","url":"https://arxiv.org/abs/1910.07467"}]},"story":{"problem":"LayerNorm-এর গড় বাদ দেওয়ার অংশ কি দরকার?","idea":"গড় বাদ না দিয়ে শুধু মানের মাপ (root mean square) দিয়ে ভাগ। সরল ও সস্তা।"}},{"id":"common-extras--normalization--batchnorm","name":"BatchNorm","definition":"Training-এ batch-এর পরিসংখ্যান ব্যবহার করে normalization; inference-এ সাধারণত সংরক্ষিত পরিসংখ্যান নেয়।","insight":{"fact":"Training-এ batch-এর পরিসংখ্যান, inference-এ সাধারণত running statistics ব্যবহার হয়। ফলে train/eval mode ভুল হলে একই input-এ অপ্রত্যাশিত ফল আসতে পারে।","history":"Ioffe ও Szegedy-এর ২০১৫ সালের গবেষণা deep network training দ্রুত ও স্থিতিশীল করার জন্য Batch Normalization নিয়ে আসে।","sources":[{"title":"Batch Normalization, 2015","url":"https://arxiv.org/abs/1502.03167"}]},"story":{"problem":"layer-এর বণ্টন training-এর সময় বদলাতে থাকে।","idea":"পুরো batch-এর গড় ও ছড়ানো দিয়ে normalize। inference-এ training-এর জমা-করা গড় ব্যবহার হয়।"}}],"story":{"problem":"layer-এর মান অযথা বড়-ছোট হলে শেখা অস্থির হয়।","idea":"মানগুলোকে একই মাপের কাছে নিয়ে আসা (গড় বাদ, ছড়ানো দিয়ে ভাগ)। এতে শেখা স্থির ও দ্রুত।","next":[{"label":"LayerNorm","why":"এক উদাহরণের ভেতরে","id":"common-extras--normalization--layernorm"},{"label":"BatchNorm","why":"পুরো batch জুড়ে","id":"common-extras--normalization--batchnorm"}]},"choose":[{"label":"LayerNorm","when":"Transformer / ভাষার model","why":"batch-আকারের উপর নির্ভর নয়","id":"common-extras--normalization--layernorm"},{"label":"BatchNorm","when":"CNN, ছবি, বড় batch","why":"batch-এর পরিসংখ্যান কাজে লাগে","id":"common-extras--normalization--batchnorm"}]},{"id":"common-extras--task-head","name":"Task Head","definition":"নির্দিষ্ট কাজের output তৈরির শেষ অংশ; এক বা একাধিক layer হতে পারে।","insight":{"fact":"এক model-এ একাধিক head থাকতে পারে: একটি object-এর শ্রেণি বলে, অন্যটি তার অবস্থান। Head-এর সংখ্যা আর attention head-এর সংখ্যা একই ধারণা নয়।"},"lessons":[{"k":"M09 · L10","t":"একাধিক Output: এক score, নাকি কয়েকটা Head?","h":"module-09-model-architecture/lecture-10-multiple-outputs-and-heads.md"}],"story":{"problem":"একই network দিয়ে সংখ্যা, দল, বা লেখা, নানা কাজ করাতে চাই।","idea":"শেষে কাজ অনুযায়ী একটা ছোট অংশ (head): সংখ্যার জন্য সরল unit, দলের জন্য softmax, ইত্যাদি। body একই থাকতে পারে, head বদলায়।"}}]},{"id":"convolutional-neural-network-cnn--attention-variant","name":"Attention যুক্ত variant","definition":"কিছু CNN-এর সঙ্গে attention যোগ করা হয়; এটি সব CNN-এর আবশ্যিক অংশ নয়।","insight":{"fact":"Attention কোনো একটি model পরিবারের ব্যক্তিগত সম্পত্তি নয়। মূল architecture-এর সঙ্গে নতুন mechanism যোগ করেও variant তৈরি হয়।","history":"২০১৪ সালে Bahdanau, Cho ও Bengio-এর অনুবাদ গবেষণায় source sentence-এর প্রাসঙ্গিক অংশে soft alignment ব্যবহার করা হয়। Transformer (২০১৭)-এর আগেও neural Attention ছিল।","sources":[{"title":"Bahdanau et al., 2014","url":"https://arxiv.org/abs/1409.0473"}]},"children":[{"id":"convolutional-neural-network-cnn--attention-variant--attention","name":"Attention","definition":"প্রাসঙ্গিকতার score অনুযায়ী বিভিন্ন অংশের তথ্য weighted sum দিয়ে মেশানোর mechanism।","insight":{"fact":"অনুবাদে পুরো source sentence একটি vector-এ গুঁজে রাখলে তথ্য হারানোর সমস্যা ছিল। প্রয়োজনমতো source-এর অংশে ফিরে দেখার ব্যবস্থা সেই bottleneck কমাতে সাহায্য করে।","history":"২০১৪ সালে Bahdanau, Cho ও Bengio-এর অনুবাদ গবেষণায় source sentence-এর প্রাসঙ্গিক অংশে soft alignment ব্যবহার করা হয়। Transformer (২০১৭)-এর আগেও neural Attention ছিল।","sources":[{"title":"Bahdanau et al., 2014","url":"https://arxiv.org/abs/1409.0473"}]},"children":[{"id":"convolutional-neural-network-cnn--attention-variant--attention--kinds","name":"ধরন","definition":"একই sequence-এর মধ্যে self-attention; অন্য sequence থেকে তথ্য নিতে cross-attention।","insight":{"fact":"Self-attention ও cross-attention-এর পার্থক্য মূলত Q, K, V কোথা থেকে আসছে। শুধু নাম দেখে একটিকে বেশি শক্তিশালী বলা যায় না।"},"children":[{"id":"convolutional-neural-network-cnn--attention-variant--attention--kinds--self-attention","name":"Self-attention","definition":"একই sequence থেকে query, key ও value নিয়ে তার অংশগুলোর মধ্যে তথ্য মেশানো।","insight":{"fact":"একই token থেকে Q, K, V বের হলেও আলাদা projection ব্যবহৃত হয়। তাই একই source মানে তিনটি vector হুবহু একই নয়।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"একটা বাক্যে একটা শব্দের অর্থ ঠিক হয় বাকি শব্দ দেখে।","idea":"একই sequence থেকে query, key, value নিয়ে প্রতিটা অংশ বাকিগুলোর দিকে তাকায় ও তথ্য মেশায়।"}},{"id":"convolutional-neural-network-cnn--attention-variant--attention--kinds--cross-attention","name":"Cross-attention","definition":"এক sequence-এর query দিয়ে অন্য sequence-এর key ও value থেকে তথ্য নেওয়া।","insight":{"fact":"অনুবাদের decoder নিজের বর্তমান তথ্য দিয়ে source sentence-এর representation খুঁজতে পারে। এখানে query এক দিক থেকে, key ও value অন্য দিক থেকে আসে।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"এক sequence-এর তথ্য আরেক sequence-এ আনতে হবে (অনুবাদ, ছবি থেকে লেখা)।","idea":"query আসে একটা অংশ থেকে, key ও value অন্য অংশ থেকে।"}}]},{"id":"convolutional-neural-network-cnn--attention-variant--attention--multi-head-attention","name":"Multi-head Attention","definition":"একাধিক attention হিসাব পাশাপাশি করে তাদের ফল একত্র করা।","insight":{"fact":"অনেক head আলাদা শেখা projection দিয়ে সম্পর্ক হিসাব করতে পারে। প্রতিটি head অবশ্যই একটি নির্দিষ্ট ব্যাকরণগত কাজ শিখবে—এমন নিশ্চয়তা নেই।","history":"২০১৭ সালের Transformer paper-এ একাধিক projected attention head-এর ফল একত্র করা হয়। একই representation-এর সম্পর্ক কয়েকভাবে হিসাব করাই উদ্দেশ্য।","sources":[{"title":"Attention Is All You Need, 2017","url":"https://arxiv.org/abs/1706.03762"}]},"children":[{"id":"convolutional-neural-network-cnn--attention-variant--attention--multi-head-attention--query-q","name":"Query (Q)","definition":"বর্তমান অবস্থানের জন্য কোন তথ্য প্রাসঙ্গিক, তা মিলিয়ে দেখার vector।","insight":{"fact":"Query সাধারণ ভাষায় লেখা প্রশ্ন নয়, সংখ্যার vector। বর্তমান অবস্থান কোন তথ্যের সঙ্গে মিল খুঁজবে, সে হিসাবের এক পক্ষ।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"কোন তথ্য খুঁজছি, সেটা বলার জন্য কিছু চাই।","idea":"প্রতিটা অবস্থানের 'আমি কী খুঁজছি' বর্ণনা।"}},{"id":"convolutional-neural-network-cnn--attention-variant--attention--multi-head-attention--key-k","name":"Key (K)","definition":"Query-এর সঙ্গে তুলনা করে প্রাসঙ্গিকতার score পাওয়ার vector।","insight":{"fact":"Key তালা খোলার password নয়। Query-এর সঙ্গে score করার vector; high score মানে ওই তথ্য বেশি ওজন পেতে পারে।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"কে কোন তথ্য দিতে পারে, তা বোঝার চিহ্ন।","idea":"প্রতিটা অবস্থানের 'আমি কী দিতে পারি' চিহ্ন। query-র সঙ্গে মিলিয়ে গুরুত্ব বের হয়।"}},{"id":"convolutional-neural-network-cnn--attention-variant--attention--multi-head-attention--value-v","name":"Value (V)","definition":"Attention weight অনুযায়ী মেশানো তথ্যের vector।","insight":{"fact":"Key দিয়ে প্রাসঙ্গিকতা মাপা হয়; value থেকে মূল তথ্য মেশে। কাকে দেখব আর তার কোন তথ্য নেব—এই দুই ভূমিকা আলাদা।"},"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"গুরুত্ব ঠিক হলে আসল তথ্যটা কোথা থেকে আসবে?","idea":"প্রতিটা অবস্থানের বহন করা আসল তথ্য। গুরুত্ব দিয়ে ভারী করে সব value যোগ।"}}],"lessons":[{"k":"M12 · L05","t":"Context ও Attention","h":"module-12-text-sequences-and-multimodal-models/lecture-05-context-and-attention.md"}],"story":{"problem":"একটা attention একই সঙ্গে ব্যাকরণ, অর্থ, দূরত্ব, সব ধরনের সম্পর্ক ধরতে পারে না।","idea":"কয়েকটা ছোট attention (head) পাশাপাশি চলে, প্রতিটা নিজের মতো করে সম্পর্ক ধরে, শেষে ফল জোড়া।"}},{"id":"convolutional-neural-network-cnn--attention-variant--attention--attention-mask","name":"Attention Mask","de
