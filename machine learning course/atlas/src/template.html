<header>

    <span class="eyebrow">LEARNING ATLAS</span>
    <h1>ML · শেখার মানচিত্র</h1>

<div class="topbar" id="topbar">
  <div class="topbar-in">

    <button type="button" role="tab" id="view-tree" aria-selected="true">গাছ</button>
    <button type="button" role="tab" id="view-path" aria-selected="false">গল্পের পথ <span id="path-count"></span></button>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Term খুঁজো…  ( / )" aria-label="Term খুঁজো">
    <div class="btn-group" role="group" aria-label="গাছের নিয়ন্ত্রণ">
      <button class="btn icon" id="expand" type="button" aria-label="সব শাখা খোলো" title="সব খোলো"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/><path d="M4 2.5l4 4 4-4" opacity=".45"/></svg></button>

      <button class="btn icon" id="theme" type="button" aria-label="theme বদলাও" title="theme">☾</button>
    </div>
    <span id="guide-pill"></span>
    <button class="btn primary" id="plan-toggle" type="button" aria-controls="plan" aria-expanded="false">আমার পথ <span class="badge" id="plan-count">০</span></button>
  </div>
  </div>
  <div class="fcrumb" id="focus-crumb" aria-label="এখন কোথায় আছো" hidden></div>
</div>

  <div class="cmp-tools">
