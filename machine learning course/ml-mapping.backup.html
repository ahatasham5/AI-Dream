:root{color-scheme:light;--ink:#173a36;--muted:#64756e;--line:#dce5dc;--paper:#fbfcf7;--accent:#247365}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans Bengali","Nirmala UI",system-ui,sans-serif;font-size:16px}header{max-width:1100px;margin:0 auto;padding:42px 24px 22px;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:clamp(24px,4vw,36px);margin:5px 0;font-weight:650}.eyebrow{font:11px system-ui;letter-spacing:3px;color:var(--accent)}header p{color:var(--muted);font-size:14px;margin:8px 0}.controls{display:flex;flex-wrap:wrap;gap:8px}button,input{font:inherit}button{cursor:pointer}input{background:white;border:1px solid var(--line);border-radius:10px;padding:10px 13px;width:230px;max-width:100%;color:var(--ink)}.control{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 12px;color:var(--ink);font-size:13px}main{max-width:1100px;margin:0 auto;padding:0 24px 60px}.map{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 45px #173a3607}ul{list-style:none;padding-left:26px;margin:0}li{position:relative;padding:5px 0}li:before{content:"";position:absolute;left:-15px;top:0;bottom:0;border-left:1px solid var(--line)}li:after{content:"";position:absolute;left:-15px;top:27px;width:14px;border-top:1px solid var(--line)}li:last-child:before{bottom:calc(100% - 27px)}.row{display:flex;align-items:center;gap:6px;min-height:43px}.toggle{flex:0 0 29px;width:29px;height:29px;border-radius:50%;border:1px solid var(--line);background:#f4f8f1;color:var(--accent);font-size:19px;line-height:1}.dot{width:29px;flex:0 0 29px;text-align:center;color:#a3b9ac}.term{border:1px solid transparent;background:transparent;text-align:left;border-radius:9px;padding:9px 12px;color:var(--ink);line-height:1.5;overflow-wrap:anywhere}.term:hover{background:#edf5ec;border-color:#d6e5d4}.term:focus-visible,.toggle:focus-visible,button:focus-visible{outline:3px solid #e2ad46;outline-offset:3px}.level-0>.row>.term{font-size:22px;background:var(--ink);color:white;font-weight:650}.level-1>.row>.term{background:#eff5ed;font-weight:600}.count{font:11px system-ui;color:var(--muted);padding-left:7px}.root{padding-left:0}.root>li:before,.root>li:after{display:none}[hidden]{display:none!important}#empty{padding:24px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:20px;padding:30px;max-width:520px;width:calc(100% - 32px);color:var(--ink);box-shadow:0 20px 100px #102d3340}dialog::backdrop{background:#102c3655;backdrop-filter:blur(3px)}dialog h2{font-size:23px;margin:20px 0 14px;padding-right:16px}dialog p{font-size:18px;line-height:1.9;margin-bottom:5px}.close{float:right;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:5px 10px}#crumb{font-size:12px;color:var(--muted);line-height:1.7;clear:both;padding-top:18px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column;padding-top:24px}.map{padding:12px 8px}main{padding:0 12px 30px}ul{padding-left:18px}.term{padding:8px;font-size:14px}li:before{left:-9px}li:after{left:-9px;width:8px}.controls{width:100%}input{width:100%}.level-0>.row>.term{font-size:20px}}

/* Dark reading theme */
:root{color-scheme:dark;--ink:#e0eee8;--muted:#a4b8ae;--line:#34483e;--paper:#101813;--accent:#8dd8b5}
body{background:var(--paper);color:var(--ink)}
.map{background:#17211b;box-shadow:0 12px 45px #00000025}
input,.control,.close{background:#202e25;color:var(--ink)}
input::placeholder{color:var(--muted)}
.toggle{background:#24372b;color:var(--accent)}
.dot{color:#819e8b}
.term:hover{background:#2b4032;border-color:#4e7059}
.level-0>.row>.term{background:#a2dfbc;color:#10291b}
.level-1>.row>.term{background:#263c2e;color:#e0eee8}
dialog{background:#1b2920;color:var(--ink);box-shadow:0 20px 100px #00000065}
dialog::backdrop{background:#050b08aa}
.control:hover,.close:hover,.toggle:hover{background:#324b3b}
::selection{background:#427357;color:#fff}

dialog{max-width:650px;max-height:85dvh;overflow-y:auto;overscroll-behavior:contain}#model-profile .profile-section{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}#model-profile h3{font-size:14px;color:var(--accent);margin:0 0 8px}#model-profile p{font-size:15px;line-height:1.85;margin:0}#model-profile .source-note{font-size:12px;color:var(--muted);margin:22px 0 14px}#model-profile summary{cursor:pointer;font-size:13px;color:var(--accent)}#model-profile a{display:block;color:#a5d9ff;font-size:13px;padding-top:10px;overflow-wrap:anywhere}.close{position:sticky;top:0;background:#202e25}

/* Comfortable reading: softer surfaces, larger type, measured line length. */
:root{--ink:#e3e5df;--muted:#b2b9b2;--line:#3a453e;--paper:#151a17;--accent:#b4d4bd;--reading-size:19px}
.map{background:#1c231e}

.reading-tools button:hover{background:#3b4d40}.reading-tools button:disabled{opacity:.4;cursor:default}

ttps://arxiv.org/abs/2501.17366"}], "story": ["একটি বাক্য বা সময়ের data-তে আগের অংশের খবর ছাড়া বর্তমান অংশ বোঝা কঠিন। RNN আগের ধাপের state পরের ধাপে নেয়। ফলে একই network বারবার চালিয়েও আগের তথ্যের প্রভাব রাখা যায়।", "দীর্ঘ ব্যবধানের তথ্য শেখানো কঠিন হওয়ায় LSTM-এর মতো gated variant আসে। Gate দিয়ে কোন তথ্য রাখা বা বাদ দেওয়া হবে তা শেখানো হয়। Transformer-এর উত্থান এই পুরো পরিবারকে অদৃশ্য করেনি।"], "role": "LSTM হলো RNN পরিবারের variant; vanilla RNN-এর সঙ্গে হুবহু এক model নয়।"}, "selection": {"problem": "পরপর আসা data-তে আগের state ব্যবহার করে prediction চাই।", "when": "Sequence-এর order জরুরি; LSTM/GRU-সহ recurrent processing পরীক্ষা করতে চাও।", "avoid": "দীর্ঘ dependency ও sequential training কঠিন হতে পারে; শুধু সময়ভিত্তিক data হলেই RNN সেরা নয়।", "compare": "Linear forecasting baseline, temporal CNN বা Transformer-এর সঙ্গে একই সময়-ভিত্তিক split-এ তুলনা করো।", "example": "Sensor-এর ধারাবাহিক reading থেকে পরের মান অনুমান।"}}, {"name": "Transformer", "definition": "Attention ব্যবহার করে input-এর বিভিন্ন অংশের সম্পর্ক হিসাব করা architecture।", "children": [{"name": "Input representation", "definition": "Token-কে সংখ্যায় প্রকাশ ও অবস্থানের তথ্য যুক্ত করার ব্যবস্থা।", "children": [{"name": "Embedding", "definition": "Token বা অন্য item-এর সংখ্যার vector representation; embedding layer সাধারণত শেখা table থেকে vector নেয়।", "children": [{"name": "Token", "definition": "Model-এর জন্য লেখাকে ভাগ করার একক; শব্দ, শব্দের অংশ বা চিহ্ন হতে পারে।", "insight": {"fact": "একটি বাংলা শব্দ এক বা একাধিক token হতে পারে। Token-এর সংখ্যা তাই শব্দের সংখ্যার সমান ধরে নেওয়া যায় না।"}}, {"name": "Vector", "definition": "সংখ্যার সাজানো তালিকা।", "insight": {"fact": "Vector-এর একটি coordinate একাই মানুষের বোঝা কোনো অর্থ বহন নাও করতে পারে। অর্থপূর্ণ সম্পর্ক পুরো vector বা vector-গুলোর তুলনায় থাকতে পারে।"}}], "insight": {"fact": "Token ID-এর সংখ্যা বড় হলেই অর্থ বড় হয় না। Embedding সেই ID-কে শেখা vector-এ বদলায়, যেখানে সম্পর্ক প্রকাশ করা সম্ভব।", "history": "Mikolov ও সহকর্মীদের ২০১৩ word-vector গবে ম দেখে একটিকে বেশি শক্তিশালী বলা যায় না।"}}, {"name": "Multi-head Attention", "definition": "একাধিক attention হিসাব পাশাপাশি করে তাদের ফল একত্র করা।", "children": [{"name": "Query (Q)", "definition": "বর্তমান অবস্থানের জন্য কোন তথ্য প্রাসঙ্গিক, তা মিলিয়ে দেখার vector।", "insight": {"fact": "Query সাধারণ ভাষায় লেখা প্রশ্ন নয়, সংখ্যার vector। বর্তমান অবস্থান কোন তথ্যের সঙ্গে মিল খুঁজবে, সে হিসাবের এক পক্ষ।"}}, {"name": "Key (K)", "definition": "Query-এর সঙ্গে তুলনা করে প্রাসঙ্গিকতার score পাওয়ার vector।", "insight": {"fact": "Key তালা খোলার password নয়। Query-এর সঙ্গে score করার vector; high score মানে ওই তথ্য বেশি ওজন পেতে পারে।"}}, {"name": "Value (V)", "definition": "Attention weight অনুযায়ী মেশানো তথ্যের vector।", "insight": {"fact": "Key দিয়ে প্রাসঙ্গিকতা মাপা হয়; value থেকে মূল তথ্য মেশে। কাকে দেখব আর তার কোন তথ্য নেব—এই দুই ভূমিকা আলাদা।"}}], "insight": {"fact": "অনেক head আলাদা শেখা projection দিয়ে সম্পর্ক হিসাব করতে পারে। প্রতিটি head অবশ্যই একটি নির্দিষ্ট ব্যাকরণগত কাজ শিখবে—এমন নিশ্চয়তা নেই।", "history": "২০১৭ সালের Transformer paper-এ একাধিক projected attention head-এর ফল একত্র করা হয়। একই representation-এর সম্পর্ক কয়েকভাবে হিসাব করাই উদ্দেশ্য।", "sources": [{"title": "Attention Is All You Need, 2017", "url": "https://arxiv.org/abs/1706.03762"}]}}, {"name": "Attention Mask", "definition": "কোন অবস্থানের তথ্য ব্যবহার করা যাবে, তা সীমিত করার নিয়ম; যেমন ভবিষ্যতের token আড়াল করা।", "insight": {"fact": "আগের token দিয়ে পরের token শেখানোর সময় ভবিষ্যৎ উত্তর দেখা চলবে না। Causal mask তাই ভবিষ্যৎ অবস্থান আড়াল করে।"}}], "insight": {"fact": "অনুবাদে পুরো source sentence একটি vector-এ গুঁজে রাখলে তথ্য হারানোর সমস্যা ছিল। প্রয়োজনমতো source-এর অংশে ফিরে দেখার ব্যবস্থা সেই bottleneck কমাতে সাহায্য করে।", "history": "২০১৪ সালে Bahdanau, Cho ও Bengio-এর অনুবাদ গবেষণায় source sentence-এর প্রাসঙ্গিক অংশে soft alignment ব্যবহার করা হয়। Transformer (২০১৭)-এর আগেও neural Attention ছিল।", "sources": [{"title": "Bahdanau et al., 2014", "url": "https://arxiv.org/abs/1409.0473"}]}}, {"name": "Transformer FFN", "definition": "প্রতিটি token-এর representation আলাদাভাবে প্রক্রিয়া করা ছোট network; একই weights সব অবস্থানে ব্যবহৃত হয়।", "children": [{"name": "Feed-forward Network (FFN)", "definition": "সামনে এগোনো সংযোগের network; recurrent feedback loop থাকে না।", "children": [{"name": "Linear / Dense Layer", "definition": "Input-এর weighted sum তৈরি করে; bias থাকতে পারে। Dense layer-এ প্রতিটি output সব input-এর সঙ্গে যুক্ত।", "children": [{"name": "Weight", "definition": "Input বা মধ্যবর্তী মানের প্রভাব নিয়ন্ত্রণকারী শেখা গুণক।", "insight": {"fact": "Weight ঋণাত্মকও হতে পারে। Input বাড়লে output কমার সম্পর্কও তাই শেখা যায়; তবে বড় weight দেখেই feature বেশি গুরুত্বপূর্ণ বলা যায় না, input-এর scale-ও দেখতে হয়।"}}, {"name": "Bias", "definition": "Weighted sum-এর সঙ্গে যোগ হওয়া শেখা মান।", "insight": {"fact": "Input শূন্য হলেও output শূন্য হওয়া বাধ্যতামূলক নয়—bias সেই স্বাধীনতা দেয়। এই গাণিতিক bias আর data-র সামাজিক পক্ষপাত একই অর্থ নয়।"}}, {"name": "Weighted Sum", "definition": "প্রতিটি মানকে তার weight দিয়ে গুণ করে ফলগুলো যোগ করা।", "insight": {"fact": "শুধু weight দিয়ে গুণ ও যোগ করলে ফল এখনও linear ধরনের হিসাব। অনেকগুলো এমন layer পরপর দিলেও nonlinear activation ছাড়া নতুন nonlinear সম্পর্ক তৈরি হয় না।"}}], "insight": {"fact": "একটি dense layer input-এর সংখ্যা থেকে output-এর সংখ্যা বদলাতে পারে। কিন্তু অনেক linear layer একত্র করলেই nonlinear model হয় না—activation-এর ভূমিকা সেখানেই।"}}, {"name": "Activation", "definition": "হিসাবের ফলের ওপর প্রয়োগ করা function; nonlinear activation জটিল সম্পর্ক প্রকাশ করতে সাহায্য করে।", "children": [{"name": "ReLU", "definition": "ঋণাত্মক মানকে শূন্য করে, অন্য মান অপরিবর্তিত রাখে।", "insight": {"fact": "ঋণাত্মক input-এ ReLU-এর output শূন্য। কোনো unit সব relevant input-এ এই অংশে পড়ে থাকলে শেখা আটকে যেতে পারে—একে প্রায়ই dying ReLU বলা হয়।"}}, {"name": "GELU / SiLU", "definition": "মসৃণ nonlinear activation; আধুনিক network-এর hidden layer-এ ব্যবহৃত হয়।", "insight": {"fact": "ReLU-এর মতো সব ঋণাত্মক মান একেবারে কেটে দেয় না; মসৃণভাবে scale করে। নাম কাছাকাছি হলেও GELU ও SiLU একই formula নয়।", "history": "Hendrycks ও Gimpel-এর ২০১৬ GELU paper মসৃণ activation নিয়ে গবেষণার একটি milestone। GELU ও SiLU আলাদা function—এই সালকে দুটোর একক আবিষ্কার-সাল ধরা হয়নি।", "sources": [{"title": "GELU, 2016", "url": "https://arxiv.org/abs/1606.08415"}]}}, {"name": "Sigmoid", "definition": "একটি score-কে ০ ও ১-এর মাঝের মানে রূপান্তর করে; binary classification-এ ব্যবহৃত হয়।", "insight": {"fact": "একটি score থেকে probability-সদৃশ সংখ্যা পেতে সুবিধা হয়। কিন্তু output ০.৯ হলেই model বাস্তবে ৯০% ক্ষেত্রে ঠিক—এমন নিশ্চয়তা নেই; calibration যাচাই দরকার।"}}, {"name": "Softmax", "definition": "একদল score-কে এমন probability-তে রূপান্তর করে যাদের যোগফল ১।", "insight": {"fact": "সব score-এ একই সংখ্যা যোগ করলেও probabilities বদলায় না। তাই কম্পিউটার বড় সংখ্যার সমস্যা এড়াতে প্রায়ই সবচেয়ে বড় score-টি সবার থেকে বাদ দিয়ে হিসাব করে।"}}], "insight": {"fact": "সব layer একই সরল হিসাব করলে গভীর করেও সম্পর্কের ধরন বদলাত না। Nonlinear activation সেই বাধা কাটায়।"}}], "insight": {"fact": "Feed-forward মানে forward computation-এ recurrent loop নেই। Training-এর সময় backpropagation ব্যবহার করা যায়—তাতে এটি recurrent network হয়ে যায় না।", "history": "MLP-এর দীর্ঘ ইতিহাসের পরে একই ধরনের FFN Transformer-এর block-এও ব্যবহৃত হয়। ২০২৪ সালের TimeMixer আবার MLP-ভিত্তিক forecasting-এর উদাহরণ দেয়।", "sources": [{"title": "TimeMixer, 2024", "url": "https://arxiv.org/abs/2405.14616"}]}}], "insight": {"fact": "Attention বিভিন্ন অবস্থানের তথ্য মেশায়, FFN প্রতিটি অবস্থানে আলাদাভাবে চলে। একই FFN weights সব অবস্থানে ব্যবহৃত হলেও input আলাদা বলে ফল আলাদা হয়।", "history": "২০১৭ সালের মূল Transformer-এ Attention-এর পাশে position-wise feed-forward অংশ ছিল। Attention দিয়ে পাওয়া তথ্যকে প্রতিটি অবস্থানে আরও রূপান্তর করা হয়।", "sources": [{"title": "Transformer, 2017", "url": "https://arxiv.org/abs/1706.03762"}]}}, {"name": "Block Normalization", "definition": "Transformer-এ সাধারণত LayerNorm বা RMSNorm-এর মতো normalization ব্যবহার হয়; BatchNorm সাধারণ পছন্দ নয়।", "children": [{"name": "LayerNorm", "definition": "প্রতিটি উদাহরণ বা token-এর নির্দিষ্ট feature dimension জুড়ে mean ও variance ব্যবহার করে normalization।", "insight": {"fact": "প্রতিটি উদাহরণ বা token-এর feature-গুলোর মধ্যে হিসাব করে। তাই একটি উদাহরণের normalization সরাসরি পাশের batch-এর উদাহরণগুলোর ওপর নির্ভর করতে হয় না।", "history": "Ba, Kiros ও Hinton-এর ২০১৬ সালের Layer Normalization paper batch-এর বদলে এক training case-এর feature জুড়ে normalization প্রস্তাব করে।", "sources": [{"title": "Layer Normalization, 2016", "url": "https://arxiv.org/abs/1607.06450"}]}}, {"name": "RMSNorm", "definition": "Mean বাদ না দিয়ে root-mean-square অনুযায়ী scale সামঞ্জস্য করা normalization।", "insight": {"fact": "LayerNorm-এর mean বাদ দেওয়ার ধাপটি সরিয়েও কাজে লাগতে পারে—এই প্রশ্ন থেকে সরলতর normalization। সব normalization-এর জন্য একই ধাপ দরকার নয়।", "history": "Zhang ও Sennrich ২০১৯ সালে mean সরানোর ধাপ ছাড়াই RMS দিয়ে scale ঠিক করার সহজতর পদ্ধতি পরীক্ষা করেন।", "sources": [{"title": "RMSNorm, 2019", "url": "https://arxiv.org/abs/1910.07467"}]}}], "insight": {"fact": "Normalization Attention-এর আগে না পরে—সেটিও architecture-এর সিদ্ধান্ত। শুধু component-এর তালিকা থেকে operation-এর পূর্ণ ক্রম বোঝা যায় না।"}}, {"name": "Residual Connection", "definition": "কোনো block-এর input-কে সেই block-এর ফলের সঙ্গে যোগ করার সংযোগ।", "insight": {"fact": "Block-কে পুরো output শিখতে না দিয়ে input-এর সঙ্গে কী পরিবর্তন যোগ হবে তা শেখানো যায়। Input-এর সরাসরি পথ গভীর network শেখাতে সাহায্য করে।", "history": "He ও সহকর্মীদের ResNet paper ২০১৫ সালে প্রকাশিত হয়। Input-এর shortcut যোগ করে অনেক গভীর image network শেখানোর সফল উদাহরণ দেখায়; সব skip connection-এর সূচনা এই paper নয়।", "sources": [{"title": "Deep Residual Learning, 2015", "url": "https://arxiv.org/abs/1512.03385"}]}}], "insight": {"fact": "একই ধরনের block বারবার থাকে, কিন্তু তাদের weights সাধারণত আলাদা। “একই গঠন” মানেই “একই শেখা মান” নয়।", "history": "২০১৭ সালের মূল Transformer-এ Attention-এর পাশে position-wise feed-forward অংশ ছিল। Attention দিয়   const heading=document.createElement('h3');heading.textContent=title;
  const text=document.createElement('p');text.textContent=insight[key];section.append(heading,text);box.append(section);
 }
 if(insight.sources?.length){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='ইতিহাসের সূত্র';details.append(summary);for(const source of insight.sources){const link=document.createElement('a');link.href=source.url;link.textContent=source.title;link.target='_blank';link.rel='noopener noreferrer';details.append(link);}box.append(details);}
}

function renderProfile(node){
 const box=document.querySelector('#model-profile');box.replaceChildren();renderMathDetail(node,box);renderSettingPurpose(node,box);renderSelection(node,box);renderTraining(node,box);renderUsage(node,box);renderInsight(node,box);if(!node.profile)return;
 const p=node.profile;
 function section(title,paragraphs){const sec=document.createElement('section');sec.className='profile-section';const h=document.createElement('h3');h.textContent=title;sec.append(h);for(const value of paragraphs){const para=document.createElement('p');para.textContent=value;sec.append(para);}box.append(sec);}
 section('সমস্যা থেকে ধারণার জন্ম',p.story||[p.why]);
 section('ইতিহাসের সময়রেখা',[p.history]);
 section('পরে কোথায় কাজে লাগল',[p.uses]);
 section('নির্দিষ্ট model বা কাজের উদাহরণ',[p.status]);
 if(p.role)section('এখানে model, নাকি তার technique?',[p.role]);
 const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='সূত্র ও যাচাইয়ের তথ্য';details.append(summary);
 const note=document.createElement('p');note.className='source-note';note.textContent='যাচাই: ১৭ অক্টোবর ২০২৬। এখানে নির্দিষ্ট নথিভুক্ত উদাহরণ দেওয়া হয়েছে—বিশ্বের সর্বশেষ ব্যবহার বা জনপ্রিয়তার ranking নয়। ইতিহাস বাস্তব ঘটনার ভিত্তিতে; ব্যাখ্যার উদাহরণকে আবিষ্কারের ঘটনা বলা হয়নি।';details.append(note);
 for(const source of p.sources){const a=document.createElement('a');a.href=source.url;a.textContent=source.title;a.target='_blank';a.rel='noopener noreferrer';details.append(a);}box.append(details);
}
const root=build(data,tree,0);
function filter(r,q,parentMatch=false){const match=r.node.name.toLocaleLowerCase().includes(q);let childMatch=false;for(const child of r.children){if(filter(child,q,parentMatch||match))childMatch=true;}const visible=!q||parentMatch||match||childMatch;r.li.hidden=!visible;if(q)setOpen(r,visible);else setOpen(r,r.depth===0);return visible;}
search.addEventListener('input',()=>{const q=search.value.trim().toLocaleLowerCase();document.querySelector('#empty').hidden=filter(root,q);});
for(const [id,open] of [['expand',true],['collapse',false]])document.getElementById(id).onclick=()=>{search.value='';document.querySelector('#empty').hidden=true;records.forEach(r=>{r.li.hidden=false;setOpen(r,open||r.depth===0);});};
document.querySelector('#close').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal){const b=modal.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)modal.close();}});

let readingSize=19;
try{const saved=Number(localStorage.getItem('ml-reading-size'));if(saved>=17&&saved<=25)readingSize=saved;}catch{}
function applyReadingSize(){document.documentElement.style.setProperty('--reading-size',readingSize+'px');document.querySelector('#font-size').textContent=readingSize+'px';document.querySelector('#font-smaller').disabled=readingSize<=17;document.querySelector('#font-larger').disabled=readingSize>=25;try{localStorage.setItem('ml-reading-size',String(readingSize));}catch{}}
document.querySelector('#font-smaller').onclick=()=>{readingSize=Math.max(17,readingSize-1);applyReadingSize();};
document.querySelector('#font-larger').onclick=()=>{readingSize=Math.min(25,readingSize+1);applyReadingSize();};
applyReadingSize();
